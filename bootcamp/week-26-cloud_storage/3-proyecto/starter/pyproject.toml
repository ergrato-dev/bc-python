[project]
name = "studio-cloud-backup"
version = "0.1.0"
description = "Backup automático de assets Studio BC a S3 y Google Drive"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-mock", "boto3-stubs[s3]"]

[tool.mypy]
strict = true
