[project]
name = "studio-production-pipeline"
version = "0.1.0"
description = "Pipeline end-to-end de producción audiovisual — Studio BC Fase 3"
requires-python = ">=3.12"
dependencies = [
    "watchdog>=4.0",
    "ffmpeg-python>=0.2",
    "boto3>=1.34",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "slack-sdk>=3.27",
    "httpx>=0.27",
    "rich>=13.7",
    "structlog>=24.0",
    "tenacity>=8.2",
    "pydantic-settings>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "boto3-stubs[s3]",
]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
