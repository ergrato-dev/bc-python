<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">Qué significa un intervalo de confianza del 95 %</title>
  <desc id="d">Veinte muestras de 20 días, sacadas de la misma población, cuya media de verdad es 20 °C. Cada muestra da su media (el punto) y su intervalo del 95 % (la barra). Diecinueve barras cruzan la línea de la media de verdad; una, en rojo, no la cruza. El 95 % es del método: de cada 100 muestras, unas 95 dan un intervalo que contiene la media de verdad. De un intervalo concreto no sabes si es de los buenos.</desc>
