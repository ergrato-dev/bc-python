<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-labelledby="t d">
  <title id="t">Cuatro preguntas a una distribución</title>
  <desc id="d">La curva de una normal de media 20 y desviación 3, el modelo de la temperatura a mediodía. pdf da la altura de la curva en un punto. cdf da el área a la izquierda de un valor: P(T ≤ 23) = 0,841, sombreada en azul. sf da el área a la derecha: P(T &gt; 26) = 0,023, en rojo. ppf hace lo contrario que cdf: dado un área, devuelve el valor; el 95 % de los días quedan por debajo de 24,93. A la derecha, cada método con su resultado.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="880" height="470" rx="12" fill="#0f172a"/>
