[project]
name = "studio-distributor"
version = "0.1.0"
description = "Módulo de distribución: YouTube + Vimeo + Slack + Notion"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.120",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "PyVimeo>=0.9",
    "slack-sdk>=3.27",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-mock", "respx"]

[tool.mypy]
strict = true
