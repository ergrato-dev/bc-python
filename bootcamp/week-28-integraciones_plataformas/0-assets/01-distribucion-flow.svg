<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="sans-serif">
  <rect width="900" height="480" fill="#0d1117"/>
  <text x="450" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">studio-distributor — Flujo de Distribución</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFD43B"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- INPUT: Render final -->
  <rect x="340" y="55" width="220" height="55" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="450" y="78" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Render Final</text>
  <text x="450" y="96" fill="#8b949e" font-size="10" text-anchor="middle">spot_verano_v3_final.mp4</text>

  <line x1="450" y1="110" x2="450" y2="134" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- DISTRIBUTOR -->
  <rect x="310" y="136" width="280" height="55" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="2"/>
  <text x="450" y="159" fill="#FFD43B" font-size="12" font-weight="bold" text-anchor="middle">Distributor.distribute()</text>
  <text x="450" y="177" fill="#8b949e" font-size="10" text-anchor="middle">orquesta todas las plataformas</text>

  <!-- Fan out arrows -->
  <line x1="380" y1="191" x2="165" y2="245" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="420" y1="191" x2="340" y2="245" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="480" y1="191" x2="560" y2="245" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="520" y1="191" x2="735" y2="245" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- YouTube -->
  <rect x="50" y="247" width="190" height="65" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="145" y="268" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">YouTube</text>
  <text x="145" y="284" fill="#8b949e" font-size="9" text-anchor="middle">upload resumable</text>
  <text x="145" y="297" fill="#8b949e" font-size="9" text-anchor="middle">thumbnail + playlist</text>
  <text x="145" y="310" fill="#3fb950" font-size="9" text-anchor="middle">→ youtu.be/VIDEO_ID</text>

  <!-- Vimeo -->
  <rect x="255" y="247" width="190" height="65" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="350" y="268" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Vimeo</text>
  <text x="350" y="284" fill="#8b949e" font-size="9" text-anchor="middle">upload TUS chunked</text>
  <text x="350" y="297" fill="#8b949e" font-size="9" text-anchor="middle">privacidad + álbum</text>
  <text x="350" y="310" fill="#3fb950" font-size="9" text-anchor="middle">→ vimeo.com/VIDEO_ID</text>

  <!-- Slack -->
  <rect x="460" y="247" width="190" height="65" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="555" y="268" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">Slack</text>
  <text x="555" y="284" fill="#8b949e" font-size="9" text-anchor="middle">Block Kit message</text>
  <text x="555" y="297" fill="#8b949e" font-size="9" text-anchor="middle">URLs + botones acción</text>
  <text x="555" y="310" fill="#3fb950" font-size="9" text-anchor="middle">→ #distribuciones</text>

  <!-- Notion -->
  <rect x="665" y="247" width="190" height="65" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="760" y="268" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Notion</text>
  <text x="760" y="284" fill="#8b949e" font-size="9" text-anchor="middle">update properties</text>
  <text x="760" y="297" fill="#8b949e" font-size="9" text-anchor="middle">estado + URLs</text>
  <text x="760" y="310" fill="#3fb950" font-size="9" text-anchor="middle">→ DB Proyectos</text>

  <!-- Converge to result -->
  <line x1="145" y1="312" x2="145" y2="380" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="350" y1="312" x2="350" y2="380" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="555" y1="312" x2="555" y2="380" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="760" y1="312" x2="760" y2="380" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="145" y1="380" x2="760" y2="380" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Result -->
  <rect x="270" y="382" width="360" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="450" y="402" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">DistributionResult</text>
  <text x="450" y="420" fill="#8b949e" font-size="9" text-anchor="middle">youtube_url, vimeo_url, slack_ts, notion_page_id, errors[]</text>

  <!-- Error note -->
  <rect x="60" y="443" width="780" height="24" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="450" y="459" fill="#8b949e" font-size="9" text-anchor="middle">Cada plataforma falla de forma independiente — un error en YouTube no cancela Vimeo/Slack/Notion</text>
</svg>
