<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="sans-serif">
  <rect width="820" height="460" fill="#0d1117"/>
  <text x="410" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">YouTube Data API v3 — Flujo de Upload</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- STEP 1: Credentials -->
  <rect x="30" y="60" width="160" height="60" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="110" y="83" fill="#FFD43B" font-size="11" font-weight="bold" text-anchor="middle">get_credentials()</text>
  <text x="110" y="99" fill="#8b949e" font-size="9" text-anchor="middle">token.json existe?</text>
  <text x="110" y="112" fill="#8b949e" font-size="9" text-anchor="middle">→ refresh o OAuth2 flow</text>

  <line x1="190" y1="90" x2="218" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- STEP 2: Build service -->
  <rect x="220" y="60" width="160" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="300" y="83" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">build("youtube","v3")</text>
  <text x="300" y="99" fill="#8b949e" font-size="9" text-anchor="middle">Google Discovery API</text>
  <text x="300" y="112" fill="#8b949e" font-size="9" text-anchor="middle">service object</text>

  <line x1="380" y1="90" x2="408" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- STEP 3: insert request -->
  <rect x="410" y="60" width="180" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="500" y="83" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">videos().insert()</text>
  <text x="500" y="99" fill="#8b949e" font-size="9" text-anchor="middle">snippet + status body</text>
  <text x="500" y="112" fill="#8b949e" font-size="9" text-anchor="middle">MediaFileUpload resumable</text>

  <line x1="590" y1="90" x2="618" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- STEP 4: next_chunk loop -->
  <rect x="620" y="55" width="170" height="70" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="705" y="78" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">next_chunk() loop</text>
  <text x="705" y="94" fill="#8b949e" font-size="9" text-anchor="middle">10 MB por chunk</text>
  <text x="705" y="108" fill="#8b949e" font-size="9" text-anchor="middle">status.progress() %</text>
  <text x="705" y="121" fill="#8b949e" font-size="8" text-anchor="middle">resumable si hay corte</text>

  <!-- Loop back arrow for chunks -->
  <path d="M790,65 Q820,65 820,45 Q820,25 705,25 Q590,25 590,65" stroke="#f85149" stroke-width="1" fill="none" stroke-dasharray="4,2" marker-end="url(#ar)"/>
  <text x="705" y="20" fill="#f85149" font-size="8" text-anchor="middle">hasta response != None</text>

  <!-- STEP 5: video_id -->
  <line x1="705" y1="125" x2="705" y2="165" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="610" y="167" width="190" height="50" rx="6" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="705" y="187" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">video_id = response["id"]</text>
  <text x="705" y="203" fill="#8b949e" font-size="9" text-anchor="middle">youtu.be/{video_id}</text>

  <!-- THUMBNAIL BRANCH -->
  <line x1="705" y1="217" x2="705" y2="255" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="610" y="257" width="190" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="705" y="277" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">thumbnails().set()</text>
  <text x="705" y="293" fill="#8b949e" font-size="9" text-anchor="middle">imagen JPG 1280×720</text>

  <!-- PLAYLIST BRANCH -->
  <line x1="705" y1="307" x2="705" y2="345" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="610" y="347" width="190" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="705" y="367" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">playlistItems().insert()</text>
  <text x="705" y="383" fill="#8b949e" font-size="9" text-anchor="middle">get_or_create_playlist()</text>

  <!-- Privacy states legend -->
  <rect x="30" y="200" width="540" height="190" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="300" y="222" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Privacy y Scopes</text>

  <text x="55" y="248" fill="#8b949e" font-size="10" font-weight="bold">Privacy Status:</text>
  <rect x="55" y="255" width="70" height="22" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="90" y="270" fill="#3fb950" font-size="9" text-anchor="middle">public</text>
  <rect x="135" y="255" width="70" height="22" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="170" y="270" fill="#FFD43B" font-size="9" text-anchor="middle">unlisted</text>
  <rect x="215" y="255" width="70" height="22" rx="3" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="250" y="270" fill="#f85149" font-size="9" text-anchor="middle">private</text>

  <text x="55" y="308" fill="#8b949e" font-size="10" font-weight="bold">OAuth2 Scopes necesarios:</text>
  <text x="55" y="325" fill="#58a6ff" font-size="9">youtube.upload</text>
  <text x="55" y="340" fill="#58a6ff" font-size="9">youtube (read/write completo)</text>
  <text x="55" y="355" fill="#8b949e" font-size="9">Token se guarda en youtube_token.json — se refresca automáticamente</text>

  <text x="55" y="380" fill="#8b949e" font-size="10" font-weight="bold">CategoryId comunes:</text>
  <text x="55" y="395" fill="#8b949e" font-size="9">22 = People & Blogs · 24 = Entertainment · 28 = Science & Technology · 27 = Education</text>
</svg>
