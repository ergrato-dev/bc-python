<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">Una condición de carrera y su Lock</title>
  <desc id="d">El contador vale 7 y dos hilos, A y B, ejecutan counter += 1. Sin Lock: A lee 7, B lee 7, A escribe 8 y B escribe 8. El contador termina en 8 y una suma se ha perdido. Con Lock: A coge el cerrojo, lee 7 y escribe 8 mientras B espera; A suelta el cerrojo, B lo coge, lee 8 y escribe 9. El contador termina en 9, el valor correcto.</desc>
  <rect width="820" height="420" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="210" y="36" text-anchor="middle" font-size="16" font-weight="700">Sin Lock</text>
    <text x="610" y="36" text-anchor="middle" font-size="16" font-weight="700">Con Lock</text>
    <text x="410" y="36" text-anchor="middle" font-size="12" fill="#94a3b8">counter = 7</text>

    <text x="24" y="70" font-size="12" fill="#94a3b8">tiempo ↓</text>
    <text x="130" y="70" text-anchor="middle" font-weight="700" fill="#38bdf8">hilo A</text>
    <text x="290" y="70" text-anchor="middle" font-weight="700" fill="#a78bfa">hilo B</text>

    <rect x="60" y="84" width="140" height="40" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="130" y="109" text-anchor="middle">lee 7</text>
    <rect x="220" y="134" width="140" height="40" rx="8" fill="#2e1065" stroke="#a78bfa"/>
    <text x="290" y="159" text-anchor="middle">lee 7</text>
    <rect x="60" y="184" width="140" height="40" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="130" y="209" text-anchor="middle">escribe 7 + 1 = 8</text>
    <rect x="220" y="234" width="140" height="40" rx="8" fill="#2e1065" stroke="#a78bfa"/>
    <text x="290" y="259" text-anchor="middle">escribe 7 + 1 = 8</text>
    <text x="210" y="300" text-anchor="middle" font-size="12" fill="#cbd5e1">B leyó antes de que A escribiera</text>

    <rect x="60" y="320" width="300" height="70" rx="8" fill="#450a0a" stroke="#f87171"/>
    <text x="210" y="349" text-anchor="middle" font-weight="700" fill="#f87171">counter = 8</text>
    <text x="210" y="372" text-anchor="middle" font-size="13">una suma perdida</text>

    <line x1="410" y1="60" x2="410" y2="396" stroke="#334155" stroke-width="2"/>

    <text x="530" y="70" text-anchor="middle" font-weight="700" fill="#38bdf8">hilo A</text>
    <text x="690" y="70" text-anchor="middle" font-weight="700" fill="#a78bfa">hilo B</text>
    <rect x="452" y="80" width="156" height="148" rx="10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="530" y="98" text-anchor="middle" font-size="12" fill="#fbbf24">coge el Lock</text>
    <rect x="460" y="106" width="140" height="40" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="530" y="131" text-anchor="middle">lee 7</text>
    <rect x="460" y="156" width="140" height="40" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="530" y="181" text-anchor="middle">escribe 7 + 1 = 8</text>
    <text x="530" y="218" text-anchor="middle" font-size="12" fill="#fbbf24">lo suelta</text>
    <rect x="620" y="106" width="140" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-dasharray="4 4"/>
    <text x="690" y="146" text-anchor="middle" fill="#94a3b8">espera</text>
    <text x="690" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">en el with lock</text>

    <rect x="612" y="236" width="156" height="148" rx="10" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="690" y="254" text-anchor="middle" font-size="12" fill="#fbbf24">coge el Lock</text>
    <rect x="620" y="262" width="140" height="40" rx="8" fill="#2e1065" stroke="#a78bfa"/>
    <text x="690" y="287" text-anchor="middle">lee 8</text>
    <rect x="620" y="312" width="140" height="40" rx="8" fill="#2e1065" stroke="#a78bfa"/>
    <text x="690" y="337" text-anchor="middle">escribe 8 + 1 = 9</text>
    <text x="690" y="374" text-anchor="middle" font-size="12" fill="#fbbf24">lo suelta</text>

    <rect x="452" y="320" width="148" height="70" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="526" y="349" text-anchor="middle" font-weight="700" fill="#4ade80">counter = 9</text>
    <text x="526" y="372" text-anchor="middle" font-size="13">correcto</text>
  </g>
</svg>
