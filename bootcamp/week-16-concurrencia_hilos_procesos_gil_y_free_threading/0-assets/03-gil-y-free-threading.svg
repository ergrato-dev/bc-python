    <rect x="328" y="267" width="12" height="16" rx="3" fill="#38bdf8"/>
    <text x="770" y="307" text-anchor="end" font-size="12" fill="#4ade80">4 tareas: poco más que el tiempo de 1</text>
    <text x="24" y="330" font-size="15" font-weight="700">Sin GIL (3.14t) · hilos que calculan</text>
    <text x="796" y="330" text-anchor="end" font-size="12" fill="#94a3b8">cada uno en su núcleo, a la vez</text>
    <text x="24" y="359" font-size="12" fill="#cbd5e1">hilo 1</text>
    <line x1="130" y1="354" x2="770" y2="354" stroke="#334155"/>
    <text x="24" y="381" font-size="12" fill="#cbd5e1">hilo 2</text>
    <line x1="130" y1="376" x2="770" y2="376" stroke="#334155"/>
    <text x="24" y="403" font-size="12" fill="#cbd5e1">hilo 3</text>
    <line x1="130" y1="398" x2="770" y2="398" stroke="#334155"/>
    <text x="24" y="425" font-size="12" fill="#cbd5e1">hilo 4</text>
    <line x1="130" y1="420" x2="770" y2="420" stroke="#334155"/>
    <rect x="130" y="346" width="160" height="16" rx="3" fill="#38bdf8"/>
    <rect x="130" y="368" width="160" height="16" rx="3" fill="#38bdf8"/>
    <rect x="130" y="390" width="160" height="16" rx="3" fill="#38bdf8"/>
    <rect x="130" y="412" width="160" height="16" rx="3" fill="#38bdf8"/>
    <text x="770" y="452" text-anchor="end" font-size="12" fill="#4ade80">4 tareas: el tiempo de 1</text>
    <rect x="130" y="476" width="24" height="12" rx="3" fill="#38bdf8"/>
    <text x="162" y="487" font-size="12" fill="#cbd5e1">ejecuta código Python</text>
    <rect x="350" y="476" width="24" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="382" y="487" font-size="12" fill="#cbd5e1">espera E/S (sin usar el GIL)</text>
    <text x="796" y="487" text-anchor="end" font-size="12" fill="#94a3b8">tiempo →</text>
  </g>
</svg>
