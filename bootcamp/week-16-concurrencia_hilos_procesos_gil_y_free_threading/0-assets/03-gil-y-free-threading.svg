    <rect x="292" y="201" width="12" height="16" rx="3" fill="#38bdf8"/>
    <rect x="142" y="223" width="12" height="16" rx="3" fill="#38bdf8"/>
    <rect x="156" y="224" width="146" height="14" rx="3" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <rect x="304" y="223" width="12" height="16" rx="3" fill="#38bdf8"/>
