<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="t d">
  <title id="t">El GIL frente a free-threading</title>
  <desc id="d">Tres líneas de tiempo con cuatro hilos. Con GIL y hilos que calculan: el GIL pasa de un hilo a otro cada pocos milisegundos y en cada momento solo uno avanza, así que los cuatro tardan cuatro veces lo que uno. Con GIL y hilos que esperan E/S: cada hilo calcula un momento y suelta el GIL mientras espera, las esperas se solapan y los cuatro tardan poco más que uno. Sin GIL, en Python 3.14t, los cuatro hilos calculan a la vez en cuatro núcleos y terminan en el tiempo de uno.</desc>
  <rect width="820" height="500" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="24" y="40" font-size="15" font-weight="700">Con GIL · hilos que calculan</text>
    <text x="796" y="40" text-anchor="end" font-size="12" fill="#94a3b8">en cada momento, solo uno avanza</text>
    <text x="24" y="69" font-size="12" fill="#cbd5e1">hilo 1</text>
    <line x1="130" y1="64" x2="770" y2="64" stroke="#334155"/>
    <text x="24" y="91" font-size="12" fill="#cbd5e1">hilo 2</text>
    <line x1="130" y1="86" x2="770" y2="86" stroke="#334155"/>
    <text x="24" y="113" font-size="12" fill="#cbd5e1">hilo 3</text>
    <line x1="130" y1="108" x2="770" y2="108" stroke="#334155"/>
    <text x="24" y="135" font-size="12" fill="#cbd5e1">hilo 4</text>
    <line x1="130" y1="130" x2="770" y2="130" stroke="#334155"/>
    <rect x="130" y="56" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="170" y="78" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="210" y="100" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="250" y="122" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="290" y="56" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="330" y="78" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="370" y="100" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="410" y="122" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="450" y="56" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="490" y="78" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="530" y="100" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="570" y="122" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="610" y="56" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="650" y="78" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="690" y="100" width="38" height="16" rx="3" fill="#38bdf8"/>
    <rect x="730" y="122" width="38" height="16" rx="3" fill="#38bdf8"/>
    <text x="770" y="162" text-anchor="end" font-size="12" fill="#f87171">4 tareas: el tiempo de 4</text>
    <text x="24" y="185" font-size="15" font-weight="700">Con GIL · hilos que esperan E/S</text>
    <text x="796" y="185" text-anchor="end" font-size="12" fill="#94a3b8">esperan a la vez: el GIL queda libre</text>
    <text x="24" y="214" font-size="12" fill="#cbd5e1">hilo 1</text>
    <line x1="130" y1="209" x2="770" y2="209" stroke="#334155"/>
    <text x="24" y="236" font-size="12" fill="#cbd5e1">hilo 2</text>
    <line x1="130" y1="231" x2="770" y2="231" stroke="#334155"/>
    <text x="24" y="258" font-size="12" fill="#cbd5e1">hilo 3</text>
    <line x1="130" y1="253" x2="770" y2="253" stroke="#334155"/>
    <text x="24" y="280" font-size="12" fill="#cbd5e1">hilo 4</text>
    <line x1="130" y1="275" x2="770" y2="275" stroke="#334155"/>
    <rect x="130" y="201" width="12" height="16" rx="3" fill="#38bdf8"/>
