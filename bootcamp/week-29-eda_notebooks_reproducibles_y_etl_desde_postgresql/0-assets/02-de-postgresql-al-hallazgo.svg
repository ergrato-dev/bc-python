<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
  <title id="t">De PostgreSQL al hallazgo</title>
  <desc id="d">extraer lee las medidas con read_sql, añade el nivel y escribe instantanea.csv con su huella SHA-256; el notebook lee esa instantánea, comprueba la huella y escribe sus hallazgos.</desc>
