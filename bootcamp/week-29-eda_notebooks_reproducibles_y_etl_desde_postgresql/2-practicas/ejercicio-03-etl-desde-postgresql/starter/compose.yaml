# El PostgreSQL del ejercicio 03 de la semana 29, en el puerto 5433 de tu máquina, para no
# chocar con el PostgreSQL de tu proyecto (5432). Usuario y contraseña de desarrollo, solo
# para tu máquina.
name: practicas-semana-29
services:
  db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_USER: practicas
      POSTGRES_PASSWORD: practicas
      POSTGRES_DB: practicas
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "practicas", "-d", "practicas"]
      interval: 2s
      timeout: 5s
      retries: 15
