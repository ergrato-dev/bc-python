<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">Falsos positivos acumulados</title>
  <desc id="d">Con 2 etiquetas hay un par y un 5 % de probabilidad de un falso positivo; con 4, 6 pares y 26,5 %; con 5, 10 pares y 40,1 %; con 7, 21 pares y 65,9 %; con 10, 45 pares y 90,1 %.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="900" height="420" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700">Con α = 0,05, cada comparación más es otra oportunidad de equivocarse</text>
    <text x="450" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">Probabilidad de al menos un falso positivo comparando todos los pares de etiquetas iguales: 1 − 0,95^m</text>
    <line x1="110" y1="330" x2="840" y2="330" stroke="#94a3b8"/>
    <text x="102" y="335.0" text-anchor="end" font-size="12" fill="#94a3b8">0 %</text>
    <text x="102" y="220.0" text-anchor="end" font-size="12" fill="#94a3b8">50 %</text>
    <line x1="110" y1="215.0" x2="840" y2="215.0" stroke="#334155" stroke-dasharray="4 4"/>
    <text x="102" y="105.0" text-anchor="end" font-size="12" fill="#94a3b8">100 %</text>
    <line x1="110" y1="100.0" x2="840" y2="100.0" stroke="#334155" stroke-dasharray="4 4"/>
    <line x1="110" y1="318.5" x2="840" y2="318.5" stroke="#fcd34d" stroke-dasharray="6 4"/>
    <text x="846" y="322.5" font-size="12" fill="#fcd34d">α</text>
    <rect x="150" y="318.5" width="80" height="11.5" fill="#86efac"/>
    <text x="190" y="308.5" text-anchor="middle" font-size="15" font-weight="700">5,0 %</text>
    <text x="190" y="352" text-anchor="middle" font-size="13">2 etiquetas</text>
    <text x="190" y="370" text-anchor="middle" font-size="12" fill="#94a3b8">m = 1 pares</text>
    <rect x="290" y="269.1" width="80" height="60.9" fill="#fcd34d"/>
    <text x="330" y="259.1" text-anchor="middle" font-size="15" font-weight="700">26,5 %</text>
    <text x="330" y="352" text-anchor="middle" font-size="13">4 etiquetas</text>
    <text x="330" y="370" text-anchor="middle" font-size="12" fill="#94a3b8">m = 6 pares</text>
    <rect x="430" y="237.7" width="80" height="92.3" fill="#fcd34d"/>
    <text x="470" y="227.7" text-anchor="middle" font-size="15" font-weight="700">40,1 %</text>
    <text x="470" y="352" text-anchor="middle" font-size="13">5 etiquetas</text>
    <text x="470" y="370" text-anchor="middle" font-size="12" fill="#94a3b8">m = 10 pares</text>
    <rect x="570" y="178.3" width="80" height="151.7" fill="#fca5a5"/>
    <text x="610" y="168.3" text-anchor="middle" font-size="15" font-weight="700">65,9 %</text>
    <text x="610" y="352" text-anchor="middle" font-size="13">7 etiquetas</text>
    <text x="610" y="370" text-anchor="middle" font-size="12" fill="#94a3b8">m = 21 pares</text>
    <rect x="710" y="122.9" width="80" height="207.1" fill="#fca5a5"/>
    <text x="750" y="112.9" text-anchor="middle" font-size="15" font-weight="700">90,1 %</text>
    <text x="750" y="352" text-anchor="middle" font-size="13">10 etiquetas</text>
    <text x="750" y="370" text-anchor="middle" font-size="12" fill="#94a3b8">m = 45 pares</text>
    <text x="450" y="400" text-anchor="middle" font-size="13" fill="#93c5fd">La corrección de Benjamini-Hochberg devuelve el control: como mucho un 5 % de los hallazgos publicados son falsos</text>
  </g>
</svg>
