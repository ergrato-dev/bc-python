<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="sans-serif">
  <rect width="820" height="440" fill="#0d1117"/>
  <text x="410" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Ciclo de Alertas — Threshold + Cooldown</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFD43B"/>
    </marker>
  </defs>

  <!-- EVALUATE -->
  <rect x="300" y="60" width="220" height="55" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="410" y="83" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">AlertManager.evaluate()</text>
  <text x="410" y="101" fill="#8b949e" font-size="9" text-anchor="middle">cada N segundos con snapshot de métricas</text>

  <line x1="410" y1="115" x2="410" y2="143" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- CHECK RULE -->
  <polygon points="410,145 530,175 410,205 290,175" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="410" y="171" fill="#FFD43B" font-size="10" font-weight="bold" text-anchor="middle">rule.check(metrics)</text>
  <text x="410" y="187" fill="#8b949e" font-size="9" text-anchor="middle">error_rate &gt; threshold?</text>

  <!-- NO branch -->
  <line x1="290" y1="175" x2="140" y2="175" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="212" y="167" fill="#3fb950" font-size="10" text-anchor="middle">NO</text>
  <rect x="40" y="153" width="98" height="44" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="89" y="172" fill="#3fb950" font-size="10" text-anchor="middle">No alerta</text>
  <text x="89" y="188" fill="#8b949e" font-size="8" text-anchor="middle">esperar</text>

  <!-- YES branch -->
  <line x1="530" y1="175" x2="620" y2="175" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="574" y="167" fill="#58a6ff" font-size="10" text-anchor="middle">SÍ</text>

  <!-- CHECK COOLDOWN -->
  <polygon points="680,155 760,175 680,195 600,175" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="680" y="171" fill="#FFD43B" font-size="10" font-weight="bold" text-anchor="middle">cooldown?</text>
  <text x="680" y="185" fill="#8b949e" font-size="9" text-anchor="middle">t - last_fired</text>

  <!-- In cooldown -->
  <line x1="680" y1="155" x2="680" y2="100" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="680" y1="100" x2="520" y2="100" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="620" y="93" fill="#8b949e" font-size="9" text-anchor="middle">en cooldown → skip</text>

  <!-- Past cooldown -->
  <line x1="680" y1="195" x2="680" y2="255" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="700" y="230" fill="#f85149" font-size="9">fuera de cooldown</text>

  <!-- FIRE -->
  <rect x="580" y="257" width="200" height="55" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="680" y="280" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">rule.fire(metrics)</text>
  <text x="680" y="298" fill="#8b949e" font-size="9" text-anchor="middle">last_fired = time.time()</text>

  <!-- Send notifications -->
  <line x1="680" y1="312" x2="680" y2="350" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="580" y="352" width="200" height="50" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="680" y="372" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">_send(message)</text>
  <text x="617" y="392" fill="#f85149" font-size="9" text-anchor="middle">Slack</text>
  <text x="680" y="392" fill="#8b949e" font-size="9" text-anchor="middle">+</text>
  <text x="743" y="392" fill="#58a6ff" font-size="9" text-anchor="middle">Discord</text>

  <!-- Timeline illustration -->
  <rect x="30" y="300" width="500" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="280" y="320" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Línea de tiempo — Cooldown de 5 min</text>

  <!-- Timeline bar -->
  <line x1="55" y1="360" x2="510" y2="360" stroke="#30363d" stroke-width="2"/>

  <!-- T0: first alert -->
  <line x1="100" y1="345" x2="100" y2="375" stroke="#f85149" stroke-width="2"/>
  <text x="100" y="342" fill="#f85149" font-size="9" text-anchor="middle">t=0</text>
  <text x="100" y="388" fill="#f85149" font-size="9" text-anchor="middle">ALERTA</text>
  <text x="100" y="400" fill="#8b949e" font-size="8" text-anchor="middle">fired!</text>

  <!-- Cooldown zone -->
  <rect x="100" y="348" width="200" height="24" rx="3" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="363" fill="#f85149" font-size="8" text-anchor="middle">cooldown 5 min — skip</text>

  <!-- T during cooldown: suppressed -->
  <line x1="200" y1="350" x2="200" y2="370" stroke="#8b949e" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="200" y="388" fill="#8b949e" font-size="8" text-anchor="middle">suprimida</text>

  <!-- T after cooldown: second alert -->
  <line x1="300" y1="345" x2="300" y2="375" stroke="#3fb950" stroke-width="2"/>
  <text x="300" y="342" fill="#3fb950" font-size="9" text-anchor="middle">t=5min</text>
  <text x="300" y="388" fill="#3fb950" font-size="9" text-anchor="middle">ALERTA</text>
  <text x="300" y="400" fill="#8b949e" font-size="8" text-anchor="middle">ok ahora</text>

  <!-- Cooldown zone 2 -->
  <rect x="300" y="348" width="200" height="24" rx="3" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="400" y="363" fill="#f85149" font-size="8" text-anchor="middle">cooldown 5 min — skip</text>
</svg>
