<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="sans-serif">
  <rect width="880" height="480" fill="#0d1117"/>
  <text x="440" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">studio-monitor — Arquitectura de Monitoreo</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFD43B"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- PIPELINE (left) -->
  <rect x="20" y="70" width="200" height="300" rx="8" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="120" y="92" fill="#FFD43B" font-size="12" font-weight="bold" text-anchor="middle">Pipeline</text>

  <rect x="40" y="105" width="160" height="36" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="120" y="127" fill="#e6edf3" font-size="10" text-anchor="middle">IngestStage</text>

  <rect x="40" y="152" width="160" height="36" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="120" y="174" fill="#e6edf3" font-size="10" text-anchor="middle">ValidateStage</text>

  <rect x="40" y="199" width="160" height="36" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="120" y="221" fill="#e6edf3" font-size="10" text-anchor="middle">ProcessStage</text>

  <rect x="40" y="246" width="160" height="36" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="120" y="268" fill="#e6edf3" font-size="10" text-anchor="middle">ExportStage</text>

  <rect x="40" y="310" width="160" height="38" rx="5" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="120" y="325" fill="#8b949e" font-size="9" text-anchor="middle">structlog JSON</text>
  <text x="120" y="340" fill="#8b949e" font-size="9" text-anchor="middle">job_id, stage, duration_s</text>

  <!-- Pipeline → MetricsCollector -->
  <line x1="220" y1="200" x2="280" y2="200" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="250" y="193" fill="#8b949e" font-size="8" text-anchor="middle">record_stage()</text>

  <!-- Pipeline → StateStore -->
  <line x1="220" y1="240" x2="280" y2="280" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="240" y="270" fill="#8b949e" font-size="8" text-anchor="middle">transition()</text>

  <!-- METRICS COLLECTOR -->
  <rect x="282" y="140" width="200" height="100" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="382" y="163" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">MetricsCollector</text>
  <text x="382" y="181" fill="#8b949e" font-size="9" text-anchor="middle">throughput, error_rate</text>
  <text x="382" y="197" fill="#8b949e" font-size="9" text-anchor="middle">p95 por etapa</text>
  <text x="382" y="213" fill="#8b949e" font-size="9" text-anchor="middle">snapshot() → dict</text>
  <text x="382" y="229" fill="#8b949e" font-size="9" text-anchor="middle">→ .metrics.json</text>

  <!-- STATE STORE -->
  <rect x="282" y="260" width="200" height="80" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="382" y="283" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">StateStore</text>
  <text x="382" y="300" fill="#8b949e" font-size="9" text-anchor="middle">pending/running/done/failed</text>
  <text x="382" y="316" fill="#8b949e" font-size="9" text-anchor="middle">→ .pipeline_state.json</text>
  <text x="382" y="332" fill="#8b949e" font-size="9" text-anchor="middle">→ .dlq.jsonl</text>

  <!-- MetricsCollector → AlertManager -->
  <line x1="482" y1="190" x2="530" y2="190" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ALERT MANAGER -->
  <rect x="532" y="140" width="200" height="110" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="632" y="163" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">AlertManager</text>
  <text x="632" y="181" fill="#8b949e" font-size="9" text-anchor="middle">error_rate > 20%</text>
  <text x="632" y="197" fill="#8b949e" font-size="9" text-anchor="middle">throughput bajo</text>
  <text x="632" y="213" fill="#8b949e" font-size="9" text-anchor="middle">pipeline stalled</text>
  <text x="632" y="229" fill="#8b949e" font-size="9" text-anchor="middle">cooldown: 5min</text>
  <text x="632" y="245" fill="#f85149" font-size="9" text-anchor="middle">→ Slack / Discord</text>

  <!-- AlertManager → Notifications -->
  <line x1="732" y1="195" x2="790" y2="160" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="792" y="130" width="74" height="40" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="829" y="148" fill="#f85149" font-size="9" text-anchor="middle">Slack</text>
  <text x="829" y="162" fill="#8b949e" font-size="8" text-anchor="middle">webhook</text>

  <line x1="732" y1="225" x2="790" y2="240" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="792" y="222" width="74" height="40" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="829" y="240" fill="#f85149" font-size="9" text-anchor="middle">Discord</text>
  <text x="829" y="254" fill="#8b949e" font-size="8" text-anchor="middle">embed</text>

  <!-- HealthChecker -->
  <rect x="532" y="270" width="200" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="632" y="293" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">HealthChecker</text>
  <text x="632" y="311" fill="#8b949e" font-size="9" text-anchor="middle">disk, redis, state_file</text>
  <text x="632" y="327" fill="#8b949e" font-size="9" text-anchor="middle">WatchdogTimer</text>
  <text x="632" y="343" fill="#8b949e" font-size="9" text-anchor="middle">→ /health JSON</text>

  <line x1="482" y1="300" x2="530" y2="300" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- DASHBOARD -->
  <rect x="282" y="380" width="450" height="70" rx="8" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="507" y="403" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Rich Live Dashboard</text>
  <text x="360" y="425" fill="#8b949e" font-size="9" text-anchor="middle">Jobs table</text>
  <text x="490" y="425" fill="#8b949e" font-size="9" text-anchor="middle">Métricas</text>
  <text x="620" y="425" fill="#8b949e" font-size="9" text-anchor="middle">Health status</text>
  <text x="507" y="441" fill="#8b949e" font-size="9" text-anchor="middle">refresh cada 2s — lee .pipeline_state.json + .metrics.json</text>

  <line x1="382" y1="340" x2="382" y2="378" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="382" y1="240" x2="382" y2="378" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="632" y1="360" x2="632" y2="378" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
