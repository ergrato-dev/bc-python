<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="t d">
  <title id="t">El viaje de una petición</title>
  <desc id="d">Una petición POST /loads con un cuerpo JSON viaja de izquierda a derecha por cinco capas: el cliente (curl, un navegador o httpx), uvicorn, que es el servidor y habla HTTP por TCP, FastAPI sobre Starlette, que busca la ruta, Pydantic, que valida el cuerpo con LoadIn, y tu función post_load, que usa core y SQLAlchemy contra PostgreSQL. Entre uvicorn y FastAPI la frontera se llama ASGI. Si la ruta no existe, FastAPI responde 404 sin llamar a nada más; si el cuerpo no es válido, Pydantic hace que responda 422 sin llamar a tu función. La respuesta vuelve por el mismo camino: tu función devuelve un objeto de Python, FastAPI lo convierte en JSON y uvicorn lo envía con el código 201.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="860" height="460" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">Una petición atraviesa capas; cada una puede responder antes que tu función</text>

    <rect x="20" y="90" width="130" height="110" rx="8" fill="#1e293b" stroke="#94a3b8"/>
    <text x="85" y="120" text-anchor="middle" font-weight="700">cliente</text>
    <text x="85" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">curl, navegador,</text>
    <text x="85" y="162" text-anchor="middle" font-size="12" fill="#cbd5e1">httpx, TestClient</text>

    <rect x="185" y="90" width="130" height="110" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="250" y="120" text-anchor="middle" font-weight="700" fill="#7dd3fc">uvicorn</text>
    <text x="250" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">el servidor:</text>
    <text x="250" y="162" text-anchor="middle" font-size="12" fill="#cbd5e1">TCP y HTTP</text>

    <rect x="350" y="90" width="140" height="110" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="420" y="120" text-anchor="middle" font-weight="700" fill="#7dd3fc">FastAPI</text>
    <text x="420" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">sobre Starlette:</text>
    <text x="420" y="162" text-anchor="middle" font-size="12" fill="#cbd5e1">busca la ruta</text>

    <rect x="525" y="90" width="140" height="110" rx="8" fill="#422006" stroke="#fbbf24"/>
    <text x="595" y="120" text-anchor="middle" font-weight="700" fill="#fcd34d">Pydantic</text>
    <text x="595" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">valida el cuerpo</text>
    <text x="595" y="162" text-anchor="middle" font-size="12" fill="#cbd5e1">con LoadIn</text>

    <rect x="700" y="90" width="140" height="110" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="770" y="120" text-anchor="middle" font-weight="700" fill="#86efac">post_load</text>
    <text x="770" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">tu función: core,</text>
    <text x="770" y="162" text-anchor="middle" font-size="12" fill="#cbd5e1">SQLAlchemy, commit</text>

    <line x1="150" y1="120" x2="181" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#blue)"/>
    <line x1="315" y1="120" x2="346" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#blue)"/>
    <line x1="490" y1="120" x2="521" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#blue)"/>
    <line x1="665" y1="120" x2="696" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#blue)"/>
    <text x="85" y="76" text-anchor="middle" font-size="12" fill="#7dd3fc">POST /loads + JSON</text>
    <text x="332" y="76" text-anchor="middle" font-size="12" font-weight="700" fill="#94a3b8">ASGI</text>
    <line x1="332" y1="82" x2="332" y2="220" stroke="#94a3b8" stroke-dasharray="4 4"/>

    <line x1="696" y1="176" x2="669" y2="176" stroke="#4ade80" stroke-width="2" marker-end="url(#green)"/>
    <line x1="521" y1="176" x2="494" y2="176" stroke="#4ade80" stroke-width="2" marker-end="url(#green)"/>
    <line x1="346" y1="176" x2="319" y2="176" stroke="#4ade80" stroke-width="2" marker-end="url(#green)"/>
    <line x1="181" y1="176" x2="154" y2="176" stroke="#4ade80" stroke-width="2" marker-end="url(#green)"/>

    <rect x="700" y="250" width="140" height="56" rx="8" fill="#1e293b" stroke="#94a3b8"/>
    <text x="770" y="275" text-anchor="middle" font-weight="700">PostgreSQL</text>
    <text x="770" y="294" text-anchor="middle" font-size="12" fill="#cbd5e1">INSERT, COMMIT</text>
    <line x1="770" y1="200" x2="770" y2="246" stroke="#94a3b8" stroke-width="2" marker-end="url(#blue)"/>

    <path d="M420,200 C420,260 120,260 120,206" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#red)"/>
    <text x="300" y="222" text-anchor="middle" font-size="12" fill="#f87171">404: no hay ruta · 405: otro método</text>
    <path d="M595,200 C595,330 55,330 55,206" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#red)"/>
    <text x="400" y="320" text-anchor="middle" font-size="12" fill="#f87171">422: el cuerpo no cumple LoadIn; post_load no se llama</text>

    <text x="85" y="186" text-anchor="middle" font-size="12" fill="#86efac">← 201 + JSON</text>

    <rect x="20" y="370" width="820" height="66" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="396" font-size="13" fill="#cbd5e1">Ida (azul): texto HTTP, que uvicorn convierte en un diccionario ASGI, FastAPI en argumentos y Pydantic en un LoadIn.</text>
    <text x="40" y="418" font-size="13" fill="#cbd5e1">Vuelta (verde): tu función devuelve un LoadInfo; FastAPI lo convierte en JSON con su código, y uvicorn lo envía como HTTP.</text>
  </g>
</svg>
