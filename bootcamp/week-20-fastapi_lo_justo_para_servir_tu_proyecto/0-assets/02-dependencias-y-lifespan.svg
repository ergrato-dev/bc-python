<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d">
  <title id="t">Dependencias y lifespan</title>
  <desc id="d">Una línea de tiempo con dos escalas. Arriba, el lifespan dura toda la vida del servidor: al arrancar, make_engine crea el motor y su pool, que se guarda en app.state.engine; al parar, engine.dispose cierra las conexiones. Debajo, tres peticiones, cada una con su propia sesión: get_session abre una Session con el motor de app.state antes del yield, la ruta la usa y hace commit si escribe, y después del yield el with la cierra y devuelve la conexión al pool. En los tests, dependency_overrides cambia get_session por la sesión de la fixture, dentro de una transacción que se deshace.</desc>
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="860" height="440" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">Un motor para toda la vida del servidor; una sesión para cada petición</text>

    <line x1="40" y1="80" x2="820" y2="80" stroke="#94a3b8" stroke-width="2" marker-end="url(#grey)"/>
    <text x="824" y="70" text-anchor="end" font-size="12" fill="#94a3b8">tiempo</text>

    <rect x="40" y="96" width="780" height="54" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="60" y="120" font-weight="700" fill="#7dd3fc">lifespan</text>
    <text x="60" y="140" font-size="12" fill="#cbd5e1">antes del yield: app.state.engine = make_engine(url)</text>
    <text x="800" y="120" text-anchor="end" font-size="12" fill="#cbd5e1">después del yield:</text>
    <text x="800" y="140" text-anchor="end" font-size="12" fill="#cbd5e1">engine.dispose()</text>

    <rect x="120" y="176" width="190" height="130" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="215" y="198" text-anchor="middle" font-weight="700" fill="#86efac">GET /loads</text>
    <text x="134" y="222" font-size="12" fill="#cbd5e1">get_session: abre Session</text>
    <text x="134" y="242" font-size="12" fill="#fcd34d">yield session</text>
    <text x="134" y="262" font-size="12" fill="#cbd5e1">la ruta: list_loads</text>
    <text x="134" y="282" font-size="12" fill="#cbd5e1">el with: cierra Session</text>

    <rect x="335" y="176" width="190" height="130" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="430" y="198" text-anchor="middle" font-weight="700" fill="#86efac">POST /loads</text>
    <text x="349" y="222" font-size="12" fill="#cbd5e1">get_session: abre Session</text>
    <text x="349" y="242" font-size="12" fill="#fcd34d">yield session</text>
    <text x="349" y="262" font-size="12" fill="#cbd5e1">la ruta: save_series, commit</text>
    <text x="349" y="282" font-size="12" fill="#cbd5e1">el with: cierra Session</text>

    <rect x="550" y="176" width="190" height="130" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="645" y="198" text-anchor="middle" font-weight="700" fill="#86efac">GET /stats</text>
    <text x="564" y="222" font-size="12" fill="#cbd5e1">get_session: abre Session</text>
    <text x="564" y="242" font-size="12" fill="#fcd34d">yield session</text>
    <text x="564" y="262" font-size="12" fill="#cbd5e1">la ruta: label_stats</text>
    <text x="564" y="282" font-size="12" fill="#cbd5e1">el with: cierra Session</text>

    <line x1="215" y1="150" x2="215" y2="172" stroke="#94a3b8" stroke-dasharray="4 4" marker-end="url(#grey)"/>
    <line x1="430" y1="150" x2="430" y2="172" stroke="#94a3b8" stroke-dasharray="4 4" marker-end="url(#grey)"/>
    <line x1="645" y1="150" x2="645" y2="172" stroke="#94a3b8" stroke-dasharray="4 4" marker-end="url(#grey)"/>
    <rect x="245" y="156" width="370" height="14" fill="#0f172a"/>
    <text x="430" y="166" text-anchor="middle" font-size="11" fill="#94a3b8">cada sesión toma una conexión del pool y la devuelve al cerrarse</text>

    <rect x="40" y="330" width="780" height="86" rx="8" fill="#422006" stroke="#fbbf24"/>
    <text x="60" y="356" font-weight="700" fill="#fcd34d">En los tests: app.dependency_overrides[get_session] = lambda: session</text>
    <text x="60" y="380" font-size="12" fill="#cbd5e1">Las rutas reciben la sesión de la fixture, dentro de una transacción con SAVEPOINT: su commit no confirma nada de verdad,</text>
    <text x="60" y="400" font-size="12" fill="#cbd5e1">y el rollback del final deja PostgreSQL como estaba. Las rutas no cambian: solo cambia quién les da la sesión.</text>
  </g>
</svg>
