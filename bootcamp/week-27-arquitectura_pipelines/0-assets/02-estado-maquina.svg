<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="sans-serif">
  <rect width="820" height="460" fill="#0d1117"/>
  <text x="410" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Máquina de Estados — Job de Pipeline</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3fb950"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f85149"/>
    </marker>
    <marker id="ay" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FFD43B"/>
    </marker>
  </defs>

  <!-- PENDING -->
  <rect x="60" y="190" width="140" height="60" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="130" y="215" fill="#8b949e" font-size="13" font-weight="bold" text-anchor="middle">PENDING</text>
  <text x="130" y="235" fill="#8b949e" font-size="10" text-anchor="middle">en cola</text>

  <!-- PENDING → RUNNING -->
  <line x1="200" y1="220" x2="280" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/>
  <text x="240" y="213" fill="#58a6ff" font-size="9" text-anchor="middle">pipeline.run()</text>

  <!-- RUNNING -->
  <rect x="282" y="190" width="156" height="60" rx="8" fill="#161b22" stroke="#FFD43B" stroke-width="2"/>
  <text x="360" y="215" fill="#FFD43B" font-size="13" font-weight="bold" text-anchor="middle">RUNNING</text>
  <text x="360" y="235" fill="#8b949e" font-size="10" text-anchor="middle">etapa activa</text>

  <!-- RUNNING → DONE -->
  <line x1="438" y1="205" x2="548" y2="160" stroke="#3fb950" stroke-width="2" marker-end="url(#ag)"/>
  <text x="500" y="178" fill="#3fb950" font-size="9" text-anchor="middle">todas las etapas OK</text>

  <!-- DONE -->
  <rect x="550" y="120" width="140" height="60" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="620" y="145" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">DONE</text>
  <text x="620" y="163" fill="#8b949e" font-size="10" text-anchor="middle">éxito</text>

  <!-- RUNNING → FAILED (directo, sin retries) -->
  <line x1="438" y1="235" x2="548" y2="280" stroke="#f85149" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="270" fill="#f85149" font-size="9" text-anchor="middle">error + reintentos agotados</text>

  <!-- FAILED -->
  <rect x="550" y="285" width="140" height="60" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="620" y="310" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">FAILED</text>
  <text x="620" y="328" fill="#8b949e" font-size="10" text-anchor="middle">error definitivo</text>

  <!-- RUNNING → RETRYING -->
  <line x1="360" y1="250" x2="360" y2="320" stroke="#FFD43B" stroke-width="2" marker-end="url(#ay)"/>
  <text x="315" y="290" fill="#FFD43B" font-size="9" text-anchor="middle">error recoverable</text>

  <!-- RETRYING -->
  <rect x="282" y="322" width="156" height="60" rx="8" fill="#161b22" stroke="#FFD43B" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="360" y="347" fill="#FFD43B" font-size="13" font-weight="bold" text-anchor="middle">RETRYING</text>
  <text x="360" y="365" fill="#8b949e" font-size="10" text-anchor="middle">attempt += 1, wait_exp</text>

  <!-- RETRYING → RUNNING (curved back up) -->
  <path d="M282,355 Q220,355 220,290 Q220,220 280,220" stroke="#58a6ff" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="4,2"/>
  <text x="190" y="310" fill="#58a6ff" font-size="9" text-anchor="middle">retry</text>

  <!-- RETRYING → FAILED -->
  <line x1="438" y1="355" x2="548" y2="335" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="493" y="355" fill="#f85149" font-size="9" text-anchor="middle">max_attempts</text>

  <!-- FAILED → DLQ -->
  <line x1="690" y1="320" x2="740" y2="320" stroke="#f85149" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="742" y="300" width="60" height="40" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="772" y="318" fill="#f85149" font-size="9" text-anchor="middle">DLQ</text>
  <text x="772" y="332" fill="#8b949e" font-size="8" text-anchor="middle">.dlq.jsonl</text>

  <!-- DONE → S3 / Drive -->
  <line x1="690" y1="150" x2="740" y2="150" stroke="#3fb950" stroke-width="1.5" marker-end="url(#ag)"/>
  <rect x="742" y="132" width="60" height="40" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="772" y="150" fill="#3fb950" font-size="9" text-anchor="middle">S3</text>
  <text x="772" y="164" fill="#8b949e" font-size="8" text-anchor="middle">Drive</text>

  <!-- LEGEND: timestamps -->
  <rect x="40" y="400" width="740" height="44" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="420" fill="#8b949e" font-size="10" font-weight="bold">Timestamps automáticos:</text>
  <text x="55" y="436" fill="#8b949e" font-size="9">→ RUNNING: started_at</text>
  <text x="200" y="436" fill="#8b949e" font-size="9">→ DONE / FAILED: finished_at</text>
  <text x="420" y="436" fill="#8b949e" font-size="9">→ RETRYING: attempt += 1, wait_exponential backoff</text>
  <text x="200" y="420" fill="#FFD43B" font-size="9">JobStatus: StrEnum — persiste en .pipeline_state.json</text>
</svg>
