<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="sans-serif">
  <!-- Background -->
  <rect width="820" height="440" fill="#0d1117"/>

  <!-- Title -->
  <text x="410" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Alembic — Flujo de Migraciones</text>

  <!-- ===== TIMELINE (horizontal) ===== -->
  <line x1="60" y1="200" x2="760" y2="200" stroke="#30363d" stroke-width="2"/>

  <!-- ===== VERSION NODES ===== -->
  <!-- base -->
  <circle cx="100" cy="200" r="14" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <text x="100" y="205" fill="#8b949e" font-size="9" text-anchor="middle">base</text>
  <text x="100" y="230" fill="#8b949e" font-size="9" text-anchor="middle">vacío</text>

  <!-- v1 -->
  <circle cx="240" cy="200" r="14" fill="#1c2c1c" stroke="#3fb950" stroke-width="2"/>
  <text x="240" y="205" fill="#3fb950" font-size="9" text-anchor="middle">v1</text>

  <!-- v2 -->
  <circle cx="400" cy="200" r="14" fill="#1c2c1c" stroke="#3fb950" stroke-width="2"/>
  <text x="400" y="205" fill="#3fb950" font-size="9" text-anchor="middle">v2</text>

  <!-- v3 (current HEAD) -->
  <circle cx="560" cy="200" r="14" fill="#1c2840" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="560" y="205" fill="#58a6ff" font-size="9" text-anchor="middle">v3</text>
  <text x="560" y="232" fill="#58a6ff" font-size="9" text-anchor="middle">HEAD</text>

  <!-- v4 (future / pending) -->
  <circle cx="700" cy="200" r="14" fill="#21262d" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="700" y="205" fill="#30363d" font-size="9" text-anchor="middle">v4</text>
  <text x="700" y="232" fill="#30363d" font-size="9" text-anchor="middle">pending</text>

  <!-- Arrows between nodes -->
  <defs>
    <marker id="arr-right-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-right-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-left-r" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#f85149"/>
    </marker>
  </defs>

  <line x1="114" y1="200" x2="224" y2="200" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-right-g)"/>
  <line x1="254" y1="200" x2="384" y2="200" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-right-g)"/>
  <line x1="414" y1="200" x2="544" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr-right-b)"/>
  <line x1="574" y1="200" x2="684" y2="200" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-right-g)"/>

  <!-- ===== REVISION DETAIL CARDS ===== -->
  <!-- v1 -->
  <rect x="160" y="58" width="165" height="95" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="242" y="76" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">v1 — Initial schema</text>
  <line x1="160" y1="83" x2="325" y2="83" stroke="#30363d" stroke-width="1"/>
  <text x="172" y="98" fill="#8b949e" font-size="9">+ create project</text>
  <text x="172" y="112" fill="#8b949e" font-size="9">+ create asset</text>
  <text x="172" y="126" fill="#8b949e" font-size="9">+ create tag</text>
  <text x="172" y="140" fill="#8b949e" font-size="9">+ create asset_tag_link</text>
  <line x1="240" y1="153" x2="240" y2="186" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- v2 -->
  <rect x="318" y="58" width="165" height="95" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="400" y="76" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">v2 — Add client</text>
  <line x1="318" y1="83" x2="483" y2="83" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="98" fill="#8b949e" font-size="9">+ create client</text>
  <text x="330" y="112" fill="#8b949e" font-size="9">+ add project.client_id FK</text>
  <text x="330" y="126" fill="#8b949e" font-size="9">+ create index client_name</text>
  <line x1="400" y1="153" x2="400" y2="186" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- v3 (HEAD) -->
  <rect x="478" y="58" width="165" height="95" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="560" y="76" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">v3 — Add deadline</text>
  <line x1="478" y1="83" x2="643" y2="83" stroke="#30363d" stroke-width="1"/>
  <text x="490" y="98" fill="#8b949e" font-size="9">+ add project.deadline</text>
  <text x="490" y="112" fill="#8b949e" font-size="9">+ add asset.storage_path</text>
  <text x="490" y="126" fill="#8b949e" font-size="9">+ create index asset.name</text>
  <line x1="560" y1="153" x2="560" y2="186" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- ===== COMMANDS PANEL ===== -->
  <rect x="60" y="258" width="700" height="155" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="410" y="278" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Comandos Alembic</text>
  <line x1="60" y1="285" x2="760" y2="285" stroke="#30363d" stroke-width="1"/>

  <!-- Upgrade -->
  <rect x="80" y="295" width="195" height="105" rx="4" fill="#1c2c1c" stroke="#3fb950" stroke-width="1"/>
  <text x="177" y="312" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">upgrade</text>
  <text x="90" y="330" fill="#FFD43B" font-size="9">alembic upgrade head</text>
  <text x="90" y="345" fill="#8b949e" font-size="9">→ aplica todo pendiente</text>
  <text x="90" y="362" fill="#FFD43B" font-size="9">alembic upgrade +1</text>
  <text x="90" y="377" fill="#8b949e" font-size="9">→ avanza un paso</text>
  <text x="90" y="392" fill="#FFD43B" font-size="9">alembic upgrade v3</text>

  <!-- Downgrade -->
  <rect x="295" y="295" width="195" height="105" rx="4" fill="#2c1c1c" stroke="#f85149" stroke-width="1"/>
  <text x="392" y="312" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">downgrade</text>
  <text x="305" y="330" fill="#FFD43B" font-size="9">alembic downgrade -1</text>
  <text x="305" y="345" fill="#8b949e" font-size="9">→ revierte última</text>
  <text x="305" y="362" fill="#FFD43B" font-size="9">alembic downgrade base</text>
  <text x="305" y="377" fill="#8b949e" font-size="9">→ revierte todo</text>

  <!-- Info -->
  <rect x="510" y="295" width="230" height="105" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="625" y="312" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">info</text>
  <text x="520" y="330" fill="#FFD43B" font-size="9">alembic current</text>
  <text x="520" y="345" fill="#8b949e" font-size="9">→ versión aplicada</text>
  <text x="520" y="362" fill="#FFD43B" font-size="9">alembic history</text>
  <text x="520" y="377" fill="#8b949e" font-size="9">→ historial completo</text>
  <text x="520" y="394" fill="#FFD43B" font-size="9">alembic revision --autogenerate</text>
</svg>
