<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="sans-serif">
  <!-- Background -->
  <rect width="820" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="410" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Studio BC — Diagrama Entidad-Relación</text>

  <!-- ===== CLIENT ===== -->
  <rect x="40" y="55" width="175" height="130" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <rect x="40" y="55" width="175" height="28" rx="6" fill="#1c2840"/>
  <rect x="40" y="75" width="175" height="8" fill="#1c2840"/>
  <text x="127" y="74" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Client</text>
  <line x1="40" y1="83" x2="215" y2="83" stroke="#30363d" stroke-width="1"/>
  <text x="55" y="100" fill="#FFD43B" font-size="10">🔑 id: int</text>
  <text x="55" y="116" fill="#e6edf3" font-size="10">name: str</text>
  <text x="55" y="132" fill="#e6edf3" font-size="10">email: str</text>
  <text x="55" y="148" fill="#e6edf3" font-size="10">country: str</text>
  <text x="55" y="164" fill="#e6edf3" font-size="10">created_at: datetime</text>

  <!-- ===== PROJECT ===== -->
  <rect x="305" y="55" width="200" height="160" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="305" y="55" width="200" height="28" rx="6" fill="#1c2c1c"/>
  <rect x="305" y="75" width="200" height="8" fill="#1c2c1c"/>
  <text x="405" y="74" fill="#3fb950" font-size="13" font-weight="bold" text-anchor="middle">Project</text>
  <line x1="305" y1="83" x2="505" y2="83" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="100" fill="#FFD43B" font-size="10">🔑 id: int</text>
  <text x="320" y="116" fill="#e6edf3" font-size="10">name: str</text>
  <text x="320" y="132" fill="#e6edf3" font-size="10">budget: float</text>
  <text x="320" y="148" fill="#e6edf3" font-size="10">status: str</text>
  <text x="320" y="164" fill="#e6edf3" font-size="10">created_at: datetime</text>
  <text x="320" y="180" fill="#58a6ff" font-size="10">🔗 client_id: int (FK)</text>
  <text x="320" y="196" fill="#8b949e" font-size="9">→ Client</text>

  <!-- ===== ASSET ===== -->
  <rect x="305" y="280" width="200" height="165" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="2"/>
  <rect x="305" y="280" width="200" height="28" rx="6" fill="#2c2800"/>
  <rect x="305" y="300" width="200" height="8" fill="#2c2800"/>
  <text x="405" y="299" fill="#FFD43B" font-size="13" font-weight="bold" text-anchor="middle">Asset</text>
  <line x1="305" y1="308" x2="505" y2="308" stroke="#30363d" stroke-width="1"/>
  <text x="320" y="325" fill="#FFD43B" font-size="10">🔑 id: int</text>
  <text x="320" y="341" fill="#e6edf3" font-size="10">name: str</text>
  <text x="320" y="357" fill="#e6edf3" font-size="10">type: str</text>
  <text x="320" y="373" fill="#e6edf3" font-size="10">size_mb: float</text>
  <text x="320" y="389" fill="#e6edf3" font-size="10">storage_path: str</text>
  <text x="320" y="405" fill="#3fb950" font-size="10">🔗 project_id: int (FK)</text>
  <text x="320" y="420" fill="#8b949e" font-size="9">→ Project</text>
  <text x="320" y="436" fill="#8b949e" font-size="9">tags: list[Tag] (M2M)</text>

  <!-- ===== TAG ===== -->
  <rect x="600" y="280" width="175" height="100" rx="6" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <rect x="600" y="280" width="175" height="28" rx="6" fill="#2c1c1c"/>
  <rect x="600" y="300" width="175" height="8" fill="#2c1c1c"/>
  <text x="687" y="299" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">Tag</text>
  <line x1="600" y1="308" x2="775" y2="308" stroke="#30363d" stroke-width="1"/>
  <text x="615" y="325" fill="#FFD43B" font-size="10">🔑 id: int</text>
  <text x="615" y="341" fill="#e6edf3" font-size="10">name: str (unique)</text>
  <text x="615" y="357" fill="#8b949e" font-size="9">assets: list[Asset] (M2M)</text>

  <!-- ===== ASSETTAGLINK (junction) ===== -->
  <rect x="600" y="420" width="175" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="687" y="440" fill="#8b949e" font-size="11" font-weight="bold" text-anchor="middle">AssetTagLink</text>
  <text x="615" y="457" fill="#8b949e" font-size="9">asset_id (PK, FK) · tag_id (PK, FK)</text>

  <!-- ===== RELATIONSHIP LINES ===== -->
  <!-- Client → Project (1:N) -->
  <line x1="215" y1="130" x2="305" y2="130" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="255" y="120" fill="#58a6ff" font-size="10" text-anchor="middle">1</text>
  <text x="295" y="120" fill="#58a6ff" font-size="10" text-anchor="middle">N</text>

  <!-- Project → Asset (1:N) -->
  <line x1="405" y1="215" x2="405" y2="280" stroke="#3fb950" stroke-width="1.5"/>
  <text x="390" y="250" fill="#3fb950" font-size="10">1</text>
  <text x="390" y="273" fill="#3fb950" font-size="10">N</text>

  <!-- Asset ↔ Tag (M:N via link) -->
  <line x1="505" y1="362" x2="600" y2="340" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="545" y="348" fill="#f85149" font-size="9" text-anchor="middle">M</text>
  <text x="598" y="338" fill="#f85149" font-size="9">N</text>

  <!-- AssetTagLink lines -->
  <line x1="687" y1="380" x2="687" y2="420" stroke="#30363d" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ===== LEGEND ===== -->
  <rect x="40" y="270" width="220" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="150" y="290" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Leyenda</text>
  <line x1="60" y1="305" x2="100" y2="305" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="110" y="309" fill="#8b949e" font-size="10">One-to-Many (1:N)</text>
  <line x1="60" y1="325" x2="100" y2="325" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="110" y="329" fill="#8b949e" font-size="10">Many-to-Many (M:N)</text>
  <text x="60" y="349" fill="#FFD43B" font-size="10">🔑 Primary Key</text>
  <text x="60" y="367" fill="#58a6ff" font-size="10">🔗 Foreign Key</text>
</svg>
