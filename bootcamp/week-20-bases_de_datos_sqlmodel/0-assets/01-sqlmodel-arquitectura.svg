<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="sans-serif">
  <!-- Background -->
  <rect width="820" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="410" y="32" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">SQLModel — Arquitectura por Capas</text>

  <!-- ===== SQLMODEL (top layer) ===== -->
  <rect x="230" y="55" width="360" height="60" rx="8" fill="#1c2c1c" stroke="#3fb950" stroke-width="2"/>
  <text x="410" y="80" fill="#3fb950" font-size="14" font-weight="bold" text-anchor="middle">SQLModel</text>
  <text x="410" y="99" fill="#8b949e" font-size="11" text-anchor="middle">class Project(SQLModel, table=True)</text>

  <!-- Arrows down -->
  <defs>
    <marker id="arr-down" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M1,1 L4,6 L7,1" stroke="#30363d" stroke-width="1.5" fill="none"/>
    </marker>
    <marker id="arr-up-green" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M1,7 L4,2 L7,7" stroke="#3fb950" stroke-width="1.5" fill="none"/>
    </marker>
  </defs>

  <!-- Bridges to Pydantic and SQLAlchemy -->
  <line x1="320" y1="115" x2="230" y2="155" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="500" y1="115" x2="590" y2="155" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ===== PYDANTIC (left) ===== -->
  <rect x="60" y="155" width="230" height="80" rx="8" fill="#1c1c2c" stroke="#306998" stroke-width="2"/>
  <text x="175" y="178" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Pydantic v2</text>
  <text x="175" y="198" fill="#8b949e" font-size="10" text-anchor="middle">Validación de campos</text>
  <text x="175" y="213" fill="#8b949e" font-size="10" text-anchor="middle">Serialización JSON</text>
  <text x="175" y="228" fill="#8b949e" font-size="10" text-anchor="middle">model_validate() / model_dump()</text>

  <!-- ===== SQLALCHEMY (right) ===== -->
  <rect x="530" y="155" width="230" height="80" rx="8" fill="#2c1c1c" stroke="#f85149" stroke-width="2"/>
  <text x="645" y="178" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">SQLAlchemy 2.0</text>
  <text x="645" y="198" fill="#8b949e" font-size="10" text-anchor="middle">ORM · Mapeo objeto-tabla</text>
  <text x="645" y="213" fill="#8b949e" font-size="10" text-anchor="middle">Session · Unit of Work</text>
  <text x="645" y="228" fill="#8b949e" font-size="10" text-anchor="middle">select() · join() · func()</text>

  <!-- Both down to SQL Engine -->
  <line x1="175" y1="235" x2="300" y2="295" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="645" y1="235" x2="520" y2="295" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- ===== ENGINE (center) ===== -->
  <rect x="230" y="295" width="360" height="55" rx="8" fill="#21262d" stroke="#FFD43B" stroke-width="2"/>
  <text x="410" y="320" fill="#FFD43B" font-size="13" font-weight="bold" text-anchor="middle">create_engine()</text>
  <text x="410" y="338" fill="#8b949e" font-size="10" text-anchor="middle">sqlite:///studio.db  ·  postgresql://...  ·  mysql://...</text>

  <!-- Engine to DB -->
  <line x1="410" y1="350" x2="410" y2="380" stroke="#30363d" stroke-width="1.5"/>
  <rect x="310" y="380" width="200" height="30" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="410" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Base de Datos (SQLite / PG)</text>

  <!-- ===== BENEFITS BOX ===== -->
  <rect x="60" y="295" width="150" height="115" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="135" y="315" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Una clase → todo</text>
  <text x="80" y="335" fill="#3fb950" font-size="10">✓ Columna SQL</text>
  <text x="80" y="350" fill="#3fb950" font-size="10">✓ Validación Pydantic</text>
  <text x="80" y="365" fill="#3fb950" font-size="10">✓ Serialización JSON</text>
  <text x="80" y="380" fill="#3fb950" font-size="10">✓ Type hints completos</text>
  <text x="80" y="395" fill="#3fb950" font-size="10">✓ mypy compatible</text>

  <!-- ===== CODE BOX (right) ===== -->
  <rect x="610" y="295" width="150" height="115" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="685" y="315" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Dos modos</text>
  <rect x="620" y="325" width="130" height="28" rx="3" fill="#1c2c1c" stroke="#3fb950" stroke-width="1"/>
  <text x="685" y="340" fill="#3fb950" font-size="9" text-anchor="middle">table=True</text>
  <text x="685" y="352" fill="#8b949e" font-size="9" text-anchor="middle">→ tabla SQL</text>
  <rect x="620" y="360" width="130" height="28" rx="3" fill="#1c1c2c" stroke="#306998" stroke-width="1"/>
  <text x="685" y="375" fill="#58a6ff" font-size="9" text-anchor="middle">sin table=True</text>
  <text x="685" y="387" fill="#8b949e" font-size="9" text-anchor="middle">→ schema Pydantic</text>
</svg>
