<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d">
  <title id="t">loc, iloc y máscaras</title>
  <desc id="d">La misma tabla tres veces, con índice 10, 20, 30, 40 y valores 12.5, 8.0, 48.9 y 9.5. frame.loc[20:30] elige por etiqueta e incluye el final: las etiquetas 20 y 30. frame.iloc[1:3] elige por posición y excluye el final: las posiciones 1 y 2, que son las mismas filas. frame[frame.value &gt; 10] usa una máscara de bool, True, False, True, False, y se queda con las filas donde es True, que conservan sus etiquetas 10 y 30. Con un índice de enteros, frame.loc[0] da KeyError porque 0 no es ninguna etiqueta. Para cambiar valores se hace en un solo paso con frame.loc[máscara, 'value'] = 0; encadenado, frame[máscara]['value'] = 0 no cambia nada.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="860" height="400" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">Tres formas de elegir filas: por etiqueta, por posición y con una máscara</text>
    <text x="60" y="86" font-weight="700" fill="#fcd34d">frame.loc[20:30]</text>
    <text x="60" y="106" font-size="13" fill="#94a3b8">por etiqueta: incluye el final</text>
    <text x="46" y="108" fill="#94a3b8"></text>
    <text x="48" y="142" text-anchor="end" font-size="12" fill="#94a3b8">0</text>
    <rect x="60" y="120" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="90" y="142" text-anchor="middle" fill="#fcd34d" font-weight="700">10</text>
    <rect x="120" y="120" width="80" height="34" rx="0" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="142" text-anchor="middle" fill="#94a3b8">12.5</text>
    <text x="48" y="176" text-anchor="end" font-size="12" fill="#94a3b8">1</text>
    <rect x="60" y="154" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="90" y="176" text-anchor="middle" fill="#fcd34d" font-weight="700">20</text>
    <rect x="120" y="154" width="80" height="34" rx="0" fill="#14532d" stroke="#fcd34d"/>
    <text x="160" y="176" text-anchor="middle" fill="#e2e8f0">8.0</text>
    <text x="48" y="210" text-anchor="end" font-size="12" fill="#94a3b8">2</text>
    <rect x="60" y="188" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="90" y="210" text-anchor="middle" fill="#fcd34d" font-weight="700">30</text>
    <rect x="120" y="188" width="80" height="34" rx="0" fill="#14532d" stroke="#fcd34d"/>
    <text x="160" y="210" text-anchor="middle" fill="#e2e8f0">48.9</text>
    <text x="48" y="244" text-anchor="end" font-size="12" fill="#94a3b8">3</text>
    <rect x="60" y="222" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="90" y="244" text-anchor="middle" fill="#fcd34d" font-weight="700">40</text>
    <rect x="120" y="222" width="80" height="34" rx="0" fill="#1e293b" stroke="#334155"/>
    <text x="160" y="244" text-anchor="middle" fill="#94a3b8">9.5</text>
    <text x="340" y="86" font-weight="700" fill="#93c5fd">frame.iloc[1:3]</text>
    <text x="340" y="106" font-size="13" fill="#94a3b8">por posición: excluye el final</text>
    <text x="326" y="108" fill="#94a3b8"></text>
    <text x="328" y="142" text-anchor="end" font-size="12" fill="#94a3b8">0</text>
    <rect x="340" y="120" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="370" y="142" text-anchor="middle" fill="#fcd34d" font-weight="700">10</text>
    <rect x="400" y="120" width="80" height="34" rx="0" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="142" text-anchor="middle" fill="#94a3b8">12.5</text>
    <text x="328" y="176" text-anchor="end" font-size="12" fill="#94a3b8">1</text>
    <rect x="340" y="154" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="370" y="176" text-anchor="middle" fill="#fcd34d" font-weight="700">20</text>
    <rect x="400" y="154" width="80" height="34" rx="0" fill="#14532d" stroke="#93c5fd"/>
    <text x="440" y="176" text-anchor="middle" fill="#e2e8f0">8.0</text>
    <text x="328" y="210" text-anchor="end" font-size="12" fill="#94a3b8">2</text>
    <rect x="340" y="188" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="370" y="210" text-anchor="middle" fill="#fcd34d" font-weight="700">30</text>
    <rect x="400" y="188" width="80" height="34" rx="0" fill="#14532d" stroke="#93c5fd"/>
    <text x="440" y="210" text-anchor="middle" fill="#e2e8f0">48.9</text>
    <text x="328" y="244" text-anchor="end" font-size="12" fill="#94a3b8">3</text>
    <rect x="340" y="222" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="370" y="244" text-anchor="middle" fill="#fcd34d" font-weight="700">40</text>
    <rect x="400" y="222" width="80" height="34" rx="0" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="244" text-anchor="middle" fill="#94a3b8">9.5</text>
    <text x="60" y="290" font-size="13" fill="#fcd34d">las etiquetas 20 y 30, ambas</text>
    <text x="340" y="290" font-size="13" fill="#93c5fd">las posiciones 1 y 2, no la 3</text>
    <text x="48" y="112" text-anchor="end" font-size="11" fill="#94a3b8">posición</text>
    <text x="620" y="86" font-weight="700" fill="#86efac">frame[frame.value &gt; 10]</text>
    <text x="620" y="106" font-size="13" fill="#94a3b8">con una máscara de bool</text>
    <text x="606" y="108" fill="#94a3b8"></text>
    <text x="608" y="142" text-anchor="end" font-size="12" fill="#94a3b8">0</text>
    <rect x="620" y="120" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="650" y="142" text-anchor="middle" fill="#fcd34d" font-weight="700">10</text>
    <rect x="680" y="120" width="80" height="34" rx="0" fill="#14532d" stroke="#86efac"/>
    <text x="720" y="142" text-anchor="middle" fill="#e2e8f0">12.5</text>
    <text x="608" y="176" text-anchor="end" font-size="12" fill="#94a3b8">1</text>
    <rect x="620" y="154" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="650" y="176" text-anchor="middle" fill="#fcd34d" font-weight="700">20</text>
    <rect x="680" y="154" width="80" height="34" rx="0" fill="#1e293b" stroke="#334155"/>
    <text x="720" y="176" text-anchor="middle" fill="#94a3b8">8.0</text>
    <text x="608" y="210" text-anchor="end" font-size="12" fill="#94a3b8">2</text>
    <rect x="620" y="188" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="650" y="210" text-anchor="middle" fill="#fcd34d" font-weight="700">30</text>
    <rect x="680" y="188" width="80" height="34" rx="0" fill="#14532d" stroke="#86efac"/>
    <text x="720" y="210" text-anchor="middle" fill="#e2e8f0">48.9</text>
    <text x="608" y="244" text-anchor="end" font-size="12" fill="#94a3b8">3</text>
    <rect x="620" y="222" width="60" height="34" rx="0" fill="#422006" stroke="#fcd34d"/>
    <text x="650" y="244" text-anchor="middle" fill="#fcd34d" font-weight="700">40</text>
    <rect x="680" y="222" width="80" height="34" rx="0" fill="#1e293b" stroke="#334155"/>
    <text x="720" y="244" text-anchor="middle" fill="#94a3b8">9.5</text>
    <text x="780" y="142" fill="#86efac" font-size="13">True</text>
    <text x="780" y="176" fill="#fca5a5" font-size="13">False</text>
    <text x="780" y="210" fill="#86efac" font-size="13">True</text>
    <text x="780" y="244" fill="#fca5a5" font-size="13">False</text>
    <text x="620" y="290" font-size="13" fill="#86efac">las filas donde la máscara es True;</text>
    <text x="620" y="308" font-size="13" fill="#86efac">conservan su etiqueta: 10 y 30</text>
    <text x="430" y="350" text-anchor="middle" font-size="13" fill="#94a3b8">Con un índice de enteros, frame.loc[0] da KeyError: 0 no es ninguna etiqueta.</text>
    <text x="430" y="372" text-anchor="middle" font-size="13" fill="#94a3b8">Cambiar valores, en un solo paso: frame.loc[máscara, "value"] = 0. Encadenado, frame[máscara]["value"] = 0 no cambia nada.</text>
  </g>
</svg>
