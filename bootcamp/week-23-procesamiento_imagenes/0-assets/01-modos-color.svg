<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" font-family="sans-serif">
  <rect width="780" height="340" fill="#0d1117"/>
  <text x="390" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Pillow — Modos de Color</text>

  <!-- RGB -->
  <rect x="30" y="50" width="130" height="110" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="95" y="72" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">RGB</text>
  <rect x="45" y="82" width="30" height="30" rx="3" fill="#ff0000"/>
  <rect x="83" y="82" width="30" height="30" rx="3" fill="#00aa00"/>
  <rect x="121" y="82" width="30" height="30" rx="3" fill="#0000ff"/>
  <text x="60"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">R</text>
  <text x="98"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">G</text>
  <text x="136" y="128" fill="#8b949e" font-size="9" text-anchor="middle">B</text>
  <text x="95" y="148" fill="#8b949e" font-size="9" text-anchor="middle">3 canales · 8 bit</text>

  <!-- RGBA -->
  <rect x="175" y="50" width="140" height="110" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="245" y="72" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">RGBA</text>
  <rect x="188" y="82" width="25" height="30" rx="3" fill="#ff0000"/>
  <rect x="220" y="82" width="25" height="30" rx="3" fill="#00aa00"/>
  <rect x="252" y="82" width="25" height="30" rx="3" fill="#0000ff"/>
  <rect x="284" y="82" width="25" height="30" rx="3" fill="#aaaaaa"/>
  <text x="200"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">R</text>
  <text x="232"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">G</text>
  <text x="264"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">B</text>
  <text x="296"  y="128" fill="#e6edf3" font-size="9" text-anchor="middle">A</text>
  <text x="245" y="148" fill="#8b949e" font-size="9" text-anchor="middle">4 canales · transparencia</text>

  <!-- L -->
  <rect x="330" y="50" width="130" height="110" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="395" y="72" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">L (Grayscale)</text>
  <rect x="345" y="82" width="80" height="30" rx="3">
    <linearGradient id="gray-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <rect x="345" y="82" width="80" height="30" rx="3" fill="url(#gray-grad)"/>
  </rect>
  <text x="395" y="128" fill="#8b949e" font-size="9" text-anchor="middle">Luminosidad</text>
  <text x="395" y="148" fill="#8b949e" font-size="9" text-anchor="middle">1 canal · 8 bit</text>

  <!-- CMYK -->
  <rect x="475" y="50" width="155" height="110" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="552" y="72" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">CMYK</text>
  <rect x="488" y="82" width="25" height="30" rx="3" fill="#00bcd4"/>
  <rect x="520" y="82" width="25" height="30" rx="3" fill="#e91e63"/>
  <rect x="552" y="82" width="25" height="30" rx="3" fill="#ffeb3b"/>
  <rect x="584" y="82" width="25" height="30" rx="3" fill="#212121"/>
  <text x="500"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">C</text>
  <text x="532"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">M</text>
  <text x="564"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">Y</text>
  <text x="596"  y="128" fill="#8b949e" font-size="9" text-anchor="middle">K</text>
  <text x="552" y="148" fill="#8b949e" font-size="9" text-anchor="middle">4 canales · impresión</text>

  <!-- Conversiones -->
  <rect x="30" y="195" width="720" height="125" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="390" y="215" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Conversiones frecuentes con img.convert()</text>

  <text x="90"  y="240" fill="#f85149" font-size="10" text-anchor="middle">RGBA → RGB</text>
  <text x="90"  y="256" fill="#8b949e" font-size="9" text-anchor="middle">Antes de guardar JPG</text>
  <text x="90"  y="270" fill="#FFD43B" font-size="9" text-anchor="middle">.convert("RGB")</text>

  <text x="260" y="240" fill="#58a6ff" font-size="10" text-anchor="middle">RGB → RGBA</text>
  <text x="260" y="256" fill="#8b949e" font-size="9" text-anchor="middle">Para alpha compositing</text>
  <text x="260" y="270" fill="#FFD43B" font-size="9" text-anchor="middle">.convert("RGBA")</text>

  <text x="430" y="240" fill="#8b949e" font-size="10" text-anchor="middle">RGB → L</text>
  <text x="430" y="256" fill="#8b949e" font-size="9" text-anchor="middle">Escala de grises</text>
  <text x="430" y="270" fill="#FFD43B" font-size="9" text-anchor="middle">.convert("L")</text>

  <text x="610" y="240" fill="#3fb950" font-size="10" text-anchor="middle">RGB → CMYK</text>
  <text x="610" y="256" fill="#8b949e" font-size="9" text-anchor="middle">Preparar para impresión</text>
  <text x="610" y="270" fill="#FFD43B" font-size="9" text-anchor="middle">.convert("CMYK")</text>

  <text x="390" y="300" fill="#f85149" font-size="9" text-anchor="middle">⚠ JPG no soporta RGBA — siempre convertir a RGB antes de save(.jpg)</text>
</svg>
