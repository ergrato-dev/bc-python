<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" width="780" height="340" font-family="sans-serif">
  <rect width="780" height="340" fill="#0d1117"/>
  <text x="390" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Normalización de Audio — dBFS</text>

  <!-- Axis labels -->
  <text x="60" y="55" fill="#8b949e" font-size="10">0 dBFS</text>
  <text x="60" y="100" fill="#8b949e" font-size="10">-6 dBFS</text>
  <text x="50" y="145" fill="#FFD43B" font-size="10">-14 dBFS</text>
  <text x="60" y="190" fill="#8b949e" font-size="10">-23 dBFS</text>
  <text x="60" y="235" fill="#8b949e" font-size="10">-40 dBFS</text>
  <text x="50" y="280" fill="#8b949e" font-size="10">-∞ dBFS</text>

  <!-- Reference lines -->
  <line x1="120" y1="52" x2="750" y2="52" stroke="#f85149" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="120" y1="143" x2="750" y2="143" stroke="#FFD43B" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="120" y1="233" x2="750" y2="233" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Label: clipping zone -->
  <text x="660" y="48" fill="#f85149" font-size="9">clipping</text>
  <!-- Label: streaming target -->
  <text x="660" y="139" fill="#FFD43B" font-size="9">streaming target</text>
  <!-- Label: silence threshold -->
  <text x="660" y="229" fill="#8b949e" font-size="9">umbral silencio</text>

  <!-- Before normalization bar -->
  <rect x="175" y="175" width="140" height="58" rx="4" fill="#f85149" opacity="0.7"/>
  <text x="245" y="196" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">ORIGINAL</text>
  <text x="245" y="213" fill="#e6edf3" font-size="9" text-anchor="middle">-23 dBFS</text>
  <text x="245" y="227" fill="#e6edf3" font-size="9" text-anchor="middle">muy bajo</text>

  <!-- Arrow up -->
  <line x1="245" y1="174" x2="245" y2="148" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <text x="255" y="163" fill="#58a6ff" font-size="9">+9 dB</text>

  <!-- After normalization bar -->
  <rect x="175" y="118" width="140" height="25" rx="4" fill="#3fb950" opacity="0.85"/>
  <text x="245" y="134" fill="#e6edf3" font-size="9" font-weight="bold" text-anchor="middle">NORMALIZADO → -14 dBFS</text>

  <!-- Whisper accuracy zone -->
  <rect x="420" y="65" width="180" height="220" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="510" y="86" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Whisper accuracy</text>
  <text x="510" y="108" fill="#3fb950" font-size="10" text-anchor="middle">-6 a -23 dBFS</text>
  <text x="510" y="122" fill="#3fb950" font-size="9" text-anchor="middle">✓ Óptimo</text>
  <line x1="430" y1="135" x2="590" y2="135" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="510" y="160" fill="#FFD43B" font-size="10" text-anchor="middle">-23 a -35 dBFS</text>
  <text x="510" y="174" fill="#FFD43B" font-size="9" text-anchor="middle">~ Aceptable</text>
  <line x1="430" y1="190" x2="590" y2="190" stroke="#30363d" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="510" y="215" fill="#f85149" font-size="10" text-anchor="middle">&lt; -35 dBFS</text>
  <text x="510" y="229" fill="#f85149" font-size="9" text-anchor="middle">✗ Transcripción degradada</text>
  <text x="510" y="260" fill="#8b949e" font-size="9" text-anchor="middle">normalize antes de</text>
  <text x="510" y="274" fill="#8b949e" font-size="9" text-anchor="middle">model.transcribe()</text>
</svg>
