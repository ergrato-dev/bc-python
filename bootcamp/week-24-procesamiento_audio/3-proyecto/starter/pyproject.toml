[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "studio-audio-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydub>=0.25",
    "mutagen>=1.47",
    "watchdog>=4.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
whisper = ["openai-whisper>=20231117"]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.mypy]
strict = true
