<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" role="img" aria-labelledby="t d">
  <title id="t">El ritmo de aprendizaje</title>
  <desc id="d">Tres veces la misma parábola, la pérdida según w, con el mínimo en 3, y cinco pasos de descenso de gradiente desde w = 0. Con ritmo 0,05 los pasos son cortos y no llegan. Con ritmo 0,3 llegan cerca del fondo. Con ritmo 1,1 cada paso salta al otro lado de la parábola y cae más arriba que el anterior.</desc>
