    <text x="450" y="36" text-anchor="middle" font-size="17" fill="#e2e8f0" font-weight="700">Un MLP: entrada, capa oculta con ReLU y salida</text>
    <text x="450" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">nn.Sequential(nn.Linear(1, 16), nn.ReLU(), nn.Linear(16, 1)): 49 parámetros</text>
