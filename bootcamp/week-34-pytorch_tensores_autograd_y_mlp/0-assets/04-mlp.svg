<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" role="img" aria-labelledby="t d">
  <title id="t">Un MLP</title>
  <desc id="d">A la izquierda, un perceptrón multicapa: la hora entra en 16 neuronas ocultas, de las que se dibujan cinco, cada una con el símbolo de ReLU, y todas se unen en una salida, el PM2.5. Cada flecha es un peso. A la derecha, tres codos de ReLU, planos hasta un punto y rectos después, y debajo su suma: una curva del día con un pico a las 8 y otro a las 19.</desc>
