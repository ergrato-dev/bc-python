<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d">
  <title id="t">Anatomía de un array</title>
  <desc id="d">El array np.arange(12).reshape(3, 4) se ve como una tabla de 3 filas y 4 columnas, con los números del 0 al 11. En memoria es un solo bloque de 12 enteros int64 seguidos, de 8 bytes cada uno, 96 bytes en total. Lo que convierte el bloque en tabla son tres datos: dtype int64, cada elemento ocupa 8 bytes; shape (3, 4); y strides (32, 8): para bajar una fila se saltan 32 bytes y para pasar a la columna siguiente, 8. La posición del elemento [1, 2] es 1 por 32 más 2 por 8, el byte 48, donde está el 6. La traspuesta grid.T no copia nada: usa el mismo bloque con shape (4, 3) y strides (8, 32).</desc>
  <rect width="860" height="470" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">grid = np.arange(12).reshape(3, 4): una tabla por fuera, un bloque por dentro</text>
    <text x="190" y="70" text-anchor="middle" font-weight="700" fill="#93c5fd">Lo que ves: shape (3, 4)</text>
    <rect x="70" y="90" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="100.0" y="118" text-anchor="middle">0</text>
    <rect x="130" y="90" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="160.0" y="118" text-anchor="middle">1</text>
    <rect x="190" y="90" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="220.0" y="118" text-anchor="middle">2</text>
    <rect x="250" y="90" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="280.0" y="118" text-anchor="middle">3</text>
    <rect x="70" y="134" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="100.0" y="162" text-anchor="middle">4</text>
    <rect x="130" y="134" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="160.0" y="162" text-anchor="middle">5</text>
    <rect x="190" y="134" width="60" height="44" fill="#1d4ed8" stroke="#94a3b8"/>
    <text x="220.0" y="162" text-anchor="middle">6</text>
    <rect x="250" y="134" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="280.0" y="162" text-anchor="middle">7</text>
    <rect x="70" y="178" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="100.0" y="206" text-anchor="middle">8</text>
    <rect x="130" y="178" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="160.0" y="206" text-anchor="middle">9</text>
    <rect x="190" y="178" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="220.0" y="206" text-anchor="middle">10</text>
    <rect x="250" y="178" width="60" height="44" fill="#1e293b" stroke="#94a3b8"/>
    <text x="280.0" y="206" text-anchor="middle">11</text>
    <text x="56" y="118" text-anchor="end" font-size="12" fill="#94a3b8">fila 0</text>
    <text x="56" y="162" text-anchor="end" font-size="12" fill="#94a3b8">fila 1</text>
    <text x="56" y="206" text-anchor="end" font-size="12" fill="#94a3b8">fila 2</text>
    <text x="100.0" y="242" text-anchor="middle" font-size="12" fill="#94a3b8">col 0</text>
    <text x="160.0" y="242" text-anchor="middle" font-size="12" fill="#94a3b8">col 1</text>
    <text x="220.0" y="242" text-anchor="middle" font-size="12" fill="#94a3b8">col 2</text>
    <text x="280.0" y="242" text-anchor="middle" font-size="12" fill="#94a3b8">col 3</text>
    <text x="190" y="270" text-anchor="middle" font-size="13" fill="#93c5fd">grid[1, 2] es 6</text>
    <text x="640" y="70" text-anchor="middle" font-weight="700" fill="#86efac">Lo que guarda NumPy</text>
    <rect x="470" y="100" width="350" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="484" y="121" font-weight="700" fill="#86efac">dtype</text>
    <text x="560" y="121" font-size="13">int64: 8 bytes por elemento, todos iguales</text>
    <rect x="470" y="140" width="350" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="484" y="161" font-weight="700" fill="#86efac">shape</text>
    <text x="560" y="161" font-size="13">(3, 4): 3 filas de 4</text>
    <rect x="470" y="180" width="350" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="484" y="201" font-weight="700" fill="#86efac">strides</text>
    <text x="560" y="201" font-size="13">(32, 8): bytes que se saltan por eje</text>
    <rect x="470" y="220" width="350" height="32" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="484" y="241" font-weight="700" fill="#86efac">nbytes</text>
    <text x="560" y="241" font-size="13">96: 12 elementos de 8 bytes</text>
    <text x="430" y="296" text-anchor="middle" font-weight="700" fill="#fcd34d">En memoria: un solo bloque de 96 bytes, los 12 números seguidos</text>
    <rect x="40" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="72.5" y="356" text-anchor="middle">0</text>
    <text x="72.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 0</text>
    <rect x="105" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="137.5" y="356" text-anchor="middle">1</text>
    <text x="137.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 8</text>
    <rect x="170" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="202.5" y="356" text-anchor="middle">2</text>
    <text x="202.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 16</text>
    <rect x="235" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="267.5" y="356" text-anchor="middle">3</text>
    <text x="267.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 24</text>
    <rect x="300" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="332.5" y="356" text-anchor="middle">4</text>
    <text x="332.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 32</text>
    <rect x="365" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="397.5" y="356" text-anchor="middle">5</text>
    <text x="397.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 40</text>
    <rect x="430" y="330" width="65" height="40" fill="#1d4ed8" stroke="#fcd34d"/>
    <text x="462.5" y="356" text-anchor="middle">6</text>
    <text x="462.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 48</text>
    <rect x="495" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="527.5" y="356" text-anchor="middle">7</text>
    <text x="527.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 56</text>
    <rect x="560" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="592.5" y="356" text-anchor="middle">8</text>
    <text x="592.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 64</text>
    <rect x="625" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="657.5" y="356" text-anchor="middle">9</text>
    <text x="657.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 72</text>
    <rect x="690" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="722.5" y="356" text-anchor="middle">10</text>
    <text x="722.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 80</text>
    <rect x="755" y="330" width="65" height="40" fill="#1e293b" stroke="#fcd34d"/>
    <text x="787.5" y="356" text-anchor="middle">11</text>
    <text x="787.5" y="388" text-anchor="middle" font-size="11" fill="#94a3b8">byte 88</text>
    <text x="430" y="420" text-anchor="middle" font-size="13">grid[1, 2] está en el byte 1 × 32 + 2 × 8 = 48. Bajar una fila salta 32 bytes; pasar de columna, 8.</text>
    <text x="430" y="446" text-anchor="middle" font-size="13" fill="#94a3b8">grid.T usa el mismo bloque, sin copiar: shape (4, 3), strides (8, 32).</text>
  </g>
</svg>
