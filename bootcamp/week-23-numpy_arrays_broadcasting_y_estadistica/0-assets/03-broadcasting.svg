    <rect x="92" y="286" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="118" y="286" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="40" y="312" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
