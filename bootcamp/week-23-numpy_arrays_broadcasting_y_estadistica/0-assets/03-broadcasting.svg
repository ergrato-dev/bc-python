    <rect x="118" y="462" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <text x="170" y="456" text-anchor="middle" font-size="20">−</text>
    <rect x="195" y="410" width="26" height="26" fill="#14532d" stroke="#86efac"/>
    <rect x="221" y="410" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="247" y="410" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="273" y="410" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="195" y="436" width="26" height="26" fill="#14532d" stroke="#86efac"/>
    <rect x="221" y="436" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="247" y="436" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="273" y="436" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="195" y="462" width="26" height="26" fill="#14532d" stroke="#86efac"/>
    <rect x="221" y="462" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="247" y="462" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="273" y="462" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <text x="330" y="456" text-anchor="middle" font-size="20" fill="#86efac">=</text>
    <text x="355" y="456" font-weight="700" fill="#86efac">encaja: (3, 4)</text>
    <rect x="560" y="56" width="270" height="410" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="695" y="84" text-anchor="middle" font-weight="700" fill="#fcd34d">Alinea por la derecha</text>
    <text x="660" y="130" text-anchor="end">(3, 4)</text>
    <text x="660" y="154" text-anchor="end">(4,)</text>
    <line x1="590" y1="164" x2="668" y2="164" stroke="#94a3b8"/>
    <text x="682" y="130" font-size="13" fill="#86efac">falta un eje: cuenta como 1</text>
    <text x="682" y="152" font-size="13" fill="#86efac">y se estira a 3 filas</text>
    <text x="660" y="260" text-anchor="end">(3, 4)</text>
    <text x="660" y="284" text-anchor="end">(3,)</text>
    <line x1="590" y1="294" x2="668" y2="294" stroke="#94a3b8"/>
    <text x="682" y="260" font-size="13" fill="#fca5a5">4 frente a 3: distintos</text>
    <text x="682" y="282" font-size="13" fill="#fca5a5">y ninguno es 1</text>
    <text x="660" y="390" text-anchor="end">(3, 4)</text>
    <text x="660" y="414" text-anchor="end">(3, 1)</text>
    <line x1="590" y1="424" x2="668" y2="424" stroke="#94a3b8"/>
    <text x="682" y="390" font-size="13" fill="#86efac">3 con 3 encaja;</text>
    <text x="682" y="412" font-size="13" fill="#86efac">1 se estira a 4 columnas</text>
    <text x="430" y="525" text-anchor="middle" font-size="13" fill="#94a3b8">Los cuadros a trazos no existen en memoria: NumPy repite la fila o la columna sin copiarla.</text>
  </g>
</svg>
