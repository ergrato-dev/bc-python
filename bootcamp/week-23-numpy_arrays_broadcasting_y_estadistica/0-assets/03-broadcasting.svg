<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 545" role="img" aria-labelledby="t d">
  <title id="t">Broadcasting</title>
  <desc id="d">Tres restas con una tabla de forma (3, 4). Primera: tabla menos un array de forma (4,), las medias de cada columna. Las formas se alinean por la derecha: 4 con 4 encaja, y el eje que falta cuenta como 1 y se estira a 3 filas sin copiar. Resultado de forma (3, 4). Segunda: tabla menos un array de forma (3,), las medias de cada fila. Alineadas por la derecha, 4 frente a 3: ni son iguales ni ninguno es 1, así que NumPy da ValueError: operands could not be broadcast together with shapes (3,4) (3,). Tercera: tabla menos un array de forma (3, 1), las mismas medias por fila con keepdims=True o con [:, None]. 4 frente a 1 encaja estirando la columna a 4, y 3 con 3 encaja. Resultado de forma (3, 4). La regla: comparando por la derecha, dos ejes encajan si son iguales o si uno de ellos es 1.</desc>
  <rect width="860" height="545" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">Broadcasting: se comparan las formas por la derecha; cada eje, igual o 1</text>
    <text x="40" y="70" font-weight="700" fill="#86efac">tabla - tabla.mean(axis=0)</text>
    <text x="40" y="94" font-size="13" fill="#94a3b8">formas (3, 4)  y  (4,)</text>
    <rect x="40" y="110" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="66" y="110" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="92" y="110" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="118" y="110" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="40" y="136" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="66" y="136" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
