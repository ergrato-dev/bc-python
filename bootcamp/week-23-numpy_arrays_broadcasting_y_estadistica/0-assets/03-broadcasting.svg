    <rect x="118" y="312" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <text x="170" y="306" text-anchor="middle" font-size="20">−</text>
    <rect x="195" y="260" width="26" height="26" fill="#3f1d1d" stroke="#fca5a5"/>
    <rect x="221" y="260" width="26" height="26" fill="#3f1d1d" stroke="#fca5a5"/>
    <rect x="247" y="260" width="26" height="26" fill="#3f1d1d" stroke="#fca5a5"/>
    <text x="330" y="306" text-anchor="middle" font-size="20" fill="#fca5a5">✗</text>
    <text x="355" y="306" font-weight="700" fill="#fca5a5">ValueError</text>
    <text x="40" y="370" font-weight="700" fill="#86efac">tabla - tabla.mean(axis=1, keepdims=True)</text>
    <text x="40" y="394" font-size="13" fill="#94a3b8">formas (3, 4)  y  (3, 1)</text>
    <rect x="40" y="410" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="66" y="410" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="92" y="410" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="118" y="410" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="40" y="436" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
