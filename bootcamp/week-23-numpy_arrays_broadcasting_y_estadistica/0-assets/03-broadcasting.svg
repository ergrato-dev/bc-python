    <rect x="118" y="162" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <text x="170" y="156" text-anchor="middle" font-size="20">−</text>
    <rect x="195" y="110" width="26" height="26" fill="#14532d" stroke="#86efac"/>
    <rect x="221" y="110" width="26" height="26" fill="#14532d" stroke="#86efac"/>
    <rect x="247" y="110" width="26" height="26" fill="#14532d" stroke="#86efac"/>
    <rect x="273" y="110" width="26" height="26" fill="#14532d" stroke="#86efac"/>
    <rect x="195" y="136" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="221" y="136" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="247" y="136" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="273" y="136" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="195" y="162" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="221" y="162" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="247" y="162" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <rect x="273" y="162" width="26" height="26" fill="#14532d" stroke="#86efac" stroke-dasharray="3 3" fill-opacity="0.35"/>
    <text x="330" y="156" text-anchor="middle" font-size="20" fill="#86efac">=</text>
    <text x="355" y="156" font-weight="700" fill="#86efac">encaja: (3, 4)</text>
    <text x="40" y="220" font-weight="700" fill="#fca5a5">tabla - tabla.mean(axis=1)</text>
    <text x="40" y="244" font-size="13" fill="#94a3b8">formas (3, 4)  y  (3,)</text>
    <rect x="40" y="260" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="66" y="260" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="92" y="260" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="118" y="260" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
    <rect x="40" y="286" width="26" height="26" fill="#1e293b" stroke="#93c5fd"/>
