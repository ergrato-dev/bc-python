[project]
name = "dobles-con-mock"
version = "0.1.0"
description = "Ejercicio 03 de la semana 14: dobles de prueba con unittest.mock"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
# Es un ejercicio, no un paquete instalable: uv solo crea el entorno.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath: los tests importan weather.py desde la carpeta del ejercicio.
pythonpath = ["."]
