<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="t d">
  <title id="t">Cómo busca Hypothesis un contraejemplo</title>
  <desc id="d">Cuatro etapas de izquierda a derecha. La estrategia describe qué datos valen, por ejemplo listas de líneas con un punto y coma. Hypothesis genera hasta cien ejemplos y ejecuta la propiedad con cada uno. Si uno falla, por ejemplo una línea larga y rara, lo encoge: prueba versiones más simples que sigan fallando hasta llegar a la mínima, la lista con la línea 0;:. Ese es el Failing test case que escribe pytest. Abajo, la base de datos .hypothesis guarda el contraejemplo y la siguiente ejecución lo prueba primero.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="820" height="360" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="24" y="40" width="170" height="130" rx="8" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="109" y="66" text-anchor="middle" font-weight="700" fill="#38bdf8">1 · Estrategia</text>
    <text x="109" y="96" text-anchor="middle" font-size="12">qué datos valen</text>
    <text x="109" y="126" text-anchor="middle" font-size="12" fill="#cbd5e1">st.lists(st.text()</text>
    <text x="109" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">| "{};{}"...)</text>

    <rect x="226" y="40" width="170" height="130" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="311" y="66" text-anchor="middle" font-weight="700">2 · Genera</text>
    <text x="311" y="96" text-anchor="middle" font-size="12">hasta 100 ejemplos</text>
    <text x="311" y="126" text-anchor="middle" font-size="12" fill="#cbd5e1">[], [""], ["a;1"],</text>
    <text x="311" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">["Ω7;x", "#"]...</text>

    <rect x="428" y="40" width="170" height="130" rx="8" fill="#2a1215" stroke="#f87171"/>
    <text x="513" y="66" text-anchor="middle" font-weight="700" fill="#f87171">3 · Uno falla</text>
    <text x="513" y="96" text-anchor="middle" font-size="12">la propiedad no se cumple</text>
    <text x="513" y="126" text-anchor="middle" font-size="12" fill="#cbd5e1">["ü;Ω", "8#;?k"...]</text>
    <text x="513" y="144" text-anchor="middle" font-size="12" fill="#cbd5e1">ValueError</text>

    <rect x="630" y="40" width="166" height="130" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="713" y="66" text-anchor="middle" font-weight="700" fill="#4ade80">4 · Encoge</text>
    <text x="713" y="96" text-anchor="middle" font-size="12">el mínimo que sigue fallando</text>
    <text x="713" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">['0;:']</text>

    <path d="M196 105 L220 105" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <path d="M398 105 L422 105" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <path d="M600 105 L624 105" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

    <rect x="226" y="214" width="372" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="412" y="238" text-anchor="middle" font-weight="700">.hypothesis/ guarda el contraejemplo</text>
    <text x="412" y="258" text-anchor="middle" font-size="12" fill="#cbd5e1">la siguiente ejecución lo prueba primero</text>
    <path d="M713 172 L713 242 L604 242" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <path d="M226 242 L109 242 L109 176" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

    <text x="410" y="312" text-anchor="middle" font-size="13" fill="#cbd5e1">pytest escribe el mínimo: Failing test case: test_...(lines=['0;:'])</text>
    <text x="410" y="334" text-anchor="middle" font-size="12" fill="#94a3b8">Si los 100 pasan, el test pasa: no es una prueba de que no haya bugs, solo de que no los encontró</text>
  </g>
</svg>
