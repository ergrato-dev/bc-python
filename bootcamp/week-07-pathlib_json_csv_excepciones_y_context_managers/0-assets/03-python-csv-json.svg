<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="t d">
  <title id="t">De Python a CSV y a JSON</title>
  <desc id="d">Los mismos datos en tres formas. En el centro, en Python, una lista de registros como ("Norte", 12.5) y ("Centro", None). A la izquierda, en CSV: texto con una cabecera etiqueta;valor y una fila por registro; todo es texto, el 12,5 sigue siendo un string y el None se escribe NA. A la derecha, en JSON: un objeto con claves entre comillas dobles; los números siguen siendo números, None se escribe null, True se escribe true y las tuplas vuelven como listas. csv.reader y csv.writer pasan de texto a listas de strings y al revés; json.loads y json.dumps pasan de texto a diccionarios y listas y al revés.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="820" height="440" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="130" y="44" text-anchor="middle" font-weight="700" fill="#4ade80">medidas.csv</text>
    <rect x="30" y="60" width="200" height="150" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="50" y="92">etiqueta;valor</text>
    <text x="50" y="122">Norte;12,5</text>
    <text x="50" y="152">Centro;NA</text>
    <text x="50" y="182">Sur;8</text>

    <text x="410" y="44" text-anchor="middle" font-weight="700" fill="#38bdf8">en Python</text>
    <rect x="300" y="60" width="220" height="150" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="320" y="92">[("Norte", 12.5),</text>
    <text x="328" y="122">("Centro", None),</text>
    <text x="328" y="152">("Sur", 8.0)]</text>
    <text x="320" y="190" fill="#94a3b8" font-size="13">números, None, tuplas</text>

    <text x="690" y="44" text-anchor="middle" font-weight="700" fill="#facc15">resumen.json</text>
    <rect x="590" y="60" width="200" height="150" rx="8" fill="#422006" stroke="#facc15"/>
    <text x="610" y="92">{</text>
    <text x="622" y="118">"registros": 3,</text>
    <text x="622" y="144">"mediana": 10.2,</text>
    <text x="622" y="170">"falta": null</text>
    <text x="610" y="196">}</text>

    <path d="M232 120 L296 120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M296 150 L232 150" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="264" y="112" text-anchor="middle" fill="#94a3b8" font-size="12">reader</text>
    <text x="264" y="168" text-anchor="middle" fill="#94a3b8" font-size="12">writer</text>
    <path d="M524 120 L586 120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <path d="M586 150 L524 150" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="555" y="112" text-anchor="middle" fill="#94a3b8" font-size="12">dumps</text>
    <text x="555" y="168" text-anchor="middle" fill="#94a3b8" font-size="12">loads</text>

    <line x1="30" y1="240" x2="790" y2="240" stroke="#334155"/>

    <text x="30" y="272" font-weight="700" fill="#4ade80">CSV: todo es texto</text>
    <text x="30" y="300" fill="#94a3b8">csv.reader da listas de str: ["Norte", "12,5"]</text>
    <text x="30" y="326" fill="#94a3b8">tú conviertes "12,5" a 12.5 y "NA" a None</text>
    <text x="30" y="352" fill="#94a3b8">la cabecera dice qué es cada columna</text>
    <text x="30" y="378" fill="#94a3b8">sirve para tablas: filas iguales</text>

    <text x="430" y="272" font-weight="700" fill="#facc15">JSON: texto con tipos</text>
    <text x="430" y="300" fill="#94a3b8">números, true/false, null, listas, objetos</text>
    <text x="430" y="326" fill="#94a3b8">las claves siempre son strings</text>
    <text x="430" y="352" fill="#94a3b8">tuplas vuelven como listas; set, no cabe</text>
    <text x="430" y="378" fill="#94a3b8">sirve para datos anidados y APIs</text>

    <text x="30" y="420" fill="#64748b" font-size="13">Ni CSV ni JSON guardan objetos de Python: guardan texto. Leer es convertir y validar; escribir, convertir.</text>
  </g>
</svg>
