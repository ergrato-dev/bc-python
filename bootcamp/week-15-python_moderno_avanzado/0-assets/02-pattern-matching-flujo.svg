<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <rect width="720" height="420" fill="#0d1117" rx="8"/>

  <!-- title -->
  <text x="360" y="34" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">Flujo de Evaluación: match / case</text>

  <!-- input value box -->
  <rect x="280" y="52" width="160" height="40" rx="6" fill="#1c2a38" stroke="#58a6ff" stroke-width="2"/>
  <text x="360" y="68" font-size="11" fill="#58a6ff" text-anchor="middle" font-weight="700">match value:</text>
  <text x="360" y="83" font-size="10" fill="#8b949e" text-anchor="middle">el sujeto del match</text>

  <!-- arrow down -->
  <line x1="360" y1="92" x2="360" y2="112" stroke="#30363d" stroke-width="2"/>
  <polygon points="360,118 354,106 366,106" fill="#30363d"/>

  <!-- case 1 -->
  <rect x="40" y="118" width="640" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="118" width="4" height="52" rx="2" fill="#58a6ff"/>
  <text x="60" y="137" font-size="11" fill="#58a6ff" font-weight="600">case "literal":</text>
  <text x="60" y="153" font-size="10" fill="#8b949e">Compara con valor exacto. Si coincide → ejecuta bloque y sale del match.</text>
  <text x="620" y="148" font-size="10" fill="#3fb950" text-anchor="middle" font-weight="600">✅ match</text>
  <line x1="360" y1="170" x2="360" y2="186" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- case 2 -->
  <rect x="40" y="186" width="640" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="186" width="4" height="52" rx="2" fill="#FFD43B"/>
  <text x="60" y="205" font-size="11" fill="#FFD43B" font-weight="600">case variable if guard:</text>
  <text x="60" y="221" font-size="10" fill="#8b949e">Captura en variable. Solo hace match si el guard (condición) es True.</text>
  <text x="620" y="216" font-size="10" fill="#FFD43B" text-anchor="middle" font-weight="600">⚡ guard</text>
  <line x1="360" y1="238" x2="360" y2="254" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- case 3 -->
  <rect x="40" y="254" width="640" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="254" width="4" height="52" rx="2" fill="#7ee787"/>
  <text x="60" y="273" font-size="11" fill="#7ee787" font-weight="600">case ClassName(attr=val):</text>
  <text x="60" y="289" font-size="10" fill="#8b949e">Class pattern. Verifica tipo y desempaqueta atributos. Ideal para dataclasses.</text>
  <text x="620" y="284" font-size="10" fill="#7ee787" text-anchor="middle" font-weight="600">🏗️ class</text>
  <line x1="360" y1="306" x2="360" y2="322" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- case 4 -->
  <rect x="40" y="322" width="640" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="40" y="322" width="4" height="52" rx="2" fill="#a371f7"/>
  <text x="60" y="341" font-size="11" fill="#a371f7" font-weight="600">case {"key": value}:</text>
  <text x="60" y="357" font-size="10" fill="#8b949e">Mapping pattern. El dict puede tener más claves. Usa **rest para capturar el resto.</text>
  <text x="620" y="352" font-size="10" fill="#a371f7" text-anchor="middle" font-weight="600">🗂️ dict</text>
  <line x1="360" y1="374" x2="360" y2="390" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- case _ (wildcard) -->
  <rect x="40" y="390" width="640" height="18" rx="4" fill="#1c2a38" stroke="#484f58" stroke-width="1"/>
  <text x="60" y="403" font-size="10" fill="#6e7681" font-weight="600">case _:  →  catch-all, siempre hace match</text>

  <!-- footer -->
  <text x="360" y="416" font-size="10" fill="#484f58" text-anchor="middle">Semana 15 · bc-python · Studio BC</text>
</svg>
