<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="t d">
  <title id="t">Cómo crece cada orden</title>
  <desc id="d">Gráfica de pasos frente a n, con n de 1 a 20. O(1) es una línea plana en 1. O(log n) sube muy despacio, hasta unos 4. O(n) es una recta que llega a 20. O(n log n) llega a unos 86. O(n²) se sale de la gráfica a partir de n = 10. A la derecha, una tabla con los pasos de cada orden para un millón de datos: 1, 20, un millón, 20 millones y un billón.</desc>
