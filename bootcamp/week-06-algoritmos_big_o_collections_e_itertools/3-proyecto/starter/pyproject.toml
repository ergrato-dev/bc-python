[project]
name = "observatorio"
version = "0.1.0"
description = "Observatorio de datos de mi dominio"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
# `uv run observatorio` ejecuta la función main() de src/observatorio/__main__.py.
observatorio = "observatorio.__main__:main"

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
