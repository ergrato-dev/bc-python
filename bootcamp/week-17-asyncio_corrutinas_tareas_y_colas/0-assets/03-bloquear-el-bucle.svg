<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d">
  <title id="t">Lo que bloquea el bucle</title>
  <desc id="d">Cuatro tareas que esperan medio segundo cada una, de tres maneras. Con await asyncio.sleep, las cuatro esperas se solapan en el mismo medio segundo y el total es 0,5 segundos. Con time.sleep, la espera no cede el turno: el hilo del bucle se para en cada una, van una detrás de otra y el total es 2 segundos. Con asyncio.to_thread, cada espera bloqueante va a un hilo aparte; las cuatro se solapan, el bucle sigue libre para otras tareas y el total vuelve a ser 0,5 segundos.</desc>
  <rect width="820" height="470" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="410" y="32" text-anchor="middle" font-size="16" font-weight="700">Cuatro esperas de 0,5 s: quién se queda parado</text>
    <text x="24" y="72" font-weight="700" fill="#4ade80">await asyncio.sleep</text>
    <text x="24" y="92" font-size="12" fill="#94a3b8">cede el turno</text>
    <rect x="190" y="58" width="150" height="20" rx="4" fill="#052e16" stroke="#4ade80"/>
    <text x="265" y="73" text-anchor="middle" font-size="12" fill="#e2e8f0">Norte</text>
    <rect x="190" y="82" width="150" height="20" rx="4" fill="#052e16" stroke="#4ade80"/>
    <text x="265" y="97" text-anchor="middle" font-size="12" fill="#e2e8f0">Sur</text>
    <rect x="190" y="106" width="150" height="20" rx="4" fill="#052e16" stroke="#4ade80"/>
    <text x="265" y="121" text-anchor="middle" font-size="12" fill="#e2e8f0">Este</text>
    <rect x="190" y="130" width="150" height="20" rx="4" fill="#052e16" stroke="#4ade80"/>
    <text x="265" y="145" text-anchor="middle" font-size="12" fill="#e2e8f0">Oeste</text>
    <text x="352" y="106" font-weight="700" fill="#4ade80">0,5 s</text>
    <line x1="24" y1="164" x2="796" y2="164" stroke="#334155" stroke-width="2"/>
    <text x="24" y="196" font-weight="700" fill="#f87171">time.sleep</text>
    <text x="24" y="216" font-size="12" fill="#94a3b8">no cede: el bucle</text>
    <text x="24" y="232" font-size="12" fill="#94a3b8">entero se para</text>
    <rect x="190" y="182" width="150" height="20" rx="4" fill="#450a0a" stroke="#f87171"/>
    <text x="265" y="197" text-anchor="middle" font-size="12" fill="#e2e8f0">Norte</text>
    <rect x="340" y="206" width="150" height="20" rx="4" fill="#450a0a" stroke="#f87171"/>
    <text x="415" y="221" text-anchor="middle" font-size="12" fill="#e2e8f0">Sur</text>
    <rect x="490" y="230" width="150" height="20" rx="4" fill="#450a0a" stroke="#f87171"/>
    <text x="565" y="245" text-anchor="middle" font-size="12" fill="#e2e8f0">Este</text>
    <rect x="640" y="254" width="150" height="20" rx="4" fill="#450a0a" stroke="#f87171"/>
    <text x="715" y="269" text-anchor="middle" font-size="12" fill="#e2e8f0">Oeste</text>
    <text x="786" y="290" text-anchor="end" font-weight="700" fill="#f87171">2 s</text>
    <line x1="24" y1="306" x2="796" y2="306" stroke="#334155" stroke-width="2"/>
    <text x="24" y="338" font-weight="700" fill="#38bdf8">asyncio.to_thread</text>
    <text x="24" y="358" font-size="12" fill="#94a3b8">cada espera, en</text>
    <text x="24" y="374" font-size="12" fill="#94a3b8">otro hilo</text>
    <rect x="190" y="324" width="150" height="20" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="265" y="339" text-anchor="middle" font-size="12" fill="#e2e8f0">hilo 1: Norte</text>
    <rect x="190" y="348" width="150" height="20" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="265" y="363" text-anchor="middle" font-size="12" fill="#e2e8f0">hilo 2: Sur</text>
    <rect x="190" y="372" width="150" height="20" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="265" y="387" text-anchor="middle" font-size="12" fill="#e2e8f0">hilo 3: Este</text>
    <rect x="190" y="396" width="150" height="20" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="265" y="411" text-anchor="middle" font-size="12" fill="#e2e8f0">hilo 4: Oeste</text>
    <text x="352" y="372" font-weight="700" fill="#38bdf8">0,5 s</text>
    <rect x="190" y="424" width="600" height="20" rx="4" fill="none" stroke="#38bdf8" stroke-dasharray="6 5"/>
    <text x="490" y="439" text-anchor="middle" font-size="12" fill="#cbd5e1">el bucle, libre para las demás tareas</text>
  </g>
</svg>
