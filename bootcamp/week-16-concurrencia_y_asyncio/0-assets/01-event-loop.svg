<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <rect width="860" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="36" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AsyncIO — Event Loop</text>

  <!-- Event Loop circle -->
  <circle cx="430" cy="255" r="90" fill="none" stroke="#306998" stroke-width="3"/>
  <text x="430" y="248" fill="#FFD43B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">event</text>
  <text x="430" y="268" fill="#FFD43B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">loop</text>

  <!-- Rotation arrow on circle (top arc arrow) -->
  <path d="M 375 185 A 70 70 0 0 1 485 185" fill="none" stroke="#306998" stroke-width="2"/>
  <polygon points="485,185 476,175 494,178" fill="#306998"/>

  <!-- Task boxes on left -->
  <!-- Task 1 -->
  <rect x="60" y="100" width="160" height="50" rx="6" fill="#161b22" stroke="#306998" stroke-width="1.5"/>
  <text x="140" y="121" fill="#e6edf3" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Task 1</text>
  <text x="140" y="140" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">fetch("video.mp4")</text>

  <!-- Task 2 -->
  <rect x="60" y="195" width="160" height="50" rx="6" fill="#161b22" stroke="#306998" stroke-width="1.5"/>
  <text x="140" y="216" fill="#e6edf3" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Task 2</text>
  <text x="140" y="235" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">fetch("image.png")</text>

  <!-- Task 3 -->
  <rect x="60" y="290" width="160" height="50" rx="6" fill="#161b22" stroke="#306998" stroke-width="1.5"/>
  <text x="140" y="311" fill="#e6edf3" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Task 3</text>
  <text x="140" y="330" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">fetch("audio.mp3")</text>

  <!-- Arrows from tasks to loop -->
  <line x1="220" y1="125" x2="342" y2="220" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="342,220 330,215 336,228" fill="#555"/>

  <line x1="220" y1="220" x2="340" y2="250" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="340,250 326,246 330,259" fill="#555"/>

  <line x1="220" y1="315" x2="342" y2="285" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="342,285 330,292 334,278" fill="#555"/>

  <!-- I/O box on right -->
  <rect x="620" y="130" width="170" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="705" y="154" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">I/O — await</text>
  <text x="705" y="174" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">GIL liberado</text>

  <!-- Network/disk box -->
  <rect x="620" y="235" width="170" height="60" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="705" y="258" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">red / disco</text>
  <text x="705" y="278" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">esperando respuesta</text>

  <!-- Arrow: loop to I/O -->
  <line x1="520" y1="230" x2="618" y2="175" stroke="#3fb950" stroke-width="1.5"/>
  <polygon points="618,175 607,176 613,188" fill="#3fb950"/>
  <text x="575" y="192" fill="#3fb950" font-family="sans-serif" font-size="10" text-anchor="middle">cede control</text>

  <!-- Arrow: loop to net/disk -->
  <line x1="520" y1="265" x2="618" y2="265" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="618,265 607,260 607,270" fill="#8b949e"/>

  <!-- Arrow: I/O back to loop (task resumes) -->
  <path d="M 705 130 Q 705 80 560 80 Q 430 80 430 165" fill="none" stroke="#FFD43B" stroke-width="1.5"/>
  <polygon points="430,165 424,153 436,153" fill="#FFD43B"/>
  <text x="570" y="72" fill="#FFD43B" font-family="sans-serif" font-size="10" text-anchor="middle">reanuda task</text>

  <!-- Labels: timeline at bottom -->
  <line x1="60" y1="400" x2="800" y2="400" stroke="#30363d" stroke-width="1"/>
  <text x="430" y="420" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">tiempo →</text>

  <!-- State labels -->
  <rect x="60" y="435" width="14" height="14" rx="2" fill="#306998"/>
  <text x="80" y="447" fill="#8b949e" font-family="sans-serif" font-size="11">ejecutando</text>
  <rect x="175" y="435" width="14" height="14" rx="2" fill="#FFD43B"/>
  <text x="195" y="447" fill="#8b949e" font-family="sans-serif" font-size="11">esperando I/O</text>
  <rect x="310" y="435" width="14" height="14" rx="2" fill="#3fb950"/>
  <text x="330" y="447" fill="#8b949e" font-family="sans-serif" font-size="11">reanudado</text>

  <!-- Key insight box -->
  <rect x="195" y="420" width="0" height="0" fill="none"/>
  <text x="430" y="466" fill="#555" font-family="sans-serif" font-size="10" text-anchor="middle">1 thread · sin paralelismo · concurrencia cooperativa</text>
</svg>
