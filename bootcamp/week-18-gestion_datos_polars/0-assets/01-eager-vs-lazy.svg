<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460">
  <rect width="860" height="460" fill="#0d1117"/>
  <text x="430" y="36" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Polars — Eager vs Lazy API</text>

  <!-- ── LEFT: EAGER ── -->
  <text x="200" y="68" fill="#e05252" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Eager (DataFrame)</text>
  <text x="200" y="86" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">ejecuta inmediatamente</text>

  <!-- Step boxes eager -->
  <rect x="60" y="102" width="280" height="40" rx="6" fill="#2d1616" stroke="#e05252" stroke-width="1.5"/>
  <text x="200" y="127" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">pl.read_csv("data.csv")</text>

  <line x1="200" y1="142" x2="200" y2="162" stroke="#e05252" stroke-width="1.5"/>
  <polygon points="200,162 195,152 205,152" fill="#e05252"/>
  <text x="260" y="155" fill="#e05252" font-family="sans-serif" font-size="10">→ carga RAM</text>

  <rect x="60" y="162" width="280" height="40" rx="6" fill="#2d1616" stroke="#e05252" stroke-width="1.5"/>
  <text x="200" y="187" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.filter(pl.col("hours") > 6)</text>

  <line x1="200" y1="202" x2="200" y2="222" stroke="#e05252" stroke-width="1.5"/>
  <polygon points="200,222 195,212 205,212" fill="#e05252"/>
  <text x="260" y="215" fill="#e05252" font-family="sans-serif" font-size="10">→ opera en RAM</text>

  <rect x="60" y="222" width="280" height="40" rx="6" fill="#2d1616" stroke="#e05252" stroke-width="1.5"/>
  <text x="200" y="247" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.group_by("project_id")</text>

  <line x1="200" y1="262" x2="200" y2="282" stroke="#e05252" stroke-width="1.5"/>
  <polygon points="200,282 195,272 205,272" fill="#e05252"/>
  <text x="260" y="275" fill="#e05252" font-family="sans-serif" font-size="10">→ opera en RAM</text>

  <rect x="60" y="282" width="280" height="40" rx="6" fill="#2d1616" stroke="#e05252" stroke-width="1.5"/>
  <text x="200" y="307" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.agg(pl.col("hours").sum())</text>

  <!-- Result: 4 pasos, cada uno asigna RAM -->
  <rect x="60" y="345" width="280" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="200" y="365" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">4 operaciones = 4 copias en RAM</text>
  <text x="200" y="383" fill="#e05252" font-family="sans-serif" font-size="11" text-anchor="middle">Sin optimización entre pasos</text>
  <text x="200" y="399" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">columnas no usadas se cargan igual</text>

  <!-- ── DIVIDER ── -->
  <line x1="430" y1="60" x2="430" y2="430" stroke="#30363d" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ── RIGHT: LAZY ── -->
  <text x="645" y="68" fill="#3fb950" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Lazy (LazyFrame)</text>
  <text x="645" y="86" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">construye plan, ejecuta al final</text>

  <!-- Step boxes lazy -->
  <rect x="505" y="102" width="280" height="40" rx="6" fill="#162016" stroke="#3fb950" stroke-width="1.5"/>
  <text x="645" y="127" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">pl.scan_csv("data.csv")</text>

  <line x1="645" y1="142" x2="645" y2="162" stroke="#3fb950" stroke-width="1.5"/>
  <polygon points="645,162 640,152 650,152" fill="#3fb950"/>
  <text x="700" y="155" fill="#3fb950" font-family="sans-serif" font-size="10">→ plan</text>

  <rect x="505" y="162" width="280" height="40" rx="6" fill="#162016" stroke="#3fb950" stroke-width="1.5"/>
  <text x="645" y="187" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.filter(pl.col("hours") > 6)</text>

  <line x1="645" y1="202" x2="645" y2="222" stroke="#3fb950" stroke-width="1.5"/>
  <polygon points="645,222 640,212 650,212" fill="#3fb950"/>
  <text x="700" y="215" fill="#3fb950" font-family="sans-serif" font-size="10">→ plan</text>

  <rect x="505" y="222" width="280" height="40" rx="6" fill="#162016" stroke="#3fb950" stroke-width="1.5"/>
  <text x="645" y="247" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.group_by("project_id")</text>

  <line x1="645" y1="262" x2="645" y2="282" stroke="#3fb950" stroke-width="1.5"/>
  <polygon points="645,282 640,272 650,272" fill="#3fb950"/>
  <text x="700" y="275" fill="#3fb950" font-family="sans-serif" font-size="10">→ plan</text>

  <rect x="505" y="282" width="280" height="40" rx="6" fill="#162016" stroke="#3fb950" stroke-width="1.5"/>
  <text x="645" y="307" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.agg(...).collect()</text>

  <!-- optimizer box -->
  <rect x="505" y="345" width="280" height="52" rx="6" fill="#1e2820" stroke="#3fb950" stroke-width="1.5"/>
  <text x="645" y="362" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Query Optimizer</text>
  <text x="645" y="379" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">predicate pushdown · projection pushdown</text>
  <text x="645" y="395" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">parallelismo · eliminación de columnas</text>

  <!-- Bottom legend -->
  <rect x="60" y="420" width="740" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="430" y="438" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Lazy lee solo las columnas usadas · aplica filtros antes de cargar · paraleliza automáticamente</text>
</svg>
