<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500">
  <rect width="860" height="500" fill="#0d1117"/>
  <text x="430" y="36" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Polars — Tipos de Join</text>

  <!-- ── Helper: left circle, right circle, overlap ── -->
  <!-- INNER -->
  <text x="107" y="72" fill="#e6edf3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">inner</text>
  <text x="107" y="88" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">how="inner"</text>
  <circle cx="90"  cy="128" r="38" fill="#163356" fill-opacity="0.6" stroke="#306998" stroke-width="1.5"/>
  <circle cx="124" cy="128" r="38" fill="#2d1f00" fill-opacity="0.6" stroke="#FFD43B" stroke-width="1.5"/>
  <!-- highlight intersection -->
  <clipPath id="clip-inner-r"><circle cx="124" cy="128" r="38"/></clipPath>
  <circle cx="90" cy="128" r="38" fill="#FFD43B" fill-opacity="0.35" clip-path="url(#clip-inner-r)"/>
  <text x="107" y="132" fill="#e6edf3" font-family="sans-serif" font-size="10" text-anchor="middle">match</text>
  <text x="107" y="185" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">solo filas con match</text>
  <text x="107" y="198" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">en ambos DFs</text>

  <!-- LEFT -->
  <text x="322" y="72" fill="#e6edf3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">left</text>
  <text x="322" y="88" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">how="left"</text>
  <circle cx="305" cy="128" r="38" fill="#306998" fill-opacity="0.55" stroke="#306998" stroke-width="1.5"/>
  <circle cx="339" cy="128" r="38" fill="#2d1f00" fill-opacity="0.3" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="322" y="132" fill="#e6edf3" font-family="sans-serif" font-size="10" text-anchor="middle">izq. completo</text>
  <text x="322" y="185" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">todas las filas del DF</text>
  <text x="322" y="198" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">izquierdo, null si no match</text>

  <!-- RIGHT -->
  <text x="537" y="72" fill="#e6edf3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">right</text>
  <text x="537" y="88" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">how="right"</text>
  <circle cx="520" cy="128" r="38" fill="#163356" fill-opacity="0.3" stroke="#306998" stroke-width="1.5"/>
  <circle cx="554" cy="128" r="38" fill="#FFD43B" fill-opacity="0.45" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="537" y="132" fill="#e6edf3" font-family="sans-serif" font-size="10" text-anchor="middle">der. completo</text>
  <text x="537" y="185" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">todas las filas del DF</text>
  <text x="537" y="198" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">derecho, null si no match</text>

  <!-- FULL -->
  <text x="752" y="72" fill="#e6edf3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">full</text>
  <text x="752" y="88" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">how="full"</text>
  <circle cx="735" cy="128" r="38" fill="#306998" fill-opacity="0.5" stroke="#306998" stroke-width="1.5"/>
  <circle cx="769" cy="128" r="38" fill="#FFD43B" fill-opacity="0.4" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="752" y="132" fill="#e6edf3" font-family="sans-serif" font-size="10" text-anchor="middle">ambos</text>
  <text x="752" y="185" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">todas las filas de ambos,</text>
  <text x="752" y="198" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">null donde no hay match</text>

  <!-- Legend circles -->
  <circle cx="375" cy="72" r="8" fill="#306998" fill-opacity="0.7" stroke="#306998" stroke-width="1"/>
  <text x="389" y="77" fill="#8b949e" font-family="sans-serif" font-size="11">DF izquierdo (projects)</text>
  <circle cx="375" cy="92" r="8" fill="#FFD43B" fill-opacity="0.6" stroke="#FFD43B" stroke-width="1"/>
  <text x="389" y="97" fill="#8b949e" font-family="sans-serif" font-size="11">DF derecho (timesheets)</text>

  <!-- ── Example data ── -->
  <line x1="40" y1="218" x2="820" y2="218" stroke="#30363d" stroke-width="1"/>
  <text x="430" y="235" fill="#8b949e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ejemplo — Studio BC</text>

  <!-- Left DF -->
  <text x="180" y="258" fill="#306998" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">projects (izquierdo)</text>
  <rect x="60" y="265" width="240" height="100" rx="4" fill="#161b22" stroke="#306998" stroke-width="1"/>
  <text x="80" y="282" fill="#8b949e" font-family="monospace" font-size="10">project_id   | budget</text>
  <line x1="68" y1="286" x2="292" y2="286" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="302" fill="#e6edf3" font-family="monospace" font-size="10">reel-2025    | 8000</text>
  <text x="80" y="318" fill="#e6edf3" font-family="monospace" font-size="10">spot-bc-01   | 2500</text>
  <text x="80" y="334" fill="#e6edf3" font-family="monospace" font-size="10">short-film   | 5000</text>
  <text x="80" y="350" fill="#555" font-family="monospace" font-size="10">← sin horas registradas</text>

  <!-- Right DF -->
  <text x="645" y="258" fill="#FFD43B" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">timesheets (derecho)</text>
  <rect x="520" y="265" width="260" height="100" rx="4" fill="#161b22" stroke="#FFD43B" stroke-width="1"/>
  <text x="540" y="282" fill="#8b949e" font-family="monospace" font-size="10">project_id   | hours</text>
  <line x1="528" y1="286" x2="772" y2="286" stroke="#30363d" stroke-width="1"/>
  <text x="540" y="302" fill="#e6edf3" font-family="monospace" font-size="10">reel-2025    | 42.0</text>
  <text x="540" y="318" fill="#e6edf3" font-family="monospace" font-size="10">spot-bc-01   | 15.0</text>
  <text x="540" y="334" fill="#e6edf3" font-family="monospace" font-size="10">reel-2025    | 18.0  ← duplicado</text>

  <!-- Result table: left join -->
  <text x="430" y="392" fill="#306998" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Resultado: left join (projects.join(timesheets, on="project_id", how="left"))</text>
  <rect x="110" y="402" width="640" height="82" rx="4" fill="#161b22" stroke="#306998" stroke-width="1.5"/>
  <text x="130" y="420" fill="#8b949e" font-family="monospace" font-size="10">project_id   | budget | hours</text>
  <line x1="118" y1="424" x2="742" y2="424" stroke="#30363d" stroke-width="1"/>
  <text x="130" y="440" fill="#e6edf3" font-family="monospace" font-size="10">reel-2025    | 8000   | 42.0    ← match</text>
  <text x="130" y="456" fill="#e6edf3" font-family="monospace" font-size="10">reel-2025    | 8000   | 18.0    ← match (duplicado de right)</text>
  <text x="130" y="472" fill="#e6edf3" font-family="monospace" font-size="10">spot-bc-01   | 2500   | 15.0    ← match</text>
  <text x="450" y="472" fill="#e05252" font-family="monospace" font-size="10">short-film   | 5000   | null    ← sin match → null</text>
</svg>
