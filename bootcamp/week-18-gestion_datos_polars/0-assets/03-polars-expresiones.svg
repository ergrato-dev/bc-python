<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <rect width="860" height="480" fill="#0d1117"/>
  <text x="430" y="36" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Anatomía de una Expresión Polars</text>

  <!-- ── Expression chain ── -->
  <!-- Source: pl.col() -->
  <rect x="40" y="68" width="130" height="52" rx="8" fill="#163356" stroke="#306998" stroke-width="2"/>
  <text x="105" y="90" fill="#FFD43B" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">pl.col(</text>
  <text x="105" y="108" fill="#FFD43B" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">"hours")</text>

  <line x1="170" y1="94" x2="200" y2="94" stroke="#306998" stroke-width="2"/>
  <polygon points="200,94 191,89 191,99" fill="#306998"/>

  <!-- Transform 1: .cast() -->
  <rect x="200" y="68" width="120" height="52" rx="8" fill="#1c2030" stroke="#8b949e" stroke-width="1.5"/>
  <text x="260" y="90" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.cast(</text>
  <text x="260" y="108" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">pl.Float32)</text>

  <line x1="320" y1="94" x2="350" y2="94" stroke="#8b949e" stroke-width="2"/>
  <polygon points="350,94 341,89 341,99" fill="#8b949e"/>

  <!-- Transform 2: .round() -->
  <rect x="350" y="68" width="120" height="52" rx="8" fill="#1c2030" stroke="#8b949e" stroke-width="1.5"/>
  <text x="410" y="90" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">.round(1)</text>
  <text x="410" y="108" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">redondea</text>

  <line x1="470" y1="94" x2="500" y2="94" stroke="#8b949e" stroke-width="2"/>
  <polygon points="500,94 491,89 491,99" fill="#8b949e"/>

  <!-- Transform 3: * 150 -->
  <rect x="500" y="68" width="140" height="52" rx="8" fill="#1c2030" stroke="#8b949e" stroke-width="1.5"/>
  <text x="570" y="90" fill="#e6edf3" font-family="monospace" font-size="12" text-anchor="middle">* pl.lit(150.0)</text>
  <text x="570" y="108" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">multiplica</text>

  <line x1="640" y1="94" x2="670" y2="94" stroke="#3fb950" stroke-width="2"/>
  <polygon points="670,94 661,89 661,99" fill="#3fb950"/>

  <!-- .alias() -->
  <rect x="670" y="68" width="150" height="52" rx="8" fill="#1e2820" stroke="#3fb950" stroke-width="2"/>
  <text x="745" y="90" fill="#3fb950" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">.alias(</text>
  <text x="745" y="108" fill="#3fb950" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">"revenue")</text>

  <!-- Full expression label -->
  <rect x="40" y="148" width="780" height="42" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="430" y="165" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Expresión completa:</text>
  <text x="430" y="182" fill="#FFD43B" font-family="monospace" font-size="12" text-anchor="middle">pl.col("hours").cast(pl.Float32).round(1) * pl.lit(150.0).alias("revenue")</text>

  <!-- Divider -->
  <line x1="40" y1="210" x2="820" y2="210" stroke="#30363d" stroke-width="1"/>

  <!-- ── Where expressions go ── -->
  <text x="430" y="232" fill="#e6edf3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Dónde se usan las expresiones</text>

  <!-- select -->
  <rect x="40" y="248" width="180" height="80" rx="6" fill="#1c2030" stroke="#306998" stroke-width="1.5"/>
  <text x="130" y="268" fill="#306998" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">select()</text>
  <text x="130" y="286" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">df.select(</text>
  <text x="130" y="302" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  pl.col("hours"),</text>
  <text x="130" y="318" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  expr.alias("rev"))</text>

  <!-- with_columns -->
  <rect x="240" y="248" width="200" height="80" rx="6" fill="#1c2030" stroke="#306998" stroke-width="1.5"/>
  <text x="340" y="268" fill="#306998" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">with_columns()</text>
  <text x="340" y="286" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">df.with_columns(</text>
  <text x="340" y="302" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  expr.alias("rev"),</text>
  <text x="340" y="318" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  pl.col("emp").str.upper())</text>

  <!-- filter -->
  <rect x="460" y="248" width="170" height="80" rx="6" fill="#1c2030" stroke="#306998" stroke-width="1.5"/>
  <text x="545" y="268" fill="#306998" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">filter()</text>
  <text x="545" y="286" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">df.filter(</text>
  <text x="545" y="302" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  (pl.col("hours") > 6)</text>
  <text x="545" y="318" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  &amp; pl.col("b"))</text>

  <!-- agg -->
  <rect x="650" y="248" width="170" height="80" rx="6" fill="#1c2030" stroke="#306998" stroke-width="1.5"/>
  <text x="735" y="268" fill="#306998" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">agg()</text>
  <text x="735" y="286" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">.agg(</text>
  <text x="735" y="302" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  pl.col("h").sum(),</text>
  <text x="735" y="318" fill="#8b949e" font-family="monospace" font-size="10" text-anchor="middle">  pl.col("e").n_unique())</text>

  <!-- when/then/otherwise -->
  <rect x="40" y="348" width="780" height="96" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="430" y="368" fill="#FFD43B" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">pl.when().then().otherwise() — expresión condicional</text>
  <text x="430" y="390" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">pl.when(pl.col("hours") > 8)</text>
  <text x="430" y="408" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">  .then(pl.lit("overtime"))         # condición verdadera</text>
  <text x="430" y="426" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">  .otherwise(pl.lit("regular"))     # condición falsa</text>
  <text x="430" y="444" fill="#8b949e" font-family="monospace" font-size="11" text-anchor="middle">  .alias("shift_type")</text>
</svg>
