    <text x="60" y="330" font-weight="700" fill="#f9a8d4">py-spy · por muestreo</text>
    <text x="60" y="352" font-size="12" fill="#cbd5e1">cada 10 ms mira desde fuera qué pila tiene el programa y la apunta</text>
