<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d">
  <title id="t">Determinista y por muestreo</title>
  <desc id="d">El mismo programa a lo largo del tiempo: tres vueltas en las que parse_values ocupa la mayor parte y checksum el resto. Arriba, cProfile, un perfilador determinista: Python le avisa en cada llamada y cada retorno, también en las llamadas cortas a float y split dentro de parse_values, y anota la hora de cada una. Lo sabe todo, con cuántas llamadas, pero paga un coste en cada una: el informe de la semana 21 hizo 137 millones de llamadas y pasó de 21 a 51 segundos. Abajo, py-spy, un perfilador por muestreo: cada 10 milisegundos mira desde fuera qué pila de llamadas tiene el programa y la apunta. Al final cuenta: parse_values estaba en 123 de 170 muestras y checksum en 36. No sabe cuántas llamadas hubo, pero el programa casi no lo nota.</desc>
  <rect width="860" height="470" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">El mismo programa, visto por dos perfiladores</text>
    <text x="60" y="203" font-size="12" fill="#94a3b8">tu programa, de izquierda a derecha en el tiempo</text>
    <rect x="60" y="212" width="165" height="34" fill="#172554" stroke="#60a5fa"/>
    <text x="142.5" y="234" text-anchor="middle" font-size="12">parse_values</text>
    <rect x="225" y="212" width="58" height="34" fill="#052e16" stroke="#4ade80"/>
    <text x="254.0" y="234" text-anchor="middle" font-size="12">check</text>
    <rect x="283" y="212" width="165" height="34" fill="#172554" stroke="#60a5fa"/>
    <text x="365.5" y="234" text-anchor="middle" font-size="12">parse_values</text>
    <rect x="448" y="212" width="58" height="34" fill="#052e16" stroke="#4ade80"/>
    <text x="477.0" y="234" text-anchor="middle" font-size="12">check</text>
    <rect x="506" y="212" width="165" height="34" fill="#172554" stroke="#60a5fa"/>
    <text x="588.5" y="234" text-anchor="middle" font-size="12">parse_values</text>
    <rect x="671" y="212" width="58" height="34" fill="#052e16" stroke="#4ade80"/>
    <text x="700.0" y="234" text-anchor="middle" font-size="12">check</text>
    <text x="60" y="80" font-weight="700" fill="#93c5fd">cProfile · determinista</text>
    <text x="60" y="102" font-size="12" fill="#cbd5e1">Python le avisa en cada llamada y cada retorno, también las de float() y split()</text>
