<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="t d">
  <title id="t">Lista frente a array</title>
  <desc id="d">A la izquierda, una lista de Python con cinco valores: guarda cinco referencias de 8 bytes, cada una apunta a un objeto float suelto en otra parte de la memoria, con su tipo, su contador de referencias y el número, 24 bytes cada uno. Un millón de valores ocupan unos 32 megabytes. Un bucle de Python, por cada elemento, sigue la referencia, mira el tipo, suma y crea un float nuevo para el resultado. A la derecha, un array de NumPy con dtype float64: los cinco números seguidos en un solo bloque, 8 bytes cada uno, sin objetos. Un millón ocupan 8 megabytes. NumPy recorre el bloque con un bucle en C, sin mirar tipos ni crear objetos, y suma varios números en una sola instrucción. Sumar un millón: 17 milisegundos con un bucle de Python, 5 con sum y 0,1 con np.sum.</desc>
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="860" height="460" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">Los mismos cinco números, en una lista y en un array</text>
    <text x="200" y="68" text-anchor="middle" font-weight="700" fill="#fca5a5">list de Python</text>
    <text x="630" y="68" text-anchor="middle" font-weight="700" fill="#86efac">np.ndarray · dtype float64</text>
    <line x1="430" y1="56" x2="430" y2="430" stroke="#334155"/>
    <rect x="40" y="100" width="70" height="34" fill="#1e293b" stroke="#94a3b8"/>
    <text x="75" y="122" text-anchor="middle" font-size="12" fill="#94a3b8">ref 0</text>
    <rect x="40" y="144" width="70" height="34" fill="#1e293b" stroke="#94a3b8"/>
    <text x="75" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">ref 1</text>
    <rect x="40" y="188" width="70" height="34" fill="#1e293b" stroke="#94a3b8"/>
    <text x="75" y="210" text-anchor="middle" font-size="12" fill="#94a3b8">ref 2</text>
    <rect x="40" y="232" width="70" height="34" fill="#1e293b" stroke="#94a3b8"/>
    <text x="75" y="254" text-anchor="middle" font-size="12" fill="#94a3b8">ref 3</text>
    <rect x="40" y="276" width="70" height="34" fill="#1e293b" stroke="#94a3b8"/>
    <text x="75" y="298" text-anchor="middle" font-size="12" fill="#94a3b8">ref 4</text>
    <line x1="110" y1="117" x2="246" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#grey)"/>
    <rect x="250" y="90" width="120" height="40" rx="6" fill="#450a0a" stroke="#f87171"/>
    <text x="310" y="106" text-anchor="middle" font-size="11" fill="#fca5a5">float · tipo · contador</text>
    <text x="310" y="123" text-anchor="middle" font-size="12">12.5</text>
    <line x1="110" y1="161" x2="296" y2="190" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#grey)"/>
    <rect x="300" y="170" width="120" height="40" rx="6" fill="#450a0a" stroke="#f87171"/>
    <text x="360" y="186" text-anchor="middle" font-size="11" fill="#fca5a5">float · tipo · contador</text>
    <text x="360" y="203" text-anchor="middle" font-size="12">8.0</text>
    <line x1="110" y1="205" x2="226" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#grey)"/>
    <rect x="230" y="240" width="120" height="40" rx="6" fill="#450a0a" stroke="#f87171"/>
    <text x="290" y="256" text-anchor="middle" font-size="11" fill="#fca5a5">float · tipo · contador</text>
    <text x="290" y="273" text-anchor="middle" font-size="12">55.1</text>
    <line x1="110" y1="249" x2="326" y2="330" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#grey)"/>
    <rect x="330" y="310" width="120" height="40" rx="6" fill="#450a0a" stroke="#f87171"/>
    <text x="390" y="326" text-anchor="middle" font-size="11" fill="#fca5a5">float · tipo · contador</text>
    <text x="390" y="343" text-anchor="middle" font-size="12">48.9</text>
    <line x1="110" y1="293" x2="246" y2="400" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#grey)"/>
    <rect x="250" y="380" width="120" height="40" rx="6" fill="#450a0a" stroke="#f87171"/>
    <text x="310" y="396" text-anchor="middle" font-size="11" fill="#fca5a5">float · tipo · contador</text>
    <text x="310" y="413" text-anchor="middle" font-size="12">30.7</text>
    <text x="40" y="335" font-size="12" fill="#cbd5e1">8 bytes por referencia</text>
    <text x="40" y="353" font-size="12" fill="#cbd5e1">+ 24 por objeto</text>
    <text x="40" y="380" font-size="12" fill="#fcd34d">1 millón: unos 32 MB</text>
    <text x="40" y="440" font-size="12" fill="#cbd5e1">bucle de Python: referencia, tipo y un float nuevo por elemento</text>
    <rect x="470" y="120" width="64" height="44" fill="#052e16" stroke="#4ade80"/>
    <text x="502" y="147" text-anchor="middle" font-size="13">12.5</text>
    <text x="502" y="184" text-anchor="middle" font-size="11" fill="#94a3b8">byte 0</text>
    <rect x="534" y="120" width="64" height="44" fill="#052e16" stroke="#4ade80"/>
    <text x="566" y="147" text-anchor="middle" font-size="13">8.0</text>
    <text x="566" y="184" text-anchor="middle" font-size="11" fill="#94a3b8">byte 8</text>
    <rect x="598" y="120" width="64" height="44" fill="#052e16" stroke="#4ade80"/>
    <text x="630" y="147" text-anchor="middle" font-size="13">55.1</text>
    <text x="630" y="184" text-anchor="middle" font-size="11" fill="#94a3b8">byte 16</text>
    <rect x="662" y="120" width="64" height="44" fill="#052e16" stroke="#4ade80"/>
    <text x="694" y="147" text-anchor="middle" font-size="13">48.9</text>
    <text x="694" y="184" text-anchor="middle" font-size="11" fill="#94a3b8">byte 24</text>
    <rect x="726" y="120" width="64" height="44" fill="#052e16" stroke="#4ade80"/>
    <text x="758" y="147" text-anchor="middle" font-size="13">30.7</text>
    <text x="758" y="184" text-anchor="middle" font-size="11" fill="#94a3b8">byte 32</text>
    <text x="470" y="226" font-size="12" fill="#cbd5e1">un solo bloque: el número i está en el byte i × 8</text>
    <text x="470" y="248" font-size="12" fill="#cbd5e1">sin objetos, sin tipos que mirar uno a uno</text>
    <text x="470" y="276" font-size="12" fill="#fcd34d">1 millón: 8 MB</text>
    <rect x="470" y="300" width="350" height="112" rx="8" fill="#1e293b" stroke="#94a3b8"/>
    <text x="486" y="324" font-size="13" font-weight="700">Sumar un millón de valores</text>
    <text x="486" y="350" font-size="12">bucle for</text><text x="804" y="350" text-anchor="end" font-size="12" fill="#fca5a5">17 ms</text>
    <text x="486" y="372" font-size="12">sum(lista)</text><text x="804" y="372" text-anchor="end" font-size="12" fill="#fcd34d">5 ms</text>
    <text x="486" y="394" font-size="12">np.sum(array)</text><text x="804" y="394" text-anchor="end" font-size="12" fill="#86efac">0,1 ms</text>
    <text x="470" y="440" font-size="12" fill="#cbd5e1">NumPy: un bucle en C, varias sumas por instrucción</text>
  </g>
</svg>
