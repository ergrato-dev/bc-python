[project]
name = "studio-refactored"
version = "0.1.0"
description = "Studio BC pipeline refactorizado con Clean Architecture"
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.41",
    "typer>=0.12",
    "rich>=13.7",
    "boto3>=1.34",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-cov", "boto3-stubs[s3]"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
