[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "studio-post-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "watchdog>=4.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
mediainfo = ["pymediainfo>=6.0"]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.mypy]
strict = true
