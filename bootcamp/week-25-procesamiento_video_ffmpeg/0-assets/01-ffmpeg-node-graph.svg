<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" font-family="sans-serif">
  <rect width="820" height="360" fill="#0d1117"/>
  <text x="410" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">ffmpeg-python — Grafo de Nodos</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFD43B"/>
    </marker>
  </defs>

  <!-- INPUT node -->
  <rect x="30" y="80" width="140" height="80" rx="6" fill="#161b22" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="100" y="106" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">INPUT</text>
  <text x="100" y="122" fill="#8b949e" font-size="9" text-anchor="middle">ffmpeg.input("video.mp4")</text>
  <text x="100" y="138" fill="#8b949e" font-size="9" text-anchor="middle">ss=, t=, framerate=</text>

  <!-- Video stream -->
  <line x1="170" y1="105" x2="218" y2="105" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="194" y="99" fill="#f85149" font-size="9">.video</text>

  <!-- Audio stream -->
  <line x1="170" y1="145" x2="218" y2="145" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="192" y="139" fill="#3fb950" font-size="9">.audio</text>

  <!-- Filter 1: scale -->
  <rect x="220" y="80" width="130" height="45" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="285" y="100" fill="#f85149" font-size="10" font-weight="bold" text-anchor="middle">filter("scale")</text>
  <text x="285" y="116" fill="#8b949e" font-size="9" text-anchor="middle">1280, -2</text>

  <!-- Filter 2: fps -->
  <line x1="350" y1="102" x2="398" y2="102" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="400" y="80" width="130" height="45" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="465" y="100" fill="#f85149" font-size="10" font-weight="bold" text-anchor="middle">filter("fps")</text>
  <text x="465" y="116" fill="#8b949e" font-size="9" text-anchor="middle">fps=25</text>

  <!-- Filter 3: drawtext -->
  <line x1="530" y1="102" x2="578" y2="102" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="580" y="80" width="140" height="45" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="650" y="100" fill="#FFD43B" font-size="10" font-weight="bold" text-anchor="middle">filter("drawtext")</text>
  <text x="650" y="116" fill="#8b949e" font-size="9" text-anchor="middle">text=, x=, y=</text>

  <!-- Audio passthrough -->
  <line x1="220" y1="145" x2="580" y2="145" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="390" y="139" fill="#3fb950" font-size="9">audio passthrough</text>

  <!-- Converge to OUTPUT -->
  <line x1="720" y1="102" x2="748" y2="102" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="145" x2="748" y2="130" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="750" y="80" width="50" height="80" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="775" y="118" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90,775,118)">OUTPUT</text>

  <!-- Python code example -->
  <rect x="30" y="220" width="760" height="120" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="244" fill="#FFD43B" font-size="10">inp</text>
  <text x="75" y="244" fill="#e6edf3" font-size="10"> = ffmpeg.input(</text>
  <text x="207" y="244" fill="#3fb950" font-size="10">"video.mp4"</text>
  <text x="262" y="244" fill="#e6edf3" font-size="10">)</text>

  <text x="50" y="262" fill="#FFD43B" font-size="10">v</text>
  <text x="62" y="262" fill="#e6edf3" font-size="10"> = inp.video.filter(</text>
  <text x="186" y="262" fill="#3fb950" font-size="10">"scale"</text>
  <text x="228" y="262" fill="#e6edf3" font-size="10">, 1280, -2).filter(</text>
  <text x="363" y="262" fill="#3fb950" font-size="10">"fps"</text>
  <text x="392" y="262" fill="#e6edf3" font-size="10">, fps=25)</text>

  <text x="50" y="280" fill="#58a6ff" font-size="10">ffmpeg.output(v, inp.audio, </text>
  <text x="230" y="280" fill="#3fb950" font-size="10">"out.mp4"</text>
  <text x="276" y="280" fill="#e6edf3" font-size="10">, vcodec=</text>
  <text x="335" y="280" fill="#3fb950" font-size="10">"libx264"</text>
  <text x="388" y="280" fill="#e6edf3" font-size="10">, crf=</text>
  <text x="419" y="280" fill="#f85149" font-size="10">23</text>
  <text x="432" y="280" fill="#e6edf3" font-size="10">)</text>

  <text x="50" y="298" fill="#58a6ff" font-size="10">    .run(overwrite_output=</text>
  <text x="208" y="298" fill="#f85149" font-size="10">True</text>
  <text x="234" y="298" fill="#58a6ff" font-size="10">, quiet=</text>
  <text x="284" y="298" fill="#f85149" font-size="10">True</text>
  <text x="310" y="298" fill="#58a6ff" font-size="10">)</text>
</svg>
