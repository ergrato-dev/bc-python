<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" font-family="sans-serif">
  <rect width="820" height="320" fill="#0d1117"/>
  <text x="410" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">studio-post-pipeline — Post-producción automática</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Step 1: RAW input -->
  <rect x="20" y="55" width="110" height="70" rx="6" fill="#21262d" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="75" y="78" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">drop/</text>
  <text x="75" y="94" fill="#8b949e" font-size="9" text-anchor="middle">video_raw.mp4</text>
  <text x="75" y="108" fill="#8b949e" font-size="9" text-anchor="middle">4K · ProRes</text>

  <line x1="130" y1="90" x2="153" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Metadata -->
  <rect x="155" y="55" width="120" height="70" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="215" y="76" fill="#FFD43B" font-size="10" font-weight="bold" text-anchor="middle">ffprobe</text>
  <text x="215" y="92" fill="#8b949e" font-size="9" text-anchor="middle">codec, res, fps</text>
  <text x="215" y="106" fill="#8b949e" font-size="9" text-anchor="middle">→ meta.json</text>

  <!-- Fan out to 4 operations -->
  <line x1="275" y1="90" x2="298" y2="90" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="300" y="55" width="120" height="70" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="360" y="76" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">Orquestador</text>
  <text x="360" y="92" fill="#8b949e" font-size="9" text-anchor="middle">pipeline.process()</text>
  <text x="360" y="106" fill="#8b949e" font-size="9" text-anchor="middle">4 outputs en paralelo</text>

  <!-- Arrow to outputs -->
  <line x1="420" y1="68" x2="460" y2="115" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="420" y1="78" x2="460" y2="165" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="420" y1="90" x2="460" y2="215" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="420" y1="102" x2="460" y2="265" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Output boxes -->
  <rect x="462" y="100" width="200" height="45" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="562" y="120" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">Proxy</text>
  <text x="562" y="135" fill="#8b949e" font-size="9" text-anchor="middle">scale=25% · H.264 fast · 720p</text>

  <rect x="462" y="153" width="200" height="45" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="562" y="173" fill="#FFD43B" font-size="10" font-weight="bold" text-anchor="middle">Thumbnail</text>
  <text x="562" y="188" fill="#8b949e" font-size="9" text-anchor="middle">frame en ss=5 · JPG 1280×720</text>

  <rect x="462" y="203" width="200" height="45" rx="5" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="562" y="223" fill="#58a6ff" font-size="10" font-weight="bold" text-anchor="middle">Web encode</text>
  <text x="562" y="238" fill="#8b949e" font-size="9" text-anchor="middle">H.264 CRF23 · 1080p · faststart</text>

  <rect x="462" y="253" width="200" height="45" rx="5" fill="#21262d" stroke="#8b949e" stroke-width="1"/>
  <text x="562" y="273" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">Archive</text>
  <text x="562" y="288" fill="#8b949e" font-size="9" text-anchor="middle">mover original a archive/</text>

  <!-- Output folder -->
  <rect x="680" y="100" width="120" height="200" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="740" y="120" fill="#e6edf3" font-size="10" font-weight="bold" text-anchor="middle">output/</text>
  <text x="740" y="143" fill="#3fb950"  font-size="9"  text-anchor="middle">proxy/</text>
  <text x="740" y="163" fill="#FFD43B"  font-size="9"  text-anchor="middle">thumbs/</text>
  <text x="740" y="183" fill="#58a6ff"  font-size="9"  text-anchor="middle">web/</text>
  <text x="740" y="203" fill="#8b949e"  font-size="9"  text-anchor="middle">archive/</text>
  <text x="740" y="223" fill="#FFD43B"  font-size="9"  text-anchor="middle">meta/</text>

  <line x1="662" y1="122" x2="678" y2="122" stroke="#58a6ff" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="662" y1="175" x2="678" y2="165" stroke="#58a6ff" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="662" y1="225" x2="678" y2="185" stroke="#58a6ff" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="662" y1="275" x2="678" y2="205" stroke="#58a6ff" stroke-width="1" marker-end="url(#arr)"/>
</svg>
