<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="sans-serif">
  <!-- Background -->
  <rect width="820" height="420" fill="#0d1117"/>

  <!-- Title -->
  <text x="410" y="32" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">httpx — Ciclo de Request/Response</text>

  <!-- ===== CLIENT BOX ===== -->
  <rect x="30" y="60" width="170" height="300" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="115" y="82" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">httpx.Client</text>

  <!-- Client internals -->
  <rect x="50" y="95" width="130" height="36" rx="4" fill="#21262d" stroke="#306998" stroke-width="1"/>
  <text x="115" y="114" fill="#FFD43B" font-size="11" text-anchor="middle">Auth</text>
  <text x="115" y="126" fill="#8b949e" font-size="9" text-anchor="middle">headers / tokens</text>

  <rect x="50" y="140" width="130" height="36" rx="4" fill="#21262d" stroke="#306998" stroke-width="1"/>
  <text x="115" y="159" fill="#FFD43B" font-size="11" text-anchor="middle">Timeout</text>
  <text x="115" y="171" fill="#8b949e" font-size="9" text-anchor="middle">connect / read / write</text>

  <rect x="50" y="185" width="130" height="36" rx="4" fill="#21262d" stroke="#306998" stroke-width="1"/>
  <text x="115" y="204" fill="#FFD43B" font-size="11" text-anchor="middle">Connection Pool</text>
  <text x="115" y="216" fill="#8b949e" font-size="9" text-anchor="middle">reutiliza TCP</text>

  <rect x="50" y="230" width="130" height="36" rx="4" fill="#21262d" stroke="#306998" stroke-width="1"/>
  <text x="115" y="249" fill="#FFD43B" font-size="11" text-anchor="middle">Transport</text>
  <text x="115" y="261" fill="#8b949e" font-size="9" text-anchor="middle">HTTP/1.1 · HTTP/2</text>

  <rect x="50" y="275" width="130" height="36" rx="4" fill="#21262d" stroke="#306998" stroke-width="1"/>
  <text x="115" y="294" fill="#FFD43B" font-size="11" text-anchor="middle">Redirects / Cookies</text>
  <text x="115" y="306" fill="#8b949e" font-size="9" text-anchor="middle">follow_redirects=True</text>

  <!-- ===== NETWORK CLOUD ===== -->
  <ellipse cx="410" cy="210" rx="70" ry="45" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="410" y="205" fill="#8b949e" font-size="12" text-anchor="middle">Internet /</text>
  <text x="410" y="222" fill="#8b949e" font-size="12" text-anchor="middle">Red local</text>

  <!-- ===== SERVER BOX ===== -->
  <rect x="620" y="60" width="170" height="300" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="705" y="82" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">API Server</text>

  <!-- Server internals -->
  <rect x="640" y="95" width="130" height="36" rx="4" fill="#21262d" stroke="#238636" stroke-width="1"/>
  <text x="705" y="114" fill="#3fb950" font-size="11" text-anchor="middle">Rate Limiter</text>
  <text x="705" y="126" fill="#8b949e" font-size="9" text-anchor="middle">429 si supera límite</text>

  <rect x="640" y="140" width="130" height="36" rx="4" fill="#21262d" stroke="#238636" stroke-width="1"/>
  <text x="705" y="159" fill="#3fb950" font-size="11" text-anchor="middle">Auth Check</text>
  <text x="705" y="171" fill="#8b949e" font-size="9" text-anchor="middle">401 / 403</text>

  <rect x="640" y="185" width="130" height="36" rx="4" fill="#21262d" stroke="#238636" stroke-width="1"/>
  <text x="705" y="204" fill="#3fb950" font-size="11" text-anchor="middle">Business Logic</text>
  <text x="705" y="216" fill="#8b949e" font-size="9" text-anchor="middle">404 si no existe</text>

  <rect x="640" y="230" width="130" height="36" rx="4" fill="#21262d" stroke="#238636" stroke-width="1"/>
  <text x="705" y="249" fill="#3fb950" font-size="11" text-anchor="middle">Serialization</text>
  <text x="705" y="261" fill="#8b949e" font-size="9" text-anchor="middle">JSON / XML</text>

  <rect x="640" y="275" width="130" height="36" rx="4" fill="#21262d" stroke="#238636" stroke-width="1"/>
  <text x="705" y="294" fill="#3fb950" font-size="11" text-anchor="middle">Response</text>
  <text x="705" y="306" fill="#8b949e" font-size="9" text-anchor="middle">200 · 201 · 204</text>

  <!-- ===== REQUEST ARROW (top) ===== -->
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Request path -->
  <line x1="200" y1="175" x2="335" y2="190" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="5,3"/>
  <text x="265" y="168" fill="#58a6ff" font-size="11" text-anchor="middle">GET /projects</text>
  <text x="265" y="181" fill="#8b949e" font-size="9" text-anchor="middle">params + headers</text>

  <!-- Request continues to server -->
  <line x1="482" y1="190" x2="618" y2="175" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="5,3"/>

  <!-- Response path -->
  <line x1="618" y1="240" x2="482" y2="228" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="553" y="252" fill="#3fb950" font-size="11" text-anchor="middle">200 OK</text>
  <text x="553" y="265" fill="#8b949e" font-size="9" text-anchor="middle">JSON body</text>

  <line x1="335" y1="228" x2="200" y2="240" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- ===== BOTTOM: Response object ===== -->
  <rect x="240" y="345" width="340" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="410" y="364" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">response = client.get(...)</text>
  <text x="300" y="383" fill="#8b949e" font-size="10" text-anchor="middle">response.status_code</text>
  <text x="410" y="383" fill="#8b949e" font-size="10" text-anchor="middle">response.json()</text>
  <text x="520" y="383" fill="#8b949e" font-size="10" text-anchor="middle">response.headers</text>
  <!-- Arrow from flow to box -->
  <line x1="115" y1="360" x2="238" y2="372" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="705" y1="360" x2="582" y2="372" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
