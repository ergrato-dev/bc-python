<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="sans-serif">
  <!-- Background -->
  <rect width="820" height="440" fill="#0d1117"/>

  <!-- Title -->
  <text x="410" y="32" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Rate Limiting — Token Bucket</text>

  <!-- ===== TOKEN BUCKET ===== -->
  <!-- Bucket shape -->
  <path d="M 280 80 L 260 280 L 380 280 L 360 80 Z" fill="#161b22" stroke="#306998" stroke-width="2"/>
  <text x="320" y="68" fill="#58a6ff" font-size="13" font-weight="bold" text-anchor="middle">Token Bucket</text>

  <!-- Fill level (70% full) -->
  <clipPath id="bucket-clip">
    <path d="M 280 80 L 260 280 L 380 280 L 360 80 Z"/>
  </clipPath>
  <rect x="258" y="154" width="124" height="128" fill="#21262d" clip-path="url(#bucket-clip)"/>

  <!-- Tokens inside bucket -->
  <circle cx="295" cy="175" r="10" fill="#FFD43B"/>
  <circle cx="320" cy="185" r="10" fill="#FFD43B"/>
  <circle cx="345" cy="175" r="10" fill="#FFD43B"/>
  <circle cx="305" cy="210" r="10" fill="#FFD43B"/>
  <circle cx="335" cy="210" r="10" fill="#FFD43B"/>
  <circle cx="315" cy="240" r="10" fill="#FFD43B"/>
  <circle cx="345" cy="240" r="10" fill="#FFD43B"/>
  <text x="320" y="272" fill="#8b949e" font-size="10" text-anchor="middle">7 / 10 tokens</text>

  <!-- ===== REFILL ARROW (top) ===== -->
  <defs>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFD43B"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>

  <!-- Refill from clock -->
  <rect x="130" y="70" width="100" height="50" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="180" y="91" fill="#FFD43B" font-size="11" text-anchor="middle" font-weight="bold">rate = 10/s</text>
  <text x="180" y="107" fill="#8b949e" font-size="9" text-anchor="middle">capacity = 20</text>
  <line x1="230" y1="95" x2="278" y2="100" stroke="#FFD43B" stroke-width="2" marker-end="url(#arr-yellow)"/>
  <text x="252" y="87" fill="#FFD43B" font-size="9" text-anchor="middle">+1 token/100ms</text>

  <!-- ===== REQUEST FLOW ===== -->
  <!-- Incoming requests -->
  <text x="560" y="68" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Solicitudes entrantes</text>

  <!-- Request 1 — token available -->
  <rect x="490" y="80" width="145" height="34" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="562" y="102" fill="#58a6ff" font-size="11" text-anchor="middle">GET /assets  (req 1)</text>
  <line x1="488" y1="97" x2="384" y2="155" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <text x="432" y="118" fill="#3fb950" font-size="10">token disponible →</text>
  <text x="432" y="130" fill="#3fb950" font-size="10">pasar inmediato</text>

  <!-- Request 2 — token available -->
  <rect x="490" y="125" width="145" height="34" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="562" y="147" fill="#58a6ff" font-size="11" text-anchor="middle">GET /projects (req 2)</text>
  <line x1="488" y1="142" x2="384" y2="195" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>

  <!-- Request N — bucket empty -->
  <rect x="490" y="175" width="145" height="34" rx="4" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="562" y="197" fill="#f85149" font-size="11" text-anchor="middle">GET /catalog  (req N)</text>
  <line x1="488" y1="192" x2="384" y2="235" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="432" y="255" fill="#f85149" font-size="10" text-anchor="middle">bucket vacío → sleep</text>

  <!-- ===== OUTPUT FLOW ===== -->
  <!-- Allowed requests -->
  <rect x="490" y="300" width="145" height="34" rx="4" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="562" y="322" fill="#3fb950" font-size="11" text-anchor="middle">200 OK — pasó</text>
  <line x1="320" y1="280" x2="487" y2="315" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)" stroke-dasharray="3,2"/>
  <text x="400" y="308" fill="#3fb950" font-size="9" text-anchor="middle">consume 1 token</text>

  <!-- ===== SLIDING WINDOW COMPARISON ===== -->
  <rect x="50" y="320" width="345" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="222" y="340" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Token Bucket vs Sliding Window</text>

  <!-- Token Bucket column -->
  <text x="130" y="360" fill="#FFD43B" font-size="11" text-anchor="middle">Token Bucket</text>
  <text x="130" y="376" fill="#8b949e" font-size="9" text-anchor="middle">permite ráfagas</text>
  <text x="130" y="389" fill="#8b949e" font-size="9" text-anchor="middle">hasta capacity</text>
  <text x="130" y="402" fill="#8b949e" font-size="9" text-anchor="middle">tokens = créditos acumulados</text>

  <!-- Divider -->
  <line x1="222" y1="353" x2="222" y2="415" stroke="#30363d" stroke-width="1"/>

  <!-- Sliding Window column -->
  <text x="314" y="360" fill="#58a6ff" font-size="11" text-anchor="middle">Sliding Window</text>
  <text x="314" y="376" fill="#8b949e" font-size="9" text-anchor="middle">límite absoluto</text>
  <text x="314" y="389" fill="#8b949e" font-size="9" text-anchor="middle">en ventana temporal</text>
  <text x="314" y="402" fill="#8b949e" font-size="9" text-anchor="middle">más preciso, más memoria</text>

  <!-- ===== 429 + Retry-After ===== -->
  <rect x="530" y="360" width="245" height="65" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="652" y="378" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">429 Too Many Requests</text>
  <text x="652" y="396" fill="#8b949e" font-size="10" text-anchor="middle">Retry-After: 30</text>
  <text x="652" y="412" fill="#8b949e" font-size="10" text-anchor="middle">X-RateLimit-Remaining: 0</text>
  <text x="652" y="428" fill="#FFD43B" font-size="9" text-anchor="middle">→ esperar exactamente ese tiempo</text>
</svg>
