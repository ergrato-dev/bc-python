<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="sans-serif">
  <!-- Background -->
  <rect width="820" height="460" fill="#0d1117"/>

  <!-- Title -->
  <text x="410" y="32" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Retry con Backoff Exponencial + Jitter</text>

  <!-- ===== TIMELINE ===== -->
  <!-- X axis -->
  <line x1="60" y1="200" x2="760" y2="200" stroke="#30363d" stroke-width="1.5"/>
  <text x="760" y="215" fill="#8b949e" font-size="11">t(s)</text>

  <!-- Y axis label -->
  <text x="25" y="145" fill="#8b949e" font-size="10" text-anchor="middle" transform="rotate(-90,25,145)">llamadas</text>

  <!-- ===== WITHOUT JITTER (top half) ===== -->
  <text x="60" y="70" fill="#f85149" font-size="12" font-weight="bold">Sin jitter — Thundering Herd</text>

  <!-- Client A, B, C markers at t=0 (fail) -->
  <circle cx="100" cy="120" r="6" fill="#f85149"/>
  <circle cx="100" cy="135" r="6" fill="#f85149"/>
  <circle cx="100" cy="150" r="6" fill="#f85149"/>
  <text x="100" y="175" fill="#8b949e" font-size="9" text-anchor="middle">0s</text>
  <text x="100" y="186" fill="#f85149" font-size="9" text-anchor="middle">FAIL</text>

  <!-- Wait 1s → all retry at t=1 -->
  <line x1="100" y1="135" x2="190" y2="135" stroke="#f85149" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="190" cy="120" r="6" fill="#f85149"/>
  <circle cx="190" cy="135" r="6" fill="#f85149"/>
  <circle cx="190" cy="150" r="6" fill="#f85149"/>
  <text x="190" y="175" fill="#8b949e" font-size="9" text-anchor="middle">1s</text>
  <text x="190" y="186" fill="#f85149" font-size="9" text-anchor="middle">FAIL×3</text>

  <!-- Wait 2s → all retry at t=3 -->
  <line x1="190" y1="135" x2="370" y2="135" stroke="#f85149" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="370" cy="120" r="6" fill="#f85149"/>
  <circle cx="370" cy="135" r="6" fill="#f85149"/>
  <circle cx="370" cy="150" r="6" fill="#f85149"/>
  <text x="370" y="175" fill="#8b949e" font-size="9" text-anchor="middle">3s</text>
  <text x="370" y="186" fill="#f85149" font-size="9" text-anchor="middle">FAIL×3</text>

  <!-- Wait 4s → all retry at t=7 -->
  <line x1="370" y1="135" x2="640" y2="135" stroke="#f85149" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="640" cy="120" r="6" fill="#f85149"/>
  <circle cx="640" cy="135" r="6" fill="#f85149"/>
  <circle cx="640" cy="150" r="6" fill="#f85149"/>
  <text x="640" y="175" fill="#8b949e" font-size="9" text-anchor="middle">7s</text>
  <text x="640" y="186" fill="#f85149" font-size="9" text-anchor="middle">pico×3</text>

  <!-- "spike" annotation -->
  <rect x="620" y="95" width="40" height="85" rx="2" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="678" y="118" fill="#f85149" font-size="9">spike!</text>
  <text x="678" y="130" fill="#8b949e" font-size="9">servidor</text>
  <text x="678" y="142" fill="#8b949e" font-size="9">saturado</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="60" y1="210" x2="760" y2="210" stroke="#21262d" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- ===== WITH JITTER (bottom half) ===== -->
  <text x="60" y="248" fill="#3fb950" font-size="12" font-weight="bold">Con jitter — Distribución uniforme</text>

  <!-- Attempt 1 — all at t=0 (fail) -->
  <circle cx="100" cy="290" r="6" fill="#f85149"/>
  <circle cx="100" cy="305" r="6" fill="#f85149"/>
  <circle cx="100" cy="320" r="6" fill="#f85149"/>
  <text x="100" y="345" fill="#8b949e" font-size="9" text-anchor="middle">0s</text>
  <text x="100" y="356" fill="#f85149" font-size="9" text-anchor="middle">FAIL</text>

  <!-- With jitter: clients retry at different times ~[0.6s, 1.0s, 1.4s] -->
  <line x1="100" y1="290" x2="155" y2="290" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="155" cy="290" r="6" fill="#3fb950"/>
  <text x="155" y="345" fill="#8b949e" font-size="9" text-anchor="middle">~0.7s</text>

  <line x1="100" y1="305" x2="190" y2="305" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="190" cy="305" r="6" fill="#3fb950"/>
  <text x="190" y="356" fill="#8b949e" font-size="9" text-anchor="middle">~1.0s</text>

  <line x1="100" y1="320" x2="230" y2="320" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="230" cy="320" r="6" fill="#3fb950"/>
  <text x="230" y="345" fill="#8b949e" font-size="9" text-anchor="middle">~1.3s</text>

  <!-- Attempt 2 with jitter: ~[2.5s, 3.2s, 4.1s] from t=0 -->
  <line x1="155" y1="290" x2="330" y2="290" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="330" cy="290" r="6" fill="#3fb950"/>
  <text x="330" y="345" fill="#8b949e" font-size="9" text-anchor="middle">~2.5s</text>

  <line x1="190" y1="305" x2="400" y2="305" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="400" cy="305" r="6" fill="#3fb950"/>
  <text x="400" y="356" fill="#8b949e" font-size="9" text-anchor="middle">~3.2s</text>

  <line x1="230" y1="320" x2="480" y2="320" stroke="#3fb950" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="480" cy="320" r="6" fill="#3fb950"/>
  <text x="480" y="345" fill="#8b949e" font-size="9" text-anchor="middle">~4.1s</text>

  <!-- "distributed" annotation -->
  <text x="390" y="375" fill="#3fb950" font-size="10" text-anchor="middle">carga distribuida — servidor no se satura</text>

  <!-- ===== LEGEND / FORMULA ===== -->
  <rect x="510" y="255" width="265" height="115" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="642" y="274" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">wait_random_exponential</text>
  <text x="530" y="295" fill="#8b949e" font-size="10">Intento 1 →</text>
  <text x="620" y="295" fill="#FFD43B" font-size="10">~0.5 – 1.5 s</text>
  <text x="530" y="312" fill="#8b949e" font-size="10">Intento 2 →</text>
  <text x="620" y="312" fill="#FFD43B" font-size="10">~1 – 3 s</text>
  <text x="530" y="329" fill="#8b949e" font-size="10">Intento 3 →</text>
  <text x="620" y="329" fill="#FFD43B" font-size="10">~2 – 6 s</text>
  <text x="530" y="346" fill="#8b949e" font-size="10">Intento 4 →</text>
  <text x="620" y="346" fill="#FFD43B" font-size="10">~4 – 12 s</text>
  <text x="642" y="363" fill="#306998" font-size="9" text-anchor="middle">base=2, jitter=±50%, max=30</text>

  <!-- ===== LEGEND CIRCLES ===== -->
  <circle cx="80" cy="418" r="6" fill="#f85149"/>
  <text x="93" y="422" fill="#f85149" font-size="11">Fallo (no reintentar — sin jitter)</text>
  <circle cx="340" cy="418" r="6" fill="#3fb950"/>
  <text x="353" y="422" fill="#3fb950" font-size="11">Intento con jitter</text>
</svg>
