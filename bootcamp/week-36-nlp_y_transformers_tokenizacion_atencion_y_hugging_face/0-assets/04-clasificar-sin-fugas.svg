<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Clasificar notas sin fugas</title>
  <desc id="d">Las notas se reparten por tipo en entrenamiento, validación y prueba; el tokenizador, TF-IDF y el Transformer aprenden solo de entrenamiento, la validación decide cuándo parar y la prueba solo se usa para el acierto final</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86efac"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fcd34d"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fca5a5"/></marker></defs>
  <rect width="900" height="360" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="36" text-anchor="middle" font-size="17" fill="#e2e8f0" font-weight="700">clasificar: el reparto antes que nada, y el tokenizador solo con entrenamiento</text>
    <text x="450" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Al azar pero por tipo (stratify): las tres partes tienen la misma proporción de averías, limpiezas y calibraciones</text>
    <rect x="30" y="130" width="150" height="60" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="105" y="156" text-anchor="middle" font-size="15" fill="#e2e8f0">notas.csv</text>
    <text x="105" y="176" text-anchor="middle" font-size="12" fill="#94a3b8">300 notas</text>
    <line x1="182" y1="160" x2="236" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="240" y="100" width="170" height="50" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="325" y="122" text-anchor="middle" font-size="14" fill="#86efac">entrenamiento</text>
    <text x="325" y="140" text-anchor="middle" font-size="12" fill="#94a3b8">180 · 60 %</text>
    <rect x="240" y="170" width="170" height="50" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="325" y="192" text-anchor="middle" font-size="14" fill="#fcd34d">validación</text>
    <text x="325" y="210" text-anchor="middle" font-size="12" fill="#94a3b8">60 · 20 %</text>
    <rect x="240" y="240" width="170" height="50" rx="6" fill="#1e293b" stroke="#fca5a5"/>
    <text x="325" y="262" text-anchor="middle" font-size="14" fill="#fca5a5">prueba</text>
    <text x="325" y="280" text-anchor="middle" font-size="12" fill="#94a3b8">60 · 20 %</text>
    <line x1="412" y1="105" x2="472" y2="105" stroke="#86efac" stroke-width="2" marker-end="url(#g)"/>
    <rect x="476" y="80" width="200" height="50" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="576" y="102" text-anchor="middle" font-size="14" fill="#e2e8f0">tokenizador BPE</text>
    <text x="576" y="120" text-anchor="middle" font-size="12" fill="#94a3b8">aprende sus piezas aquí</text>
    <line x1="412" y1="130" x2="472" y2="180" stroke="#86efac" stroke-width="2" marker-end="url(#g)"/>
    <rect x="476" y="158" width="200" height="50" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="576" y="180" text-anchor="middle" font-size="14" fill="#e2e8f0">TF-IDF + logística</text>
    <text x="576" y="198" text-anchor="middle" font-size="12" fill="#94a3b8">y el Transformer</text>
    <line x1="412" y1="190" x2="472" y2="230" stroke="#fcd34d" stroke-width="2" marker-end="url(#y)"/>
    <rect x="476" y="226" width="200" height="40" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="576" y="251" text-anchor="middle" font-size="13" fill="#fcd34d">¿cuándo parar? (paciencia)</text>
    <line x1="412" y1="266" x2="714" y2="266" stroke="#fca5a5" stroke-width="2" marker-end="url(#r)"/>
    <line x1="678" y1="183" x2="714" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="718" y="210" width="160" height="76" rx="6" fill="#1e293b" stroke="#fca5a5"/>
    <text x="798" y="236" text-anchor="middle" font-size="14" fill="#fca5a5">acierto en prueba</text>
    <text x="798" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">referencia · tf-idf</text>
    <text x="798" y="274" text-anchor="middle" font-size="12" fill="#94a3b8">· transformer</text>
    <text x="450" y="330" text-anchor="middle" font-size="12" fill="#94a3b8">Si el tokenizador o TF-IDF vieran la prueba, sus palabras raras ya serían piezas conocidas: un acierto que no tendrás con notas nuevas</text>
  </g>
</svg>
