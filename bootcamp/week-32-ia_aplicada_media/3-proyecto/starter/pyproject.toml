[project]
name = "studio-ai-tagger"
version = "0.1.0"
description = "Módulo de IA para generación automática de metadata audiovisual"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.30",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "pytest-mock"]

[tool.mypy]
strict = true
