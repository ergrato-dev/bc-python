<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d">
  <title id="t">Qué gráfico para qué pregunta</title>
  <desc id="d">Seis tarjetas, cada una con una pregunta y el gráfico que la responde. Cómo cambia con el tiempo: una línea. Qué grupo es mayor: barras que empiezan en cero. Cómo se reparten los valores: un histograma o una caja. Qué relación hay entre dos variables: puntos. Muchos grupos a la vez: un panel por grupo con la misma escala. Una cantidad en dos dimensiones: un mapa de calor con una paleta secuencial.</desc>
