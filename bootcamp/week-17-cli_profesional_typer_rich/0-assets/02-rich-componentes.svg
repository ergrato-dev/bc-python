<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <rect width="860" height="480" fill="#0d1117"/>
  <text x="430" y="36" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Rich — Mapa de Componentes</text>

  <!-- Console (center hub) -->
  <rect x="320" y="60" width="220" height="52" rx="8" fill="#163356" stroke="#306998" stroke-width="2"/>
  <text x="430" y="82" fill="#FFD43B" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Console</text>
  <text x="430" y="100" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">console.print( renderable )</text>

  <!-- Arrows from Console to renderables -->
  <line x1="320" y1="85"  x2="220" y2="160" stroke="#30363d" stroke-width="1.5"/>
  <line x1="355" y1="112" x2="320" y2="164" stroke="#30363d" stroke-width="1.5"/>
  <line x1="430" y1="112" x2="430" y2="164" stroke="#30363d" stroke-width="1.5"/>
  <line x1="505" y1="112" x2="540" y2="164" stroke="#30363d" stroke-width="1.5"/>
  <line x1="540" y1="85"  x2="640" y2="160" stroke="#30363d" stroke-width="1.5"/>

  <!-- Static / Text -->
  <rect x="120" y="160" width="140" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="190" y="180" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Text / Markup</text>
  <text x="190" y="197" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">"[bold]text[/bold]"</text>
  <text x="190" y="212" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">Text("...", style="red")</text>

  <!-- Panel -->
  <rect x="270" y="164" width="110" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="325" y="184" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Panel</text>
  <text x="325" y="200" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">border + title</text>

  <!-- Table -->
  <rect x="378" y="164" width="100" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="428" y="184" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Table</text>
  <text x="428" y="200" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">rows + columns</text>

  <!-- Syntax -->
  <rect x="490" y="164" width="100" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="540" y="184" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Syntax</text>
  <text x="540" y="200" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">code highlight</text>

  <!-- Markdown -->
  <rect x="600" y="160" width="120" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="660" y="180" fill="#3fb950" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Markdown</text>
  <text x="660" y="197" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">headers, lists</text>
  <text x="660" y="212" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">tables, code</text>

  <!-- Divider -->
  <line x1="60" y1="240" x2="800" y2="240" stroke="#30363d" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="430" y="235" fill="#555" font-family="sans-serif" font-size="10" text-anchor="middle">actualización dinámica (requieren context manager)</text>

  <!-- Live / Progress section -->
  <!-- Progress -->
  <rect x="80" y="260" width="200" height="70" rx="6" fill="#2d1f00" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="180" y="280" fill="#FFD43B" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Progress</text>
  <text x="180" y="298" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">with Progress() as p:</text>
  <text x="180" y="314" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">task = p.add_task(...)</text>
  <text x="180" y="330" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">p.advance(task)</text>

  <!-- track() -->
  <rect x="300" y="260" width="130" height="70" rx="6" fill="#1e2820" stroke="#3fb950" stroke-width="1.5"/>
  <text x="365" y="280" fill="#3fb950" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">track()</text>
  <text x="365" y="298" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">shortcut de</text>
  <text x="365" y="314" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">Progress para</text>
  <text x="365" y="330" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">bucles simples</text>

  <!-- Live -->
  <rect x="450" y="260" width="140" height="70" rx="6" fill="#1a1a2e" stroke="#306998" stroke-width="1.5"/>
  <text x="520" y="280" fill="#306998" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Live</text>
  <text x="520" y="298" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">with Live(table) as live:</text>
  <text x="520" y="314" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">live.update(new_table)</text>
  <text x="520" y="330" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">refresh_per_second=4</text>

  <!-- Layout -->
  <rect x="610" y="260" width="160" height="70" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="690" y="280" fill="#e6edf3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Layout</text>
  <text x="690" y="298" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">split_row / split_column</text>
  <text x="690" y="314" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">layout["left"].update(...)</text>
  <text x="690" y="330" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">dashboard estático</text>

  <!-- Use case block -->
  <rect x="60" y="358" width="740" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="378" fill="#8b949e" font-family="sans-serif" font-size="11" font-weight="bold">Cuándo usar cada uno:</text>

  <rect x="80"  y="390" width="140" height="52" rx="4" fill="#0d1117" stroke="#3fb950" stroke-width="1"/>
  <text x="150" y="406" fill="#3fb950" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Table + Panel</text>
  <text x="150" y="422" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Datos estáticos,</text>
  <text x="150" y="436" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">resultado de un comando</text>

  <rect x="238" y="390" width="140" height="52" rx="4" fill="#0d1117" stroke="#FFD43B" stroke-width="1"/>
  <text x="308" y="406" fill="#FFD43B" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Progress / track</text>
  <text x="308" y="422" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Operaciones largas</text>
  <text x="308" y="436" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">con total conocido</text>

  <rect x="396" y="390" width="140" height="52" rx="4" fill="#0d1117" stroke="#306998" stroke-width="1"/>
  <text x="466" y="406" fill="#306998" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Live</text>
  <text x="466" y="422" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Estado que cambia</text>
  <text x="466" y="436" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">sin scroll (pipeline)</text>

  <rect x="554" y="390" width="220" height="52" rx="4" fill="#0d1117" stroke="#8b949e" stroke-width="1"/>
  <text x="664" y="406" fill="#e6edf3" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Live + Layout</text>
  <text x="664" y="422" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">Dashboard multi-panel</text>
  <text x="664" y="436" fill="#8b949e" font-family="sans-serif" font-size="9" text-anchor="middle">múltiples datos dinámicos</text>
</svg>
