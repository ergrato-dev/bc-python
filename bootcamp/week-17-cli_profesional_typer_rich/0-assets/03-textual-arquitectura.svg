<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
  <rect width="860" height="480" fill="#0d1117"/>
  <text x="430" y="36" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Textual — Arquitectura de una App</text>

  <!-- ── LEFT: App lifecycle ── -->
  <text x="155" y="70" fill="#306998" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Ciclo de vida</text>

  <rect x="60" y="84" width="190" height="36" rx="6" fill="#163356" stroke="#306998" stroke-width="1.5"/>
  <text x="155" y="106" fill="#FFD43B" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">App.run()</text>

  <line x1="155" y1="120" x2="155" y2="148" stroke="#306998" stroke-width="1.5"/>
  <polygon points="155,148 150,138 160,138" fill="#306998"/>

  <rect x="60" y="148" width="190" height="36" rx="6" fill="#161b22" stroke="#306998" stroke-width="1.5"/>
  <text x="155" y="170" fill="#e6edf3" font-family="sans-serif" font-size="11" text-anchor="middle">compose() → widget tree</text>

  <line x1="155" y1="184" x2="155" y2="212" stroke="#306998" stroke-width="1.5"/>
  <polygon points="155,212 150,202 160,202" fill="#306998"/>

  <rect x="60" y="212" width="190" height="36" rx="6" fill="#161b22" stroke="#306998" stroke-width="1.5"/>
  <text x="155" y="234" fill="#e6edf3" font-family="sans-serif" font-size="11" text-anchor="middle">on_mount() → init state</text>

  <line x1="155" y1="248" x2="155" y2="276" stroke="#306998" stroke-width="1.5"/>
  <polygon points="155,276 150,266 160,266" fill="#306998"/>

  <rect x="60" y="276" width="190" height="36" rx="6" fill="#161b22" stroke="#306998" stroke-width="1.5"/>
  <text x="155" y="298" fill="#e6edf3" font-family="sans-serif" font-size="11" text-anchor="middle">event loop (asyncio)</text>

  <line x1="155" y1="312" x2="155" y2="340" stroke="#306998" stroke-width="1.5"/>
  <polygon points="155,340 150,330 160,330" fill="#306998"/>

  <rect x="60" y="340" width="190" height="36" rx="6" fill="#2d1f00" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="155" y="362" fill="#FFD43B" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">user event → handler</text>

  <line x1="155" y1="376" x2="155" y2="404" stroke="#306998" stroke-width="1.5"/>
  <polygon points="155,404 150,394 160,394" fill="#306998"/>

  <rect x="60" y="404" width="190" height="36" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="155" y="426" fill="#3fb950" font-family="sans-serif" font-size="11" text-anchor="middle">reactive → watch_* → re-render</text>

  <!-- ── CENTER divider ── -->
  <line x1="290" y1="60" x2="290" y2="460" stroke="#30363d" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- ── RIGHT: Widget tree ── -->
  <text x="575" y="70" fill="#FFD43B" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Árbol de Widgets</text>

  <!-- App root -->
  <rect x="460" y="84" width="230" height="36" rx="8" fill="#163356" stroke="#FFD43B" stroke-width="2"/>
  <text x="575" y="106" fill="#FFD43B" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">StudioApp(App)</text>

  <!-- Header + Footer branches -->
  <line x1="520" y1="120" x2="460" y2="160" stroke="#30363d" stroke-width="1.2"/>
  <line x1="575" y1="120" x2="575" y2="160" stroke="#30363d" stroke-width="1.2"/>
  <line x1="630" y1="120" x2="690" y2="160" stroke="#30363d" stroke-width="1.2"/>

  <rect x="400" y="160" width="100" height="32" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
  <text x="450" y="180" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Header</text>

  <!-- Horizontal container -->
  <rect x="510" y="160" width="130" height="32" rx="6" fill="#1c2030" stroke="#306998" stroke-width="1.5"/>
  <text x="575" y="180" fill="#306998" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Horizontal</text>

  <rect x="642" y="160" width="100" height="32" rx="6" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
  <text x="692" y="180" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Footer</text>

  <!-- Horizontal children -->
  <line x1="545" y1="192" x2="510" y2="234" stroke="#30363d" stroke-width="1.2"/>
  <line x1="605" y1="192" x2="640" y2="234" stroke="#30363d" stroke-width="1.2"/>

  <rect x="430" y="234" width="130" height="32" rx="6" fill="#1c2030" stroke="#306998" stroke-width="1.2"/>
  <text x="495" y="254" fill="#306998" font-family="sans-serif" font-size="11" text-anchor="middle">Vertical #sidebar</text>

  <rect x="570" y="234" width="130" height="32" rx="6" fill="#1c2030" stroke="#306998" stroke-width="1.2"/>
  <text x="635" y="254" fill="#306998" font-family="sans-serif" font-size="11" text-anchor="middle">Vertical #main</text>

  <!-- Sidebar children -->
  <line x1="464" y1="266" x2="444" y2="298" stroke="#30363d" stroke-width="1.2"/>
  <line x1="526" y1="266" x2="546" y2="298" stroke="#30363d" stroke-width="1.2"/>

  <rect x="390" y="298" width="96" height="30" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
  <text x="438" y="317" fill="#3fb950" font-family="sans-serif" font-size="10" text-anchor="middle">Label</text>

  <rect x="492" y="298" width="96" height="30" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
  <text x="540" y="317" fill="#3fb950" font-family="sans-serif" font-size="10" text-anchor="middle">ListView</text>

  <!-- Main children -->
  <line x1="605" y1="266" x2="585" y2="298" stroke="#30363d" stroke-width="1.2"/>
  <line x1="665" y1="266" x2="685" y2="298" stroke="#30363d" stroke-width="1.2"/>

  <rect x="548" y="298" width="90" height="30" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
  <text x="593" y="317" fill="#3fb950" font-family="sans-serif" font-size="10" text-anchor="middle">Input</text>

  <rect x="644" y="298" width="90" height="30" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
  <text x="689" y="317" fill="#3fb950" font-family="sans-serif" font-size="10" text-anchor="middle">DataTable</text>

  <!-- Events + reactive note -->
  <rect x="390" y="360" width="400" height="80" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="590" y="380" fill="#8b949e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Eventos y Reactividad</text>
  <text x="590" y="400" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">on_button_pressed() · on_input_submitted() · BINDINGS</text>
  <text x="590" y="418" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">reactive[int] → watch_count() se llama al cambiar</text>
  <text x="590" y="436" fill="#555" font-family="sans-serif" font-size="10" text-anchor="middle">query_one("#id", Widget) para acceder a widgets</text>
</svg>
