[project]
name = "bc-studio-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.60",
]

[project.scripts]
bc-studio-cli = "src.main:app"

[tool.mypy]
strict = true
python_version = "3.13"

[tool.uv]
dev-dependencies = [
    "mypy>=1.11",
    "pytest>=8.0",
]
