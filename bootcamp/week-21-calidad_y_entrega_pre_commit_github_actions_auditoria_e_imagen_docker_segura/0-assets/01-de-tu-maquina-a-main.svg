<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d">
  <title id="t">De tu máquina a main</title>
  <desc id="d">Tres lugares donde se comprueba el código, de izquierda a derecha. En tu máquina, mientras trabajas, ejecutas uv run pytest cuando quieres. Al hacer git commit, pre-commit ejecuta ruff, mypy y la comprobación de uv.lock sobre los archivos del commit, en segundos, y se puede saltar con --no-verify. Al hacer git push, GitHub Actions ejecuta en una máquina limpia tres jobs a la vez: quality con pre-commit sobre todos los archivos y uv audit; tests con PostgreSQL, cobertura y alembic check; e image, que construye la imagen runtime y la escanea con Trivy. Tarda minutos y nadie se la salta. Su resultado aparece en el pull request, que solo se fusiona en main con todo en verde. Las versiones de las herramientas son las de uv.lock en los tres sitios.</desc>
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="860" height="470" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700">Tres redes para el mismo código: cada una más lenta y más completa</text>

    <rect x="24" y="64" width="146" height="200" rx="8" fill="#1e293b" stroke="#94a3b8"/>
    <text x="97" y="90" text-anchor="middle" font-weight="700">Tu máquina</text>
    <text x="40" y="118" font-size="12" fill="#cbd5e1">editas y pruebas</text>
    <text x="40" y="138" font-size="12" fill="#cbd5e1">cuando quieres:</text>
    <text x="40" y="162" font-size="12" fill="#fcd34d">uv run pytest</text>
    <text x="40" y="182" font-size="12" fill="#fcd34d">uv run mypy</text>
    <text x="40" y="226" font-size="12" fill="#94a3b8">nadie te obliga</text>

    <line x1="170" y1="164" x2="214" y2="164" stroke="#94a3b8" stroke-width="2" marker-end="url(#grey)"/>
    <text x="192" y="152" text-anchor="middle" font-size="11" fill="#94a3b8">commit</text>

    <rect x="218" y="64" width="170" height="200" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="303" y="90" text-anchor="middle" font-weight="700" fill="#86efac">El gancho</text>
    <text x="234" y="118" font-size="12" fill="#cbd5e1">pre-commit, antes de</text>
    <text x="234" y="138" font-size="12" fill="#cbd5e1">cada git commit:</text>
    <text x="234" y="162" font-size="12" fill="#fcd34d">ruff · mypy · uv.lock</text>
    <text x="234" y="186" font-size="12" fill="#cbd5e1">los archivos del commit</text>
    <text x="234" y="206" font-size="12" fill="#cbd5e1">segundos</text>
    <text x="234" y="226" font-size="12" fill="#94a3b8">se salta: --no-verify</text>

    <line x1="388" y1="164" x2="428" y2="164" stroke="#94a3b8" stroke-width="2" marker-end="url(#grey)"/>
    <text x="408" y="152" text-anchor="middle" font-size="11" fill="#94a3b8">push</text>

    <rect x="432" y="64" width="250" height="300" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="557" y="90" text-anchor="middle" font-weight="700" fill="#7dd3fc">La CI: GitHub Actions</text>
    <text x="557" y="110" text-anchor="middle" font-size="12" fill="#cbd5e1">una máquina limpia, tres jobs a la vez</text>

    <rect x="448" y="124" width="218" height="58" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="460" y="146" font-size="13" font-weight="700">quality</text>
    <text x="460" y="168" font-size="12" fill="#fcd34d">pre-commit --all-files · uv audit</text>

    <rect x="448" y="192" width="218" height="58" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="460" y="214" font-size="13" font-weight="700">tests</text>
    <text x="460" y="236" font-size="12" fill="#fcd34d">PostgreSQL · coverage · alembic</text>

    <rect x="448" y="260" width="218" height="58" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="460" y="282" font-size="13" font-weight="700">image</text>
    <text x="460" y="304" font-size="12" fill="#fcd34d">build runtime · Trivy</text>

    <text x="448" y="344" font-size="12" fill="#cbd5e1">minutos · todos los archivos · no se salta</text>

    <line x1="682" y1="164" x2="708" y2="164" stroke="#94a3b8" stroke-width="2" marker-end="url(#grey)"/>

    <rect x="712" y="64" width="136" height="200" rx="8" fill="#422006" stroke="#fbbf24"/>
    <text x="780" y="90" text-anchor="middle" font-weight="700" fill="#fcd34d">Pull request</text>
    <text x="724" y="122" font-size="12" fill="#cbd5e1">las comprobaciones,</text>
    <text x="724" y="142" font-size="12" fill="#cbd5e1">en verde o en rojo</text>
    <text x="724" y="178" font-size="12" fill="#86efac">todo verde:</text>
    <text x="724" y="198" font-size="12" fill="#86efac">merge a main</text>
    <text x="724" y="234" font-size="12" fill="#fca5a5">algo rojo: arreglas</text>

    <line x1="24" y1="400" x2="836" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#grey)"/>
    <text x="24" y="390" font-size="12" fill="#94a3b8">más rápido, menos completo</text>
    <text x="836" y="390" text-anchor="end" font-size="12" fill="#94a3b8">más lento, más completo</text>

    <rect x="24" y="420" width="812" height="34" rx="6" fill="#2e1065" stroke="#a78bfa"/>
    <text x="430" y="442" text-anchor="middle" font-size="13" fill="#ddd6fe">En los tres sitios, las mismas herramientas con las mismas versiones: las de uv.lock (uv run --locked)</text>
  </g>
</svg>
