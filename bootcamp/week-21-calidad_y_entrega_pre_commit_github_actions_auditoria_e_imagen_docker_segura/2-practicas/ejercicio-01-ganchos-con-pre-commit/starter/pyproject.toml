[project]
name = "ganchos-con-pre-commit"
version = "0.1.0"
description = "Ejercicio 01 de la semana 21: ganchos de Git con pre-commit"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["mypy==2.4.1", "pre-commit==4.7.0", "ruff==0.17.3"]

[tool.uv]
# Es un ejercicio, no un paquete instalable: uv solo crea el entorno.
package = false

[tool.mypy]
files = ["main.py"]
strict = true
