<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="t d">
  <title id="t">Índices y slicing del texto Python</title>
  <desc id="d">El texto Python tiene seis caracteres. Los índices positivos van de 0 a 5 de izquierda a derecha y los negativos de -6 a -1. Los índices de slicing marcan los bordes entre caracteres: s[1:4] toma y, t, h; s[:2] toma P, y; s[-3:] toma h, o, n. El fin del slice no se incluye.</desc>
  <rect width="820" height="330" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="60" y="44" font-size="13" fill="#94a3b8">s = "Python"</text>
    <text x="120" y="88" text-anchor="end" font-size="13" fill="#38bdf8">índice</text>
    <text x="120" y="182" text-anchor="end" font-size="13" fill="#facc15">negativo</text>
    <g text-anchor="middle">
      <g fill="#38bdf8"><text x="190" y="88">0</text><text x="280" y="88">1</text><text x="370" y="88">2</text><text x="460" y="88">3</text><text x="550" y="88">4</text><text x="640" y="88">5</text></g>
      <g fill="#1e293b" stroke="#64748b">
        <rect x="145" y="100" width="90" height="56"/><rect x="235" y="100" width="90" height="56"/><rect x="325" y="100" width="90" height="56"/>
        <rect x="415" y="100" width="90" height="56"/><rect x="505" y="100" width="90" height="56"/><rect x="595" y="100" width="90" height="56"/>
      </g>
      <g font-size="22" font-weight="700"><text x="190" y="136">P</text><text x="280" y="136">y</text><text x="370" y="136">t</text><text x="460" y="136">h</text><text x="550" y="136">o</text><text x="640" y="136">n</text></g>
      <g fill="#facc15"><text x="190" y="182">-6</text><text x="280" y="182">-5</text><text x="370" y="182">-4</text><text x="460" y="182">-3</text><text x="550" y="182">-2</text><text x="640" y="182">-1</text></g>
    </g>
    <g stroke-width="6" stroke-linecap="round">
      <path d="M240 212H500" stroke="#a78bfa"/>
      <path d="M150 248H320" stroke="#4ade80"/>
      <path d="M420 284H680" stroke="#f87171"/>
    </g>
    <g font-size="13">
      <text x="700" y="217" fill="#a78bfa">s[1:4] → "yth"</text>
      <text x="700" y="253" fill="#4ade80">s[:2] → "Py"</text>
      <text x="700" y="289" fill="#f87171">s[-3:] → "hon"</text>
    </g>
    <text x="60" y="318" font-size="13" fill="#94a3b8">s[inicio:fin]: inicio se incluye, fin no. Un slice fuera de rango da "" sin error; un índice fuera de rango da IndexError.</text>
  </g>
</svg>
