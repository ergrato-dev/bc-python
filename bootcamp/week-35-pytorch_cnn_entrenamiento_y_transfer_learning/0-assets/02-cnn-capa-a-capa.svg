    <text x="500" y="346" text-anchor="middle" font-size="13" fill="#94a3b8">Cada Conv2d mira vecindades de 3 × 3 de todos los canales; cada MaxPool2d se queda con el máximo de cada 2 × 2</text>
    <text x="500" y="368" text-anchor="middle" font-size="13" fill="#94a3b8">1898 parámetros: menos que el MLP de 64 → 32 → 10 (2410), y los mismos filtros en toda la imagen</text>
