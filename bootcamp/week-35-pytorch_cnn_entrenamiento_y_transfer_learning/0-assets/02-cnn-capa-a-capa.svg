<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="t d">
  <title id="t">Una CNN capa a capa</title>
  <desc id="d">Un dígito de 1 por 8 por 8 pasa por Conv2d, MaxPool2d, otra Conv2d, otro MaxPool2d, Flatten y Linear hasta 10 puntuaciones, con la forma y los parámetros de cada capa.</desc>
