<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">Un filtro que se desliza</title>
  <desc id="d">Una serie de diez valores, un filtro de tres pesos de un tercio que se desliza sobre ella, y las ocho medias que salen.</desc>
  <defs><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fcd34d"/></marker></defs>
  <rect width="900" height="380" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="36" text-anchor="middle" font-size="17" fill="#e2e8f0" font-weight="700">Un filtro que se desliza: conv1d con [1/3, 1/3, 1/3]</text>
    <text x="450" y="60" text-anchor="middle" font-size="12" fill="#94a3b8">Cada salida es la suma de tres valores seguidos por los tres pesos del filtro</text>
    <text x="110" y="118" text-anchor="end" font-size="13" fill="#94a3b8">serie</text>
    <rect x="130" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="158" y="118" text-anchor="middle" font-size="15" fill="#e2e8f0">12</text>
    <rect x="194" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="222" y="118" text-anchor="middle" font-size="15" fill="#e2e8f0">11</text>
    <rect x="258" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="286" y="118" text-anchor="middle" font-size="15" fill="#e2e8f0">10</text>
    <rect x="322" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="350" y="118" text-anchor="middle" font-size="15" fill="#e2e8f0">10</text>
    <rect x="386" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="414" y="118" text-anchor="middle" font-size="15" fill="#fcd34d">11</text>
    <rect x="450" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="478" y="118" text-anchor="middle" font-size="15" fill="#fcd34d">14</text>
    <rect x="514" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="542" y="118" text-anchor="middle" font-size="15" fill="#fcd34d">22</text>
    <rect x="578" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="606" y="118" text-anchor="middle" font-size="15" fill="#e2e8f0">35</text>
    <rect x="642" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="670" y="118" text-anchor="middle" font-size="15" fill="#e2e8f0">41</text>
    <rect x="706" y="92" width="56" height="40" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="734" y="118" text-anchor="middle" font-size="15" fill="#e2e8f0">33</text>
    <text x="110" y="188" text-anchor="end" font-size="13" fill="#94a3b8">filtro</text>
    <rect x="386" y="162" width="56" height="40" rx="6" fill="#1e293b" stroke="#fcd34d" stroke-dasharray="5 4"/>
    <text x="414" y="188" text-anchor="middle" font-size="14" fill="#fcd34d">1/3</text>
    <rect x="450" y="162" width="56" height="40" rx="6" fill="#1e293b" stroke="#fcd34d" stroke-dasharray="5 4"/>
    <text x="478" y="188" text-anchor="middle" font-size="14" fill="#fcd34d">1/3</text>
    <rect x="514" y="162" width="56" height="40" rx="6" fill="#1e293b" stroke="#fcd34d" stroke-dasharray="5 4"/>
    <text x="542" y="188" text-anchor="middle" font-size="14" fill="#fcd34d">1/3</text>
    <text x="586" y="188" text-anchor="start" font-size="12" fill="#94a3b8">→ se mueve un paso</text>
    <line x1="478" y1="206" x2="478" y2="246" stroke="#fcd34d" stroke-width="2" marker-end="url(#y)"/>
    <text x="110" y="278" text-anchor="end" font-size="13" fill="#94a3b8">salida</text>
    <rect x="194" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="222" y="278" text-anchor="middle" font-size="14" fill="#e2e8f0">11,0</text>
    <rect x="258" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="286" y="278" text-anchor="middle" font-size="14" fill="#e2e8f0">10,3</text>
    <rect x="322" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="350" y="278" text-anchor="middle" font-size="14" fill="#e2e8f0">10,3</text>
    <rect x="386" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="414" y="278" text-anchor="middle" font-size="14" fill="#e2e8f0">11,7</text>
    <rect x="450" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="478" y="278" text-anchor="middle" font-size="14" fill="#fcd34d">15,7</text>
    <rect x="514" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="542" y="278" text-anchor="middle" font-size="14" fill="#e2e8f0">23,7</text>
    <rect x="578" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="606" y="278" text-anchor="middle" font-size="14" fill="#e2e8f0">32,7</text>
    <rect x="642" y="252" width="56" height="40" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="670" y="278" text-anchor="middle" font-size="14" fill="#e2e8f0">36,3</text>
    <text x="450" y="326" text-anchor="middle" font-size="13" fill="#94a3b8">(11 + 14 + 22) / 3 = 15,7 · 10 valores y un filtro de 3 dan 10 − 3 + 1 = 8 salidas</text>
    <text x="450" y="350" text-anchor="middle" font-size="13" fill="#94a3b8">El mismo filtro en todas las posiciones: 3 pesos, sea la serie de 10 valores o de un millón</text>
  </g>
</svg>
