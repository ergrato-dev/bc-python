<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" role="img" aria-labelledby="t d">
  <title id="t">Ventanas por tiempo</title>
  <desc id="d">Una serie de veinte valores cortada en ventanas de cuatro. Las primeras ventanas entrenan, las siguientes validan y las últimas son la prueba, siempre en orden de llegada.</desc>
  <defs></defs>
  <rect width="900" height="405" rx="12" fill="#0f172a"/>
