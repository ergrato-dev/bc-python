    <text x="440" y="266" text-anchor="end" font-size="12" fill="#94a3b8">11 a 14 →</text>
    <rect x="650" y="292" width="34" height="30" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <rect x="690" y="292" width="34" height="30" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <rect x="730" y="292" width="34" height="30" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <rect x="770" y="292" width="34" height="30" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <rect x="810" y="292" width="34" height="30" rx="6" fill="#86efac" stroke="#86efac"/>
    <text x="827" y="312" text-anchor="middle" font-size="12" fill="#0f172a" font-weight="700">20</text>
    <text x="640" y="312" text-anchor="end" font-size="12" fill="#94a3b8">16 a 19 →</text>
    <text x="450" y="358" text-anchor="middle" font-size="13" fill="#94a3b8">Sin barajar: ningún pronóstico ve valores posteriores. La media y la desviación para escalar</text>
    <text x="450" y="380" text-anchor="middle" font-size="13" fill="#94a3b8">salen solo de los valores que ven las ventanas de entrenamiento (1 a 12), como prepare en la semana 32</text>
  </g>
</svg>
