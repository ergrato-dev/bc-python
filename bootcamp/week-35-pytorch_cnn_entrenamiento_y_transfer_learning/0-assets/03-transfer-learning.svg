<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-labelledby="t d">
  <title id="t">Transfer learning</title>
  <desc id="d">Arriba, la red de origen con dos bloques convolucionales y una salida de diez dígitos. Abajo, los mismos bloques copiados y congelados, con una salida nueva de dos clases.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="900" height="410" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="36" text-anchor="middle" font-size="17" fill="#e2e8f0" font-weight="700">Transfer learning: se copian las capas que miran, se congelan y se cambia la salida</text>
    <text x="80" y="112" text-anchor="start" font-size="14" fill="#93c5fd" font-weight="700">origen</text>
    <text x="80" y="132" text-anchor="start" font-size="12" fill="#94a3b8">900 imágenes</text>
    <text x="80" y="152" text-anchor="start" font-size="12" fill="#94a3b8">diez dígitos</text>
    <text x="80" y="272" text-anchor="start" font-size="14" fill="#86efac" font-weight="700">tarea nueva</text>
    <text x="80" y="292" text-anchor="start" font-size="12" fill="#94a3b8">20 imágenes</text>
    <text x="80" y="312" text-anchor="start" font-size="12" fill="#94a3b8">¿es par?</text>
    <rect x="220" y="100" width="180" height="56" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="310" y="124" text-anchor="middle" font-size="13" fill="#e2e8f0">Conv2d · ReLU · Pool</text>
    <text x="310" y="144" text-anchor="middle" font-size="12" fill="#94a3b8">80 parámetros</text>
    <rect x="220" y="260" width="180" height="56" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="310" y="284" text-anchor="middle" font-size="13" fill="#94a3b8">Conv2d · ReLU · Pool</text>
    <text x="310" y="304" text-anchor="middle" font-size="12" fill="#94a3b8">congelada</text>
    <line x1="310" y1="162" x2="310" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <rect x="430" y="100" width="180" height="56" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="520" y="124" text-anchor="middle" font-size="13" fill="#e2e8f0">Conv2d · ReLU · Pool</text>
    <text x="520" y="144" text-anchor="middle" font-size="12" fill="#94a3b8">1168 parámetros</text>
    <rect x="430" y="260" width="180" height="56" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="520" y="284" text-anchor="middle" font-size="13" fill="#94a3b8">Conv2d · ReLU · Pool</text>
    <text x="520" y="304" text-anchor="middle" font-size="12" fill="#94a3b8">congelada</text>
    <line x1="520" y1="162" x2="520" y2="252" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="535" y="212" text-anchor="start" font-size="12" fill="#94a3b8">copiar</text>
    <rect x="650" y="100" width="170" height="56" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="735" y="124" text-anchor="middle" font-size="13" fill="#e2e8f0">Linear → 10</text>
    <text x="735" y="144" text-anchor="middle" font-size="12" fill="#94a3b8">650 · se descarta</text>
    <rect x="650" y="260" width="170" height="56" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="735" y="284" text-anchor="middle" font-size="13" fill="#86efac">Linear → 2, nueva</text>
    <text x="735" y="304" text-anchor="middle" font-size="12" fill="#86efac">130 · entrenable</text>
    <line x1="400" y1="128" x2="428" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="610" y1="128" x2="642" y2="128" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="400" y1="288" x2="428" y2="288" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="610" y1="288" x2="642" y2="288" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="450" y="362" text-anchor="middle" font-size="13" fill="#94a3b8">Con 20 imágenes: desde cero, 0,865 de acierto; con las capas de origen congeladas, 0,895</text>
    <text x="450" y="384" text-anchor="middle" font-size="13" fill="#94a3b8">Después se puede afinar todo con un ritmo bajo (0,901). Con 400 imágenes, desde cero gana</text>
  </g>
</svg>
