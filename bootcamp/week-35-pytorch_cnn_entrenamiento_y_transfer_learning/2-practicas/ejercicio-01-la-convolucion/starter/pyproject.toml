[project]
name = "la-convolucion"
version = "0.1.0"
description = "Ejercicio 01 de la semana 35: la convolución"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy==2.5.4", "scikit-learn==1.9.1", "torch==2.15.0"]

[tool.uv]
# Es un ejercicio, no un paquete instalable: uv solo crea el entorno.
package = false

[[tool.uv.index]]
# Las ruedas de PyTorch solo para CPU: las de PyPI traen CUDA para Linux, más de 2 GB.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
