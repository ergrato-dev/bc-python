<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d">
  <title id="t">Evaluar un RAG</title>
  <desc id="d">La búsqueda se mide con preguntas etiquetadas, recall@k y MRR. La respuesta se comprueba con reglas sobre las citas y el dato, y la fidelidad con un LLM como juez.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86efac"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fcd34d"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fca5a5"/></marker></defs>
  <rect width="900" height="450" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="34" text-anchor="middle" font-size="18" fill="#e2e8f0" font-weight="bold">Evaluar un RAG por partes</text>
    <rect x="20" y="60" width="420" height="330" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="230" y="88" text-anchor="middle" font-size="15" fill="#fcd34d" font-weight="bold">La búsqueda</text>
    <text x="230" y="112" text-anchor="middle" font-size="12" fill="#94a3b8">preguntas con su trozo correcto</text>
    <text x="40" y="145" text-anchor="start" font-size="13" fill="#e2e8f0">pregunta 1</text>
    <rect x="140" y="132" width="225" height="14" rx="3" fill="#86efac"/>
    <text x="420" y="145" text-anchor="end" font-size="12" fill="#86efac">puesto 1</text>
    <text x="40" y="173" text-anchor="start" font-size="13" fill="#e2e8f0">pregunta 2</text>
    <rect x="140" y="160" width="225" height="14" rx="3" fill="#86efac"/>
    <text x="420" y="173" text-anchor="end" font-size="12" fill="#86efac">puesto 1</text>
    <text x="40" y="201" text-anchor="start" font-size="13" fill="#e2e8f0">pregunta 3</text>
    <rect x="140" y="188" width="225" height="14" rx="3" fill="#86efac"/>
    <text x="420" y="201" text-anchor="end" font-size="12" fill="#86efac">puesto 1</text>
    <text x="40" y="229" text-anchor="start" font-size="13" fill="#e2e8f0">pregunta 4</text>
    <rect x="140" y="216" width="135" height="14" rx="3" fill="#fca5a5"/>
    <text x="420" y="229" text-anchor="end" font-size="12" fill="#fca5a5">puesto 7</text>
    <text x="40" y="257" text-anchor="start" font-size="13" fill="#e2e8f0">pregunta 5</text>
    <rect x="140" y="244" width="225" height="14" rx="3" fill="#86efac"/>
    <text x="420" y="257" text-anchor="end" font-size="12" fill="#86efac">puesto 1</text>
    <text x="40" y="285" text-anchor="start" font-size="13" fill="#e2e8f0">pregunta 6</text>
    <rect x="140" y="272" width="30" height="14" rx="3" fill="#fca5a5"/>
    <text x="420" y="285" text-anchor="end" font-size="12" fill="#fca5a5">puesto 14</text>
    <text x="230" y="330" text-anchor="middle" font-size="13" fill="#e2e8f0">recall@3: ¿está entre los 3 primeros?</text>
    <text x="230" y="356" text-anchor="middle" font-size="13" fill="#e2e8f0">MRR: media de 1 / puesto</text>
    <rect x="460" y="60" width="420" height="330" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="670" y="88" text-anchor="middle" font-size="15" fill="#86efac" font-weight="bold">La respuesta</text>
    <text x="670" y="112" text-anchor="middle" font-size="12" fill="#94a3b8">lo que dice Claude con lo que recibió</text>
    <text x="480" y="145" text-anchor="start" font-size="14" fill="#93c5fd" font-weight="bold">Reglas, gratis</text>
    <text x="495" y="171" text-anchor="start" font-size="13" fill="#e2e8f0">· citas válidas: solo trozos recibidos</text>
    <text x="495" y="197" text-anchor="start" font-size="13" fill="#e2e8f0">· cita el trozo correcto</text>
    <text x="495" y="223" text-anchor="start" font-size="13" fill="#e2e8f0">· trae el dato esperado</text>
    <text x="480" y="265" text-anchor="start" font-size="14" fill="#fcd34d" font-weight="bold">LLM como juez, de pago</text>
    <text x="495" y="291" text-anchor="start" font-size="13" fill="#e2e8f0">· fidelidad: ¿todo está en los trozos?</text>
    <text x="495" y="317" text-anchor="start" font-size="13" fill="#e2e8f0">· compáralo antes con tu criterio</text>
    <text x="450" y="425" text-anchor="middle" font-size="13" fill="#94a3b8">Si la búsqueda no trae el trozo, ninguna respuesta puede ser buena: mide primero la búsqueda.</text>
  </g>
</svg>
