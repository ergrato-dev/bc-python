<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
  <title id="t">El flujo de RAG</title>
  <desc id="d">La pregunta se convierte en vector, pgvector trae las k notas más cercanas, se ponen en el prompt y Claude responde citándolas. El código comprueba las citas y el coste; RAG no sirve para contar ni arregla una mala búsqueda.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86efac"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fcd34d"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fca5a5"/></marker></defs>
  <rect width="900" height="440" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="34" text-anchor="middle" font-size="18" fill="#e2e8f0" font-weight="bold">RAG: recuperar, aumentar y generar</text>
    <rect x="20" y="70" width="150" height="80" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="95" y="100" text-anchor="middle" font-size="15" fill="#93c5fd" font-weight="bold">Pregunta</text>
    <text x="95" y="128" text-anchor="middle" font-size="12" fill="#e2e8f0">«¿Qué estaciones…?»</text>
    <rect x="200" y="70" width="150" height="80" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="275" y="100" text-anchor="middle" font-size="15" fill="#fcd34d" font-weight="bold">Vector</text>
    <text x="275" y="128" text-anchor="middle" font-size="12" fill="#e2e8f0">embed(pregunta)</text>
    <rect x="380" y="70" width="150" height="80" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="455" y="100" text-anchor="middle" font-size="15" fill="#fcd34d" font-weight="bold">pgvector</text>
    <text x="455" y="128" text-anchor="middle" font-size="12" fill="#e2e8f0">ORDER BY &lt;=&gt; LIMIT k</text>
    <rect x="560" y="70" width="150" height="80" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="635" y="100" text-anchor="middle" font-size="15" fill="#86efac" font-weight="bold">Prompt</text>
    <text x="635" y="128" text-anchor="middle" font-size="12" fill="#e2e8f0">&lt;nota id=…&gt; × k</text>
    <rect x="740" y="70" width="150" height="80" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="815" y="100" text-anchor="middle" font-size="15" fill="#86efac" font-weight="bold">Claude</text>
    <text x="815" y="128" text-anchor="middle" font-size="12" fill="#e2e8f0">respuesta + citas</text>
    <line x1="172" y1="110" x2="198" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="352" y1="110" x2="378" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="532" y1="110" x2="558" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="712" y1="110" x2="738" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="275" y="178" text-anchor="middle" font-size="14" fill="#fcd34d" font-weight="bold">Recuperar</text>
    <text x="635" y="178" text-anchor="middle" font-size="14" fill="#86efac" font-weight="bold">Aumentar</text>
    <text x="815" y="178" text-anchor="middle" font-size="14" fill="#86efac" font-weight="bold">Generar</text>
    <rect x="20" y="210" width="420" height="210" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="230" y="238" text-anchor="middle" font-size="15" fill="#93c5fd" font-weight="bold">Lo que tu código comprueba</text>
    <text x="40" y="275" text-anchor="start" font-size="13" fill="#e2e8f0">· sin notas parecidas: no llama a Claude</text>
    <text x="40" y="307" text-anchor="start" font-size="13" fill="#e2e8f0">· solo valida si stop_reason es end_turn</text>
    <text x="40" y="339" text-anchor="start" font-size="13" fill="#e2e8f0">· citas inventadas: números que no recibió</text>
    <text x="40" y="371" text-anchor="start" font-size="13" fill="#e2e8f0">· tokens y coste de cada pregunta</text>
    <rect x="460" y="210" width="420" height="210" rx="6" fill="#1e293b" stroke="#fca5a5"/>
    <text x="670" y="238" text-anchor="middle" font-size="15" fill="#fca5a5" font-weight="bold">Lo que RAG no arregla</text>
    <text x="480" y="275" text-anchor="start" font-size="13" fill="#e2e8f0">· si la búsqueda falla, Claude no ve la nota</text>
    <text x="480" y="307" text-anchor="start" font-size="13" fill="#e2e8f0">· solo ve k notas: no sirve para contar</text>
    <text x="480" y="339" text-anchor="start" font-size="13" fill="#e2e8f0">· «¿cuántas…?» o «¿cuánto…?» van a SQL</text>
    <text x="480" y="371" text-anchor="start" font-size="13" fill="#e2e8f0">· otras palabras: TF-IDF no las encuentra</text>
  </g>
</svg>
