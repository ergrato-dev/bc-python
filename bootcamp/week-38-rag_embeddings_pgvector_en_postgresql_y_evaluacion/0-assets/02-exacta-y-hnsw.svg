  <title id="t">Búsqueda exacta y HNSW</title>
  <desc id="d">La búsqueda exacta calcula la distancia a todas las filas y siempre acierta. El índice HNSW salta por un grafo en capas: es más rápido pero aproximado, y al filtrar puede devolver menos filas.</desc>
