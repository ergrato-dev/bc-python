[project]
name = "studio-bc-manager"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlmodel>=0.0.19",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "polars>=1.0",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
manager = "main:app"

[tool.mypy]
strict = true
