<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" font-family="sans-serif">
  <rect width="860" height="500" fill="#0d1117"/>
  <text x="430" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">studio-bc-manager — Arquitectura del Sistema</text>

  <!-- LAYER LABELS (left) -->
  <text x="18" y="110" fill="#8b949e" font-size="10" text-anchor="middle" transform="rotate(-90,18,110)">Capa 1</text>
  <text x="18" y="230" fill="#8b949e" font-size="10" text-anchor="middle" transform="rotate(-90,18,230)">Capa 2</text>
  <text x="18" y="360" fill="#8b949e" font-size="10" text-anchor="middle" transform="rotate(-90,18,360)">Capa 3</text>
  <text x="18" y="455" fill="#8b949e" font-size="10" text-anchor="middle" transform="rotate(-90,18,455)">Capa 4</text>

  <!-- ===== CAPA 1 — CLI ===== -->
  <rect x="35" y="55" width="790" height="90" rx="8" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="430" y="74" fill="#FFD43B" font-size="12" font-weight="bold" text-anchor="middle">CLI — Typer + Rich</text>

  <!-- Command boxes -->
  <rect x="55"  y="82" width="130" height="50" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="120" y="103" fill="#e6edf3" font-size="11" text-anchor="middle">clients</text>
  <text x="120" y="119" fill="#8b949e" font-size="9"  text-anchor="middle">list · create · delete</text>

  <rect x="205" y="82" width="130" height="50" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="270" y="103" fill="#e6edf3" font-size="11" text-anchor="middle">projects</text>
  <text x="270" y="119" fill="#8b949e" font-size="9"  text-anchor="middle">list · create · update</text>

  <rect x="355" y="82" width="130" height="50" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="420" y="103" fill="#e6edf3" font-size="11" text-anchor="middle">assets</text>
  <text x="420" y="119" fill="#8b949e" font-size="9"  text-anchor="middle">list · add · tag</text>

  <rect x="505" y="82" width="130" height="50" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="570" y="103" fill="#e6edf3" font-size="11" text-anchor="middle">report</text>
  <text x="570" y="119" fill="#8b949e" font-size="9"  text-anchor="middle">generate · export</text>

  <rect x="655" y="82" width="155" height="50" rx="5" fill="#21262d" stroke="#FFD43B" stroke-width="1"/>
  <text x="732" y="103" fill="#e6edf3" font-size="11" text-anchor="middle">exchange</text>
  <text x="732" y="119" fill="#8b949e" font-size="9"  text-anchor="middle">rates · convert</text>

  <!-- ===== ARROWS 1→2 ===== -->
  <defs>
    <marker id="a1" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#30363d"/></marker>
  </defs>
  <line x1="430" y1="145" x2="430" y2="163" stroke="#30363d" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ===== CAPA 2 — SERVICES ===== -->
  <rect x="35" y="165" width="790" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="430" y="184" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Services — Lógica de Negocio</text>

  <rect x="55"  y="192" width="175" height="50" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="142" y="213" fill="#e6edf3" font-size="11" text-anchor="middle">ProjectService</text>
  <text x="142" y="229" fill="#8b949e" font-size="9"  text-anchor="middle">create · list_active · deactivate</text>

  <rect x="250" y="192" width="175" height="50" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="337" y="213" fill="#e6edf3" font-size="11" text-anchor="middle">ReportService</text>
  <text x="337" y="229" fill="#8b949e" font-size="9"  text-anchor="middle">generate · export_csv · export_parquet</text>

  <rect x="445" y="192" width="175" height="50" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="532" y="213" fill="#e6edf3" font-size="11" text-anchor="middle">ExchangeService</text>
  <text x="532" y="229" fill="#8b949e" font-size="9"  text-anchor="middle">get_ars_rate · convert</text>

  <rect x="640" y="192" width="175" height="50" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="727" y="213" fill="#e6edf3" font-size="11" text-anchor="middle">ClientService</text>
  <text x="727" y="229" fill="#8b949e" font-size="9"  text-anchor="middle">create · list · find_by_email</text>

  <!-- ===== ARROWS 2→3 ===== -->
  <line x1="250" y1="255" x2="215" y2="310" stroke="#30363d" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="430" y1="255" x2="390" y2="310" stroke="#30363d" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="532" y1="255" x2="660" y2="310" stroke="#30363d" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ===== CAPA 3 — Repositories + API Clients ===== -->
  <!-- Repositories -->
  <rect x="35" y="310" width="560" height="85" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="315" y="329" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle">Repositories — SQLModel Sessions</text>

  <rect x="55"  y="337" width="160" height="45" rx="5" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="135" y="355" fill="#e6edf3" font-size="11" text-anchor="middle">ClientRepository</text>
  <text x="135" y="370" fill="#8b949e" font-size="9"  text-anchor="middle">get · list · create · delete</text>

  <rect x="235" y="337" width="160" height="45" rx="5" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="315" y="355" fill="#e6edf3" font-size="11" text-anchor="middle">ProjectRepository</text>
  <text x="315" y="370" fill="#8b949e" font-size="9"  text-anchor="middle">list_active · kpis · by_client</text>

  <rect x="415" y="337" width="160" height="45" rx="5" fill="#21262d" stroke="#58a6ff" stroke-width="1"/>
  <text x="495" y="355" fill="#e6edf3" font-size="11" text-anchor="middle">AssetRepository</text>
  <text x="495" y="370" fill="#8b949e" font-size="9"  text-anchor="middle">list_by_project · add_tag</text>

  <!-- API Clients -->
  <rect x="610" y="310" width="215" height="85" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="717" y="329" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">API Clients — httpx async</text>
  <rect x="630" y="337" width="175" height="45" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="717" y="355" fill="#e6edf3" font-size="11" text-anchor="middle">ExchangeClient</text>
  <text x="717" y="370" fill="#8b949e" font-size="9"  text-anchor="middle">get_rates(base) → ExchangeRates</text>

  <!-- ===== ARROWS 3→4 ===== -->
  <line x1="315" y1="395" x2="315" y2="420" stroke="#30363d" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="717" y1="395" x2="717" y2="420" stroke="#30363d" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ===== CAPA 4 — Infrastructure ===== -->
  <rect x="35" y="420" width="560" height="55" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="315" y="440" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">SQLite — SQLModel + Alembic</text>
  <text x="120" y="460" fill="#8b949e" font-size="10" text-anchor="middle">Client · Project · Asset</text>
  <text x="315" y="460" fill="#8b949e" font-size="10" text-anchor="middle">Tag · AssetTagLink</text>
  <text x="510" y="460" fill="#8b949e" font-size="10" text-anchor="middle">Alembic migrations</text>

  <rect x="610" y="420" width="215" height="55" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="717" y="440" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">External API</text>
  <text x="717" y="460" fill="#8b949e" font-size="10" text-anchor="middle">open.er-api.com — tipos de cambio</text>
</svg>
