<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="sans-serif">
  <rect width="820" height="480" fill="#0d1117"/>
  <text x="410" y="30" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Flujo: `report generate --export csv`</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFD43B"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Step boxes -->
  <!-- 1. User -->
  <rect x="320" y="50" width="180" height="44" rx="6" fill="#21262d" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="410" y="68" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Usuario</text>
  <text x="410" y="84" fill="#8b949e" font-size="10" text-anchor="middle">$ manager report generate</text>

  <line x1="410" y1="94" x2="410" y2="118" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. CLI command -->
  <rect x="270" y="120" width="280" height="44" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="410" y="138" fill="#FFD43B" font-size="11" font-weight="bold" text-anchor="middle">commands/report.py</text>
  <text x="410" y="154" fill="#8b949e" font-size="10" text-anchor="middle">report_generate(export="csv")</text>

  <!-- Arrow to two services in parallel -->
  <line x1="320" y1="164" x2="200" y2="195" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="164" x2="610" y2="195" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="220" y="185" fill="#8b949e" font-size="9">asyncio.run()</text>
  <text x="490" y="185" fill="#8b949e" font-size="9">with session</text>

  <!-- 3a. ExchangeService (async) -->
  <rect x="60" y="197" width="230" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="175" y="215" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">ExchangeService</text>
  <text x="175" y="231" fill="#8b949e" font-size="10" text-anchor="middle">get_ars_rate() → 1050.0</text>

  <!-- 3b. ReportService -->
  <rect x="500" y="197" width="260" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="630" y="215" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">ReportService</text>
  <text x="630" y="231" fill="#8b949e" font-size="10" text-anchor="middle">generate_project_report(session)</text>

  <!-- ExchangeClient call -->
  <line x1="175" y1="241" x2="175" y2="270" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- 4a. ExchangeClient -->
  <rect x="60" y="272" width="230" height="44" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="175" y="290" fill="#f85149" font-size="11" text-anchor="middle">ExchangeClient</text>
  <text x="175" y="306" fill="#8b949e" font-size="10" text-anchor="middle">GET /latest/USD (httpx async)</text>

  <!-- Repo call -->
  <line x1="630" y1="241" x2="630" y2="270" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- 4b. ProjectRepository -->
  <rect x="500" y="272" width="260" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="630" y="290" fill="#58a6ff" font-size="11" text-anchor="middle">ProjectRepository</text>
  <text x="630" y="306" fill="#8b949e" font-size="10" text-anchor="middle">SELECT + GROUP BY → rows</text>

  <!-- Both converge back to ReportService -->
  <line x1="175" y1="316" x2="175" y2="345" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="630" y1="316" x2="630" y2="345" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. Polars transform -->
  <rect x="60" y="347" width="730" height="44" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="410" y="365" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">ReportService — Polars transform</text>
  <text x="175" y="381" fill="#8b949e" font-size="10" text-anchor="middle">pl.DataFrame(rows)</text>
  <text x="410" y="381" fill="#8b949e" font-size="10" text-anchor="middle">.with_columns(budget_ars = budget * ars_rate)</text>
  <text x="645" y="381" fill="#8b949e" font-size="10" text-anchor="middle">.group_by(client).agg(pl.sum)</text>

  <line x1="410" y1="391" x2="410" y2="415" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. CLI renders -->
  <rect x="190" y="417" width="225" height="44" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1"/>
  <text x="302" y="435" fill="#FFD43B" font-size="11" text-anchor="middle">Rich Table</text>
  <text x="302" y="451" fill="#8b949e" font-size="10" text-anchor="middle">console.print(table)</text>

  <rect x="430" y="417" width="205" height="44" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="532" y="435" fill="#3fb950" font-size="11" text-anchor="middle">CSV Export</text>
  <text x="532" y="451" fill="#8b949e" font-size="10" text-anchor="middle">df.write_csv("report.csv")</text>

  <line x1="370" y1="439" x2="428" y2="439" stroke="#30363d" stroke-width="1" stroke-dasharray="3,2"/>
</svg>
