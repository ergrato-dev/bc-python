<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="t d">
  <title id="t">Del Dockerfile a la imagen y al contenedor</title>
  <desc id="d">Cada instrucción del Dockerfile produce una capa de la imagen: Python 3.14.10, uv, dependencias del uv.lock, tu código y el usuario sin privilegios. Las capas de abajo cambian poco y se reutilizan de la caché; la de tu código cambia a menudo. docker compose run crea un contenedor a partir de la imagen, ejecuta los tests y con --rm lo borra al terminar.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
  <rect width="820" height="330" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="130" y="36" text-anchor="middle" font-size="15" font-weight="700">Dockerfile</text>
    <rect x="20" y="50" width="220" height="250" rx="8" fill="#1e293b" stroke="#64748b"/>
    <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">
      <text x="32" y="78">FROM python:3.14.10-slim</text>
      <text x="32" y="106">COPY --from=uv /uv /bin/</text>
      <text x="32" y="134">COPY pyproject.toml uv.lock</text>
      <text x="32" y="162">RUN uv sync --locked</text>
      <text x="32" y="190">COPY . .</text>
      <text x="32" y="218">USER app</text>
      <text x="32" y="246">CMD ["pytest"]</text>
    </g>
    <path d="M244 175H290" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="267" y="165" text-anchor="middle" font-size="11" fill="#94a3b8">build</text>
    <text x="420" y="36" text-anchor="middle" font-size="15" font-weight="700">Imagen (capas)</text>
    <rect x="300" y="236" width="240" height="40" rx="6" fill="#082f49" stroke="#38bdf8"/><text x="420" y="261" text-anchor="middle">Debian + Python 3.14.10</text>
    <rect x="300" y="192" width="240" height="40" rx="6" fill="#082f49" stroke="#38bdf8"/><text x="420" y="217" text-anchor="middle">uv 0.13.7</text>
    <rect x="300" y="148" width="240" height="40" rx="6" fill="#422006" stroke="#facc15"/><text x="420" y="173" text-anchor="middle">dependencias del uv.lock</text>
    <rect x="300" y="104" width="240" height="40" rx="6" fill="#450a0a" stroke="#f87171"/><text x="420" y="129" text-anchor="middle">tu código (cambia a menudo)</text>
    <rect x="300" y="60" width="240" height="40" rx="6" fill="#052e16" stroke="#4ade80"/><text x="420" y="85" text-anchor="middle">usuario app (no root)</text>
    <text x="420" y="300" text-anchor="middle" font-size="11.5" fill="#94a3b8">abajo: se reutiliza de la caché · arriba: se rehace</text>
    <path d="M544 175H600" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="572" y="165" text-anchor="middle" font-size="11" fill="#94a3b8">run</text>
    <text x="705" y="36" text-anchor="middle" font-size="15" font-weight="700">Contenedor</text>
    <rect x="610" y="60" width="190" height="216" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="705" y="100" text-anchor="middle" font-weight="700">proceso aislado</text>
    <text x="705" y="126" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">pytest</text>
    <text x="705" y="152" text-anchor="middle">usuario: app</text>
    <text x="705" y="178" text-anchor="middle">carpeta: /app</text>
    <text x="705" y="226" text-anchor="middle" font-size="12" fill="#94a3b8">con --rm se borra</text>
    <text x="705" y="244" text-anchor="middle" font-size="12" fill="#94a3b8">al terminar</text>
  </g>
</svg>
