<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="t d">
  <title id="t">Nombres y objetos en Python</title>
  <desc id="d">Los nombres station, temperature y reading son etiquetas que apuntan a objetos. Cada objeto tiene tipo, valor e identidad: un str "Norte", un float 21.5 y None. Al reasignar reading, el nombre pasa a apuntar a otro objeto; el objeto anterior no cambia.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="820" height="300" rx="12" fill="#f8fafc"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">
    <text x="110" y="36" text-anchor="middle" font-weight="700">Nombres</text>
    <text x="520" y="36" text-anchor="middle" font-weight="700">Objetos en memoria</text>
    <g font-family="monospace">
      <rect x="40" y="58" width="140" height="40" rx="20" fill="#ede9fe" stroke="#7c3aed"/><text x="110" y="83" text-anchor="middle">station</text>
      <rect x="40" y="130" width="140" height="40" rx="20" fill="#ede9fe" stroke="#7c3aed"/><text x="110" y="155" text-anchor="middle">temperature</text>
      <rect x="40" y="202" width="140" height="40" rx="20" fill="#ede9fe" stroke="#7c3aed"/><text x="110" y="227" text-anchor="middle">reading</text>
    </g>
    <rect x="300" y="50" width="200" height="56" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="400" y="74" text-anchor="middle" font-family="monospace">"Norte"</text><text x="400" y="94" text-anchor="middle" font-size="12" fill="#475569">tipo: str</text>
    <rect x="300" y="122" width="200" height="56" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
    <text x="400" y="146" text-anchor="middle" font-family="monospace">21.5</text><text x="400" y="166" text-anchor="middle" font-size="12" fill="#475569">tipo: float</text>
    <rect x="300" y="194" width="200" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="400" y="218" text-anchor="middle" font-family="monospace">None</text><text x="400" y="238" text-anchor="middle" font-size="12" fill="#475569">tipo: NoneType (antes)</text>
    <rect x="580" y="194" width="200" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="680" y="218" text-anchor="middle" font-family="monospace">19.0</text><text x="680" y="238" text-anchor="middle" font-size="12" fill="#475569">tipo: float (después)</text>
    <path d="M180 78H296" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M180 150H296" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <path d="M180 222H296" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <path d="M180 236C300 290 520 290 600 254" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
    <text x="520" y="284" text-anchor="middle" font-family="monospace" font-size="12" fill="#166534">reading = 19.0</text>
    <text x="680" y="90" text-anchor="middle" font-size="12" fill="#475569">cada objeto tiene</text>
    <text x="680" y="110" text-anchor="middle" font-size="12" fill="#475569">tipo · valor · identidad (id)</text>
  </g>
</svg>
