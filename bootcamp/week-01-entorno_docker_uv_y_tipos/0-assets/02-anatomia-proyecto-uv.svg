<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="t d">
  <title id="t">Anatomía de un proyecto uv</title>
  <desc id="d">pyproject.toml declara las dependencias directas; uv lock resuelve el árbol completo y lo fija en uv.lock; .python-version fija el intérprete; uv sync crea .venv con el Python y las bibliotecas exactas; uv run ejecuta dentro de .venv. pyproject.toml, uv.lock y .python-version van al repositorio; .venv no.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="820" height="340" rx="12" fill="#f8fafc"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">
    <rect x="20" y="20" width="420" height="300" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="36" y="46" font-weight="700" fill="#166534">Va al repositorio (Git)</text>
    <rect x="40" y="64" width="180" height="86" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="130" y="92" text-anchor="middle" font-weight="700" font-family="monospace">pyproject.toml</text>
    <text x="130" y="114" text-anchor="middle" font-size="12">lo que quieres:</text>
    <text x="130" y="132" text-anchor="middle" font-size="12" font-family="monospace">pytest==9.2.0</text>
    <rect x="240" y="64" width="180" height="86" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="330" y="92" text-anchor="middle" font-weight="700" font-family="monospace">uv.lock</text>
    <text x="330" y="114" text-anchor="middle" font-size="12">lo que se instala: todo</text>
    <text x="330" y="132" text-anchor="middle" font-size="12">el árbol, con hashes</text>
    <path d="M220 107H236" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="228" y="170" text-anchor="middle" font-size="12" font-family="monospace" fill="#475569">uv lock</text>
    <rect x="40" y="196" width="180" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="130" y="224" text-anchor="middle" font-weight="700" font-family="monospace">.python-version</text>
    <text x="130" y="246" text-anchor="middle" font-size="12" font-family="monospace">3.14.10</text>
    <rect x="240" y="196" width="180" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="330" y="224" text-anchor="middle" font-weight="700" font-family="monospace">src/ y tests/</text>
    <text x="330" y="246" text-anchor="middle" font-size="12">tu código</text>
    <rect x="500" y="20" width="300" height="300" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="516" y="46" font-weight="700" fill="#991b1b">No va al repositorio</text>
    <rect x="530" y="90" width="240" height="140" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="650" y="118" text-anchor="middle" font-weight="700" font-family="monospace">.venv/</text>
    <text x="650" y="144" text-anchor="middle" font-size="12">Python 3.14.10</text>
    <text x="650" y="164" text-anchor="middle" font-size="12">+ bibliotecas exactas del lock</text>
    <text x="650" y="190" text-anchor="middle" font-size="12">se regenera en segundos</text>
    <path d="M420 107C470 107 480 150 526 150" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><path d="M220 231C380 300 470 230 526 210" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="470" y="84" text-anchor="middle" font-size="12" font-family="monospace" fill="#475569">uv sync</text>
    <rect x="530" y="250" width="240" height="44" rx="8" fill="#0f172a"/>
    <text x="650" y="277" text-anchor="middle" font-family="monospace" font-size="13" fill="#f8fafc">uv run pytest  →  usa .venv</text>
  </g>
</svg>
