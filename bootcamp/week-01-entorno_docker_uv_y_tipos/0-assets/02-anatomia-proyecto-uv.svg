<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" role="img" aria-labelledby="t d">
  <title id="t">Anatomía de un proyecto uv</title>
  <desc id="d">pyproject.toml declara las dependencias directas; uv lock resuelve el árbol completo y lo fija en uv.lock; .python-version fija el intérprete; uv sync crea .venv con el Python y las bibliotecas exactas; uv run ejecuta dentro de .venv. pyproject.toml, uv.lock y .python-version van al repositorio; .venv no.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
  <rect width="820" height="340" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="20" y="20" width="420" height="300" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="36" y="46" font-weight="700" fill="#86efac">Va al repositorio (Git)</text>
    <rect x="40" y="64" width="180" height="86" rx="8" fill="#082f49" stroke="#38bdf8"/>
    <text x="130" y="92" text-anchor="middle" font-weight="700" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">pyproject.toml</text>
    <text x="130" y="114" text-anchor="middle" font-size="12">lo que quieres:</text>
    <text x="130" y="132" text-anchor="middle" font-size="12" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">pytest==9.2.0</text>
    <rect x="240" y="64" width="180" height="86" rx="8" fill="#422006" stroke="#facc15"/>
    <text x="330" y="92" text-anchor="middle" font-weight="700" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">uv.lock</text>
    <text x="330" y="114" text-anchor="middle" font-size="12">lo que se instala: todo</text>
    <text x="330" y="132" text-anchor="middle" font-size="12">el árbol, con hashes</text>
    <path d="M220 107H236" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="228" y="170" text-anchor="middle" font-size="12" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" fill="#94a3b8">uv lock</text>
    <rect x="40" y="196" width="180" height="70" rx="8" fill="#2e1065" stroke="#a78bfa"/>
    <text x="130" y="224" text-anchor="middle" font-weight="700" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">.python-version</text>
    <text x="130" y="246" text-anchor="middle" font-size="12" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">3.14.10</text>
    <rect x="240" y="196" width="180" height="70" rx="8" fill="#1e293b" stroke="#94a3b8"/>
    <text x="330" y="224" text-anchor="middle" font-weight="700" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">src/ y tests/</text>
    <text x="330" y="246" text-anchor="middle" font-size="12">tu código</text>
    <rect x="500" y="20" width="300" height="300" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="516" y="46" font-weight="700" fill="#fca5a5">No va al repositorio</text>
    <rect x="530" y="90" width="240" height="140" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="650" y="118" text-anchor="middle" font-weight="700" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">.venv/</text>
    <text x="650" y="144" text-anchor="middle" font-size="12">Python 3.14.10</text>
    <text x="650" y="164" text-anchor="middle" font-size="12">+ bibliotecas exactas del lock</text>
    <text x="650" y="190" text-anchor="middle" font-size="12">se regenera en segundos</text>
    <path d="M420 107C470 107 480 150 526 150" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M220 231C380 300 470 230 526 210" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="470" y="84" text-anchor="middle" font-size="12" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" fill="#94a3b8">uv sync</text>
    <rect x="530" y="250" width="240" height="44" rx="8" fill="#334155"/>
    <text x="650" y="277" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="13" fill="#e2e8f0">uv run pytest  →  usa .venv</text>
  </g>
</svg>
