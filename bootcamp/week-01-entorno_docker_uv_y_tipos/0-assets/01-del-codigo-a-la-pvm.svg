<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="t d">
  <title id="t">Del archivo .py a la ejecución</title>
  <desc id="d">CPython analiza el archivo saludo.py; si hay un error de escritura se detiene con SyntaxError. Si no, compila a bytecode, que guarda en __pycache__ como .pyc al importar, y la máquina virtual de Python lo ejecuta; los errores como NameError o TypeError aparecen durante la ejecución.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
  <rect width="820" height="300" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="20" y="70" width="150" height="90" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="95" y="100" text-anchor="middle" font-weight="700">saludo.py</text>
    <text x="95" y="124" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12">def greet(name):</text>
    <text x="95" y="142" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12">  return ...</text>
    <rect x="220" y="70" width="160" height="90" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
    <text x="300" y="104" text-anchor="middle" font-weight="700">1. Analizar</text>
    <text x="300" y="128" text-anchor="middle" font-size="12">¿está bien escrito?</text>
    <rect x="430" y="70" width="160" height="90" rx="8" fill="#422006" stroke="#facc15" stroke-width="2"/>
    <text x="510" y="104" text-anchor="middle" font-weight="700">2. Compilar</text>
    <text x="510" y="128" text-anchor="middle" font-size="12">a bytecode</text>
    <rect x="640" y="70" width="160" height="90" rx="8" fill="#052e16" stroke="#4ade80" stroke-width="2"/>
    <text x="720" y="104" text-anchor="middle" font-weight="700">3. Ejecutar</text>
    <text x="720" y="128" text-anchor="middle" font-size="12">en la PVM</text>
    <path d="M170 115H216" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M380 115H426" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M590 115H636" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <path d="M300 160V214" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <rect x="215" y="218" width="170" height="54" rx="8" fill="#450a0a" stroke="#f87171"/>
    <text x="300" y="241" text-anchor="middle" font-weight="700" fill="#fca5a5">SyntaxError</text>
    <text x="300" y="260" text-anchor="middle" font-size="12" fill="#fca5a5">no se ejecuta nada</text>
    <path d="M510 160V214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <rect x="425" y="218" width="170" height="54" rx="8" fill="#1e293b" stroke="#facc15"/>
    <text x="510" y="241" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12">__pycache__/</text>
    <text x="510" y="260" text-anchor="middle" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12">saludo.cpython-314.pyc</text>
    <path d="M720 160V214" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <rect x="635" y="218" width="170" height="54" rx="8" fill="#450a0a" stroke="#f87171"/>
    <text x="720" y="241" text-anchor="middle" font-weight="700" fill="#fca5a5">NameError, TypeError…</text>
    <text x="720" y="260" text-anchor="middle" font-size="12" fill="#fca5a5">al llegar a la línea</text>
    <text x="410" y="40" text-anchor="middle" font-size="18" font-weight="700">uv run python saludo.py</text>
  </g>
</svg>
