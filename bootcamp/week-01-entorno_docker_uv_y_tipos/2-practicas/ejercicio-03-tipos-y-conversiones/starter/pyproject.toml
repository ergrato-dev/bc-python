[project]
name = "tipos-y-conversiones"
version = "0.1.0"
description = "Ejercicio 03 de la semana 01: tipos básicos y conversiones"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
# Es un ejercicio, no un paquete instalable: uv solo crea el entorno.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite que los tests hagan `import types_lab` desde la raíz del starter.
pythonpath = ["."]
