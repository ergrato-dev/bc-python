<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="t d">
  <title id="t">Salida estructurada</title>
  <desc id="d">Una clase de Pydantic se convierte con transform_schema en el esquema de output_config.format; si stop_reason es end_turn, model_validate_json da el objeto; si es max_tokens o refusal, no hay lectura; las reglas que la API no impone las valida Pydantic.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86efac"/></marker><marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fcd34d"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fca5a5"/></marker></defs>
  <rect width="900" height="345" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="34" text-anchor="middle" font-size="17" fill="#e2e8f0" font-weight="bold">Salida estructurada: la forma la garantiza la API, el resto lo compruebas tú</text>
    <rect x="30" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="105" y="108" text-anchor="middle" font-size="13" fill="#93c5fd" font-weight="bold">class Reading</text>
    <text x="105" y="132" text-anchor="middle" font-size="12" fill="#94a3b8">BaseModel · Literal</text>
    <rect x="210" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#93c5fd"/>
    <text x="285" y="108" text-anchor="middle" font-size="13" fill="#93c5fd" font-weight="bold">transform_schema</text>
    <text x="285" y="132" text-anchor="middle" font-size="12" fill="#94a3b8">el esquema de la API</text>
    <rect x="390" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="465" y="108" text-anchor="middle" font-size="13" fill="#86efac" font-weight="bold">output_config.format</text>
    <text x="465" y="132" text-anchor="middle" font-size="12" fill="#94a3b8">Claude solo escribe</text>
    <rect x="570" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#fcd34d"/>
    <text x="645" y="108" text-anchor="middle" font-size="13" fill="#fcd34d" font-weight="bold">stop_reason</text>
    <text x="645" y="132" text-anchor="middle" font-size="12" fill="#94a3b8">¿end_turn?</text>
    <rect x="750" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#86efac"/>
    <text x="825" y="108" text-anchor="middle" font-size="13" fill="#86efac" font-weight="bold">model_validate_json</text>
    <text x="825" y="132" text-anchor="middle" font-size="12" fill="#94a3b8">un objeto Reading</text>
    <line x1="182" y1="115" x2="208" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="362" y1="115" x2="388" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="542" y1="115" x2="568" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="722" y1="115" x2="748" y2="115" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="465" y="170" text-anchor="middle" font-size="12" fill="#94a3b8">JSON válido según el esquema</text>
    <line x1="645" y1="152" x2="645" y2="220" stroke="#fca5a5" stroke-width="2" marker-end="url(#r)"/>
    <rect x="560" y="225" width="170" height="60" rx="6" fill="#1e293b" stroke="#fca5a5"/>
    <text x="645" y="250" text-anchor="middle" font-size="13" fill="#fca5a5">max_tokens o refusal</text>
    <text x="645" y="270" text-anchor="middle" font-size="12" fill="#94a3b8">sin lectura: no se inventa</text>
    <rect x="30" y="225" width="480" height="60" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="270" y="250" text-anchor="middle" font-size="13" fill="#e2e8f0">maxLength, minimum, pattern: la API no los impone;</text>
    <text x="270" y="270" text-anchor="middle" font-size="13" fill="#94a3b8">van a la descripción y los valida Pydantic en tu lado</text>
    <line x1="825" y1="152" x2="825" y2="220" stroke="#fca5a5" stroke-width="2" marker-end="url(#r)"/>
    <rect x="750" y="225" width="140" height="60" rx="6" fill="#1e293b" stroke="#fca5a5"/>
    <text x="820" y="250" text-anchor="middle" font-size="13" fill="#fca5a5">ValidationError</text>
    <text x="820" y="270" text-anchor="middle" font-size="12" fill="#94a3b8">una regla tuya</text>
    <text x="450" y="320" text-anchor="middle" font-size="14" fill="#fcd34d">Un esquema garantiza la forma, no la verdad: una nota sin tipo necesita una opción para decirlo.</text>
  </g>
</svg>
