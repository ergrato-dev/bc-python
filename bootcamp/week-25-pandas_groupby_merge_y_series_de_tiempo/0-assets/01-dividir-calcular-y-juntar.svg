<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t d">
  <title id="t">Dividir, calcular y juntar</title>
  <desc id="d">La tabla readings tiene seis filas con station y value: Sur 8.0, Norte 12.5, Sur 9.5, Este 30.0, Norte 48.9 y Norte 20.0. Primero, groupby('station') divide las filas en tres grupos: Este con 30.0, Norte con 12.5, 48.9 y 20.0, y Sur con 8.0 y 9.5. Después, mean() calcula la media de cada grupo por separado: 30.0, 27.1 y 8.75. Por último, pandas junta los tres resultados en una Series con la estación como índice, ordenada: Este 30.0, Norte 27.1, Sur 8.75.</desc>
