<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 482" role="img" aria-labelledby="t d">
  <title id="t">Los cuatro how de merge</title>
  <desc id="d">monday tiene medidas de Norte 12.5, Sur 8.0 y Oeste 3.1. stations tiene la región de Norte (montaña), Sur (costa) y Centro (valle). monday.merge(stations, on='station', how=...) cruza cada fila por la columna station. Con inner salen solo Norte y Sur, que están en las dos. Con left salen Norte, Sur y Oeste, y Oeste tiene la región en NaN. Con right salen Norte, Sur y Centro, y Centro tiene el valor en NaN. Con outer salen las cuatro, ordenadas: Centro, Norte, Oeste y Sur, con NaN donde falta la pareja. inner es el valor por defecto y quita filas sin avisar.</desc>
