    <text x="604" y="284" font-size="13" fill="#94a3b8">Sur de las 12:00: solo un NaN.</text>
    <text x="30" y="352" fill="#94a3b8">pivot: el mismo índice de tiempo y una columna por etiqueta; NaN donde esa etiqueta no midió.</text>
    <text x="30" y="378" fill="#94a3b8">resample: periodos contados desde la medianoche (6:00, 9:00, 12:00), no desde la primera medida.</text>
    <text x="30" y="404" fill="#94a3b8">Cada periodo incluye su inicio y no su final: la medida de las 12:00 es del periodo de las 12:00.</text>
    <text x="30" y="430" fill="#94a3b8">Los periodos sin ninguna medida también salen, con NaN en todas las columnas.</text>
