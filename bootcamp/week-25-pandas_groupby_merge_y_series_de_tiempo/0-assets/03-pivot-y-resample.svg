<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" role="img" aria-labelledby="t d">
  <title id="t">pivot y resample</title>
  <desc id="d">Una tabla larga tiene seis medidas, una por hora de las 8:00 a las 13:00, con su etiqueta y su valor: Norte 12.5, Norte 14.0, Sur 8.0, Norte 16.0, Sur sin valor y Norte 48.9. pivot(columns='label', values='value') la pasa a una tabla ancha: el mismo índice de tiempo y una columna por etiqueta, Norte y Sur, con NaN donde esa etiqueta no midió. resample('3h').mean() agrupa las filas en periodos de tres horas contados desde la medianoche: el de las 6:00 tiene la fila de las 8:00, el de las 9:00 las de las 9:00, 10:00 y 11:00, y el de las 12:00 las de las 12:00 y 13:00. La media de cada columna en cada periodo da Norte 12.5, 15.0 y 48.9, y Sur NaN, 8.0 y NaN: Sur no tiene ningún valor en los periodos de las 6:00 y las 12:00.</desc>
