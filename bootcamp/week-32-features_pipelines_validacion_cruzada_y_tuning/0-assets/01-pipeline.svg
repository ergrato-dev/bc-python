<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
  <title id="t">Un pipeline</title>
  <desc id="d">La tabla con etiqueta y posición entra en el paso prepare, un ColumnTransformer: OneHotEncoder convierte la etiqueta en columnas 0/1 y StandardScaler escala la posición. Las dos salidas van al paso model, Ridge o LogisticRegression. En fit cada paso aprende solo con el entrenamiento; en predict solo transforma.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="900" height="460" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700">Un Pipeline: la preparación y el modelo, un solo estimador</text>
    <text x="450" y="60" text-anchor="middle" font-size="13" fill="#94a3b8">Pipeline([("prepare", ColumnTransformer(...)), ("model", Ridge())])</text>
    <rect x="30" y="110" width="170" height="150" rx="8" fill="#1e293b" stroke="#e2e8f0"/>
    <text x="46" y="138" font-size="15" font-weight="700" fill="#e2e8f0">la tabla</text>
    <text x="46" y="164" font-size="13" fill="#e2e8f0">etiqueta: Norte, Sur...</text>
    <text x="46" y="186" font-size="13" fill="#e2e8f0">posicion: 0, 1, 2...</text>
    <text x="46" y="208" font-size="13" fill="#e2e8f0"></text>
    <text x="46" y="230" font-size="13" fill="#e2e8f0">valor, nivel: no entran</text>
    <rect x="230" y="90" width="380" height="250" rx="10" fill="none" stroke="#93c5fd" stroke-dasharray="6 4"/>
    <text x="246" y="112" font-size="14" font-weight="700" fill="#93c5fd">"prepare" · ColumnTransformer</text>
    <rect x="250" y="128" width="340" height="88" rx="8" fill="#1e293b" stroke="#93c5fd"/>
    <text x="266" y="156" font-size="15" font-weight="700" fill="#93c5fd">OneHotEncoder</text>
    <text x="266" y="182" font-size="13" fill="#e2e8f0">etiqueta → una columna 0/1 por etiqueta</text>
    <text x="266" y="204" font-size="13" fill="#e2e8f0">handle_unknown="ignore": nueva → ceros</text>
    <rect x="250" y="232" width="340" height="88" rx="8" fill="#1e293b" stroke="#93c5fd"/>
    <text x="266" y="260" font-size="15" font-weight="700" fill="#93c5fd">StandardScaler()</text>
    <text x="266" y="286" font-size="13" fill="#e2e8f0">posicion → media 0, desviación 1</text>
    <text x="266" y="308" font-size="13" fill="#e2e8f0">con la media del entrenamiento</text>
    <rect x="640" y="140" width="230" height="150" rx="8" fill="#1e293b" stroke="#86efac"/>
    <text x="656" y="168" font-size="15" font-weight="700" fill="#86efac">"model"</text>
    <text x="656" y="194" font-size="13" fill="#e2e8f0">Ridge(alpha=...)</text>
    <text x="656" y="216" font-size="13" fill="#e2e8f0">o LogisticRegression(C=...)</text>
    <text x="656" y="238" font-size="13" fill="#e2e8f0"></text>
    <text x="656" y="260" font-size="13" fill="#e2e8f0">predict → valor o nivel</text>
    <line x1="202" y1="172" x2="246" y2="172" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="202" y1="222" x2="246" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="592" y1="172" x2="636" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="592" y1="276" x2="636" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <text x="450" y="378" text-anchor="middle" font-size="13" fill="#e2e8f0">fit: cada paso aprende con lo que sale del anterior, solo con el entrenamiento</text>
    <text x="450" y="402" text-anchor="middle" font-size="13" fill="#e2e8f0">predict: los pasos ya ajustados solo transforman, y el modelo predice</text>
    <text x="450" y="434" text-anchor="middle" font-size="13" fill="#fcd34d">Todo lo que aprende de los datos va dentro: así ninguna validación deja ver la prueba</text>
  </g>
</svg>
