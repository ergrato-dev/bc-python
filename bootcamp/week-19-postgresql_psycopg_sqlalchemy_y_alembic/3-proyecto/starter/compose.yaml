# Dos servicios: `db`, el PostgreSQL del Observatorio, y `app`, tu programa y sus tests.
# Usuario y contraseña de desarrollo, solo para tu máquina: en un servidor de verdad
# irían en un secreto, nunca en un archivo de Git.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: observatorio
      POSTGRES_PASSWORD: observatorio
      POSTGRES_DB: observatorio
    # 127.0.0.1: el puerto solo se abre a tu máquina, no a la red en la que estés.
    ports:
      - "127.0.0.1:5432:5432"
    # Los datos sobreviven a `docker compose down`; `down -v` los borra.
    volumes:
      - pgdata:/var/lib/postgresql
    # `app` espera a que PostgreSQL acepte conexiones, no solo a que el contenedor arranque.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "observatorio", "-d", "observatorio"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    image: local/observatorio:week-19
    environment:
      # Dentro de la red de compose, PostgreSQL se llama `db`, no 127.0.0.1.
      OBSERVATORIO_DATABASE_URL: postgresql+psycopg://observatorio:observatorio@db:5432/observatorio
      OBSERVATORIO_TEST_DATABASE_URL: postgresql+psycopg://observatorio:observatorio@db:5432/observatorio_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
