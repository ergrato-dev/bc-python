  <title id="t">Cómo agrupa KMeans</title>
  <desc id="d">Tres paneles con los treinta sensores de la teoría 04, PM2.5 de día en horizontal y de noche en vertical. En el primero, los puntos en gris y tres centros mal puestos. En el segundo, cada punto toma el color del centro más cercano. En el tercero, cada centro se mueve a la media de los puntos de su color. Se repite hasta que ningún punto cambia de grupo.</desc>
