<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="t d">
  <title id="t">Alias frente a copia de una lista</title>
  <desc id="d">Arriba, después de alias = readings, los nombres readings y alias apuntan a la misma lista; alias.append(0.0) cambia esa única lista y el cambio se ve por los dos nombres; alias is readings es True. Abajo, después de snapshot = readings.copy(), hay dos listas distintas; el append sobre readings no toca snapshot; snapshot is readings es False, aunque antes del cambio fueran iguales con ==.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
  <rect width="820" height="420" rx="12" fill="#0f172a"/>
  <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <text x="30" y="40" font-weight="700">alias = readings</text>
    <text x="200" y="40" fill="#94a3b8" font-size="13">un objeto, dos nombres</text>
    <rect x="30" y="62" width="150" height="40" rx="8" fill="#1e293b" stroke="#60a5fa"/>
    <text x="105" y="87" text-anchor="middle">readings</text>
    <rect x="30" y="122" width="150" height="40" rx="8" fill="#1e293b" stroke="#60a5fa"/>
    <text x="105" y="147" text-anchor="middle">alias</text>
    <rect x="340" y="88" width="250" height="48" rx="8" fill="#422006" stroke="#facc15"/>
    <text x="465" y="117" text-anchor="middle">[12.5, 8.0, 0.0]</text>
    <path d="M180 82C260 82 280 104 334 106" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
    <path d="M180 142C260 142 280 120 334 118" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
    <text x="610" y="96" fill="#facc15" font-size="13">alias.append(0.0)</text>
    <text x="610" y="116" fill="#94a3b8" font-size="13">cambia la única lista:</text>
    <text x="610" y="136" fill="#94a3b8" font-size="13">se ve por los dos nombres</text>
    <text x="340" y="172" fill="#f87171" font-size="13">alias is readings  →  True</text>

    <path d="M30 200H790" stroke="#64748b" stroke-dasharray="4 6"/>

    <text x="30" y="240" font-weight="700">snapshot = readings.copy()</text>
    <text x="250" y="240" fill="#94a3b8" font-size="13">dos objetos, uno por nombre</text>
    <rect x="30" y="262" width="150" height="40" rx="8" fill="#1e293b" stroke="#60a5fa"/>
    <text x="105" y="287" text-anchor="middle">readings</text>
    <rect x="30" y="332" width="150" height="40" rx="8" fill="#1e293b" stroke="#60a5fa"/>
    <text x="105" y="357" text-anchor="middle">snapshot</text>
    <rect x="340" y="258" width="250" height="48" rx="8" fill="#422006" stroke="#facc15"/>
    <text x="465" y="287" text-anchor="middle">[12.5, 8.0, 0.0]</text>
    <rect x="340" y="328" width="250" height="48" rx="8" fill="#052e16" stroke="#4ade80"/>
    <text x="465" y="357" text-anchor="middle">[12.5, 8.0]</text>
    <path d="M180 282H334" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
    <path d="M180 352H334" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#a)"/>
    <text x="610" y="276" fill="#facc15" font-size="13">readings.append(0.0)</text>
    <text x="610" y="296" fill="#94a3b8" font-size="13">solo cambia esta lista</text>
    <text x="610" y="346" fill="#4ade80" font-size="13">la copia no se entera</text>
    <text x="340" y="400" fill="#4ade80" font-size="13">snapshot is readings  →  False</text>
  </g>
</svg>
