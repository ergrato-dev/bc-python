<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="sans-serif">
  <rect width="760" height="420" fill="#0d1117"/>
  <text x="380" y="30" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">watchdog — Flujo de Eventos</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-y" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFD43B"/>
    </marker>
  </defs>

  <!-- Sistema Operativo -->
  <rect x="50" y="55" width="200" height="60" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="150" y="80" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">Sistema Operativo</text>
  <text x="150" y="98" fill="#8b949e" font-size="9" text-anchor="middle">inotify (Linux) / FSEvents (macOS)</text>

  <line x1="150" y1="115" x2="150" y2="150" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="137" fill="#8b949e" font-size="9">kernel event</text>

  <!-- Observer Thread -->
  <rect x="50" y="152" width="200" height="60" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="150" y="177" fill="#FFD43B" font-size="11" font-weight="bold" text-anchor="middle">Observer</text>
  <text x="150" y="195" fill="#8b949e" font-size="9" text-anchor="middle">hilo daemon · observer.start()</text>

  <line x1="150" y1="212" x2="150" y2="247" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="234" fill="#8b949e" font-size="9">despacha</text>

  <!-- EventHandler -->
  <rect x="50" y="249" width="200" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="150" y="274" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">FileSystemEventHandler</text>
  <text x="150" y="292" fill="#8b949e" font-size="9" text-anchor="middle">on_created / on_modified / ...</text>

  <!-- Arrow to callbacks -->
  <line x1="250" y1="279" x2="360" y2="230" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="250" y1="279" x2="360" y2="279" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="250" y1="279" x2="360" y2="328" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Callback boxes -->
  <rect x="362" y="210" width="180" height="40" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="452" y="230" fill="#e6edf3" font-size="10" text-anchor="middle">on_created(event)</text>
  <text x="452" y="244" fill="#8b949e" font-size="9" text-anchor="middle">FileCreatedEvent</text>

  <rect x="362" y="259" width="180" height="40" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="452" y="279" fill="#e6edf3" font-size="10" text-anchor="middle">on_modified(event)</text>
  <text x="452" y="293" fill="#8b949e" font-size="9" text-anchor="middle">FileModifiedEvent</text>

  <rect x="362" y="308" width="180" height="40" rx="5" fill="#21262d" stroke="#3fb950" stroke-width="1"/>
  <text x="452" y="328" fill="#e6edf3" font-size="10" text-anchor="middle">on_moved(event)</text>
  <text x="452" y="342" fill="#8b949e" font-size="9" text-anchor="middle">FileMovedEvent · dest_path</text>

  <!-- Tu código -->
  <rect x="562" y="249" width="160" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="642" y="274" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">Tu código</text>
  <text x="642" y="292" fill="#8b949e" font-size="9" text-anchor="middle">classify / organize / log</text>

  <line x1="542" y1="279" x2="560" y2="279" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Lifecycle bar -->
  <rect x="50" y="340" width="660" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="380" y="358" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Ciclo de vida del Observer</text>
  <text x="150" y="380" fill="#FFD43B" font-size="10" text-anchor="middle">observer.start()</text>
  <text x="380" y="380" fill="#8b949e" font-size="10" text-anchor="middle">while True: time.sleep(1)</text>
  <text x="610" y="380" fill="#f85149" font-size="10" text-anchor="middle">observer.stop() · observer.join()</text>
</svg>
