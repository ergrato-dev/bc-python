<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="sans-serif">
  <rect width="820" height="340" fill="#0d1117"/>
  <text x="410" y="28" fill="#e6edf3" font-size="15" font-weight="bold" text-anchor="middle">Pipeline de Ingest — studio-ingest-daemon</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Step 1: drop/ -->
  <rect x="30" y="55" width="130" height="60" rx="6" fill="#21262d" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="95" y="80" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">drop/</text>
  <text x="95" y="96" fill="#8b949e" font-size="9" text-anchor="middle">archivo entrante</text>
  <text x="95" y="108" fill="#8b949e" font-size="9" text-anchor="middle">FileCreatedEvent</text>

  <line x1="160" y1="85" x2="188" y2="85" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: checksum -->
  <rect x="190" y="55" width="130" height="60" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1.5"/>
  <text x="255" y="78" fill="#FFD43B" font-size="11" font-weight="bold" text-anchor="middle">sha256(file)</text>
  <text x="255" y="96" fill="#8b949e" font-size="9" text-anchor="middle">hashlib.sha256()</text>
  <text x="255" y="110" fill="#8b949e" font-size="9" text-anchor="middle">chunks de 64 KB</text>

  <line x1="320" y1="85" x2="348" y2="85" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: check registry -->
  <rect x="350" y="55" width="130" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="415" y="78" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">.processed.json</text>
  <text x="415" y="96" fill="#8b949e" font-size="9" text-anchor="middle">¿checksum existe?</text>
  <text x="415" y="110" fill="#8b949e" font-size="9" text-anchor="middle">load_registry()</text>

  <!-- Skip branch (yes) -->
  <line x1="415" y1="115" x2="415" y2="170" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="425" y="148" fill="#f85149" font-size="9">sí → skip</text>
  <rect x="355" y="172" width="120" height="35" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1"/>
  <text x="415" y="190" fill="#f85149" font-size="10" text-anchor="middle">SKIP</text>
  <text x="415" y="202" fill="#8b949e" font-size="9" text-anchor="middle">archivo ya procesado</text>

  <!-- Continue branch (no) -->
  <line x1="480" y1="85" x2="508" y2="85" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="493" y="79" fill="#3fb950" font-size="9">no</text>

  <!-- Step 4: classify -->
  <rect x="510" y="55" width="130" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="575" y="78" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">classify(path)</text>
  <text x="575" y="96" fill="#8b949e" font-size="9" text-anchor="middle">EXTENSION_MAP</text>
  <text x="575" y="110" fill="#8b949e" font-size="9" text-anchor="middle">video/audio/image/doc</text>

  <line x1="640" y1="85" x2="668" y2="85" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5: move -->
  <rect x="670" y="55" width="130" height="60" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="735" y="78" fill="#3fb950" font-size="11" font-weight="bold" text-anchor="middle">safe_move()</text>
  <text x="735" y="96" fill="#8b949e" font-size="9" text-anchor="middle">organized/{tipo}/{YYYY-MM}/</text>
  <text x="735" y="110" fill="#8b949e" font-size="9" text-anchor="middle">shutil.move()</text>

  <!-- Step 6: mark processed -->
  <line x1="735" y1="115" x2="735" y2="165" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="670" y="167" width="130" height="45" rx="6" fill="#161b22" stroke="#FFD43B" stroke-width="1"/>
  <text x="735" y="185" fill="#FFD43B" font-size="10" font-weight="bold" text-anchor="middle">mark_processed()</text>
  <text x="735" y="202" fill="#8b949e" font-size="9" text-anchor="middle">actualiza .processed.json</text>

  <!-- organized structure -->
  <rect x="30" y="240" width="760" height="80" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="410" y="260" fill="#e6edf3" font-size="11" font-weight="bold" text-anchor="middle">Estructura de destino</text>
  <text x="160" y="284" fill="#58a6ff" font-size="10" text-anchor="middle">organized/video/2024-03/</text>
  <text x="160" y="300" fill="#8b949e" font-size="9" text-anchor="middle">canal9_spot-verano_raw_...mp4</text>
  <text x="410" y="284" fill="#3fb950" font-size="10" text-anchor="middle">organized/audio/2024-03/</text>
  <text x="410" y="300" fill="#8b949e" font-size="9" text-anchor="middle">canal9_spot-verano_raw_...wav</text>
  <text x="660" y="284" fill="#FFD43B" font-size="10" text-anchor="middle">organized/image/2024-03/</text>
  <text x="660" y="300" fill="#8b949e" font-size="9" text-anchor="middle">canal9_spot-verano_raw_...jpg</text>
</svg>
